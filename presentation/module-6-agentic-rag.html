<div class="slide title" data-sec="Title" data-notes="Last module of Day 2. Most of the room has heard of RAG; a good number have wired one up. This module builds it from the bottom -- embeddings, a vector store, chunking, the chain -- so that the pieces are yours rather than a recipe. Roughly 60-75 minutes with the quiz, then the labs.">
  <h1>Agentic RAG</h1>
  <div class="sub">Module 6 &middot; Day 2 &mdash; Retrieval-Augmented Generation with LangChain</div>
  <div class="rule"></div>
  <div class="meta">
    Agentic Workflows &amp; Multi-Agent Systems &middot; 3 days &middot; Advanced<br>
    Trainer: Rajesh Gheware
  </div>
</div>
<div class="slide" data-sec="Overview" data-notes="The spine of the module, as four questions rather than four topics. Say that each one is answered before the next is asked, and that by the fourth they will have built the thing. Ask the room, and keep the answers: which documents in your world would be worth making answerable this way? That is the capstone corpus, and it is a better question than any of mine.">
  <h2>Four questions, in this order</h2>
  <div class="body">
    <svg width="1180" height="330" viewBox="0 0 1180 330" role="img" aria-label="The four questions the module answers, in order">
      <rect x="40" y="20" width="540" height="130" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="66" y="56" class="bx">1 &middot; Why can&rsquo;t the model just answer?</text>
      <text x="66" y="90" class="bds">What it does instead of admitting it does not</text>
      <text x="66" y="114" class="bds">know &mdash; and what retrieval changes</text>

      <rect x="600" y="20" width="540" height="130" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="626" y="56" class="bx ok">2 &middot; How does a machine tell</text>
      <text x="626" y="84" class="bx ok">&ldquo;refund&rdquo; from &ldquo;return&rdquo;?</text>
      <text x="626" y="118" class="bds">Embeddings, and the arithmetic underneath</text>

      <rect x="40" y="170" width="540" height="130" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="66" y="206" class="bx am">3 &middot; Where do the vectors live?</text>
      <text x="66" y="240" class="bds">A store, its metadata, and how a real</text>
      <text x="66" y="264" class="bds">document gets cut up and put into one</text>

      <rect x="600" y="170" width="540" height="130" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2.5"/>
      <text x="626" y="206" class="bx">4 &middot; How does that become an answer</text>
      <text x="626" y="234" class="bx">you can check?</text>
      <text x="626" y="268" class="bds">The chain, the refusal, and the citation</text>
    </svg>
  </div>
  <div class="take"><b>Each one is answered before the next is asked</b> &mdash; and by the fourth you have built the thing, on your own corpus, in the labs.</div>
</div>
<div class="slide" data-sec="Why RAG" data-notes="The whole reason for the module, on one slide. Land the red band first and slowly: the failure is not that the model lacks your data, it is that lacking it looks exactly like having it. Then the three verbs, and note that the footers answer the band line for line -- your data rather than its training, in the prompt rather than the weights, checkable rather than plausible. The open-book analogy is worth saying out loud: the student is not smarter with the book open, they have stopped guessing.">
  <h2>Why RAG exists</h2>
  <div class="body">
    <svg width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-label="The problem with a model alone, and the three verbs that answer it">
      <rect x="40" y="6" width="1100" height="98" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="590" y="44" text-anchor="middle" class="bx no">A model knows a great deal, and none of it is your data</text>
      <text x="590" y="78" text-anchor="middle" class="bd">Worse: it does not go quiet when it does not know. It produces something fluent instead.</text>

      <line x1="590" y1="108" x2="590" y2="134" stroke="#4338ca" stroke-width="3" marker-end="url(#ai)"/>

      <rect x="30" y="142" width="360" height="200" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="210" y="184" text-anchor="middle" class="bx">Retrieve</text>
      <text x="210" y="224" text-anchor="middle" class="bds">Find the passages of your</text>
      <text x="210" y="248" text-anchor="middle" class="bds">own documents closest</text>
      <text x="210" y="272" text-anchor="middle" class="bds">to the question</text>
      <text x="210" y="318" text-anchor="middle" class="bxs">your data, not its training</text>

      <rect x="410" y="142" width="360" height="200" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="590" y="184" text-anchor="middle" class="bx">Augment</text>
      <text x="590" y="224" text-anchor="middle" class="bds">Put those passages into</text>
      <text x="590" y="248" text-anchor="middle" class="bds">the prompt as context,</text>
      <text x="590" y="272" text-anchor="middle" class="bds">beside the question</text>
      <text x="590" y="318" text-anchor="middle" class="bxs">in the prompt, not the weights</text>

      <rect x="790" y="142" width="360" height="200" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="970" y="184" text-anchor="middle" class="bx">Generate</text>
      <text x="970" y="224" text-anchor="middle" class="bds">Answer from that context,</text>
      <text x="970" y="248" text-anchor="middle" class="bds">and say which passage</text>
      <text x="970" y="272" text-anchor="middle" class="bds">each fact came from</text>
      <text x="970" y="318" text-anchor="middle" class="bxs">checkable, not just plausible</text>

      <line x1="396" y1="232" x2="404" y2="232" stroke="#4338ca" stroke-width="3" marker-end="url(#ai)"/>
      <line x1="776" y1="232" x2="784" y2="232" stroke="#4338ca" stroke-width="3" marker-end="url(#ai)"/>
    </svg>
  </div>
  <div class="take"><b>An open-book exam.</b> The student is no cleverer with the book open &mdash; they have simply stopped guessing, and you can check which page they used.</div>
</div>
<div class="slide" data-sec="Why RAG" data-notes="Two phases, and they run at completely different times. Indexing is a batch job you run when documents change; querying happens per question and has to be fast. Most RAG confusion in a design review comes from people arguing about one row while thinking about the other. The vector store is the only thing both rows touch.">
  <h2>The architecture, end to end</h2>
  <div class="body">
    <svg width="1180" height="330" viewBox="0 0 1180 330" role="img" aria-label="The indexing row and the querying row, joined by the vector store">
      <text x="60" y="22" class="lbl">Indexing &mdash; done once, when documents change</text>
      <rect x="60" y="36" width="300" height="92" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
      <text x="210" y="72" text-anchor="middle" class="bx">Documents</text>
      <text x="210" y="102" text-anchor="middle" class="bds">PDFs, web pages, CSVs</text>
      <rect x="440" y="36" width="300" height="92" rx="7" fill="#f0fdf9" stroke="#0d9488" stroke-width="2"/>
      <text x="590" y="72" text-anchor="middle" class="bx">Chunk &amp; embed</text>
      <text x="590" y="102" text-anchor="middle" class="bds">split, then vectorise</text>
      <rect x="820" y="36" width="300" height="92" rx="7" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="970" y="72" text-anchor="middle" class="bx">Vector store</text>
      <text x="970" y="102" text-anchor="middle" class="bds">ChromaDB</text>
      <line x1="366" y1="82" x2="434" y2="82" stroke="#4338ca" stroke-width="3" marker-end="url(#ai)"/>
      <line x1="746" y1="82" x2="814" y2="82" stroke="#4338ca" stroke-width="3" marker-end="url(#ai)"/>

      <text x="60" y="180" class="lbl">Querying &mdash; done per question</text>
      <rect x="60" y="194" width="300" height="92" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
      <text x="210" y="230" text-anchor="middle" class="bx">User query</text>
      <text x="210" y="260" text-anchor="middle" class="bds">&ldquo;What is our refund policy?&rdquo;</text>
      <rect x="440" y="194" width="300" height="92" rx="7" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="230" text-anchor="middle" class="bx">Similarity search</text>
      <text x="590" y="260" text-anchor="middle" class="bds">the top-k closest chunks</text>
      <rect x="820" y="194" width="300" height="92" rx="7" fill="#f0fdf9" stroke="#0d9488" stroke-width="2"/>
      <text x="970" y="230" text-anchor="middle" class="bx">Model + context</text>
      <text x="970" y="260" text-anchor="middle" class="bds">generate the answer</text>
      <line x1="366" y1="240" x2="434" y2="240" stroke="#4338ca" stroke-width="3" marker-end="url(#ai)"/>
      <line x1="746" y1="240" x2="814" y2="240" stroke="#4338ca" stroke-width="3" marker-end="url(#ai)"/>

      <path d="M970 132 V162 H590 V188" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#aa)"/>
      <text x="784" y="152" text-anchor="middle" class="bds am">the store the query searches</text>
    </svg>
  </div>
  <div class="take"><b>The vector store is the bridge</b> &mdash; the only thing both rows touch, and the reason indexing can be slow while querying stays fast.</div>
</div>
<div class="slide" data-sec="Embeddings" data-notes="The one piece of maths in the module, and it needs no maths. An embedding is a position. Similar meaning, nearby position. Do NOT give away the refund/return result here -- the next slide measures it, and the number lands harder than the assertion. Set up the arithmetic instead: no keyword index, no word matching, just two points and the angle between them.">
  <h2>Embedding models</h2>
  <div class="body">
    <svg width="1180" height="350" viewBox="0 0 1180 350" role="img" aria-label="What an embedding is, and why it matters for retrieval">
      <rect x="70" y="10" width="1040" height="82" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="590" y="44" text-anchor="middle" class="bd">An <tspan font-weight="600">embedding</tspan> is a vector &mdash; a list of numbers &mdash; that represents the <tspan font-style="italic">meaning</tspan> of a piece of text.</text>
      <text x="590" y="72" text-anchor="middle" class="bd">Texts that mean similar things produce vectors that sit close together.</text>

      <rect x="60" y="116" width="520" height="216" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="86" y="152" class="bxs">What it looks like</text>
      <text class="mono" x="86" y="192" xml:space="preserve"><tspan>"king"    -&gt; [ 0.21, -0.45,  0.87, ... ]</tspan></text>
      <text class="mono" x="86" y="220" xml:space="preserve"><tspan>"queen"   -&gt; [ 0.19, -0.42,  0.85, ... ]</tspan></text>
      <text class="mono" x="86" y="248" xml:space="preserve"><tspan>"bicycle" -&gt; [-0.76,  0.33, -0.12, ... ]</tspan></text>
      <text x="86" y="292" class="bds">King and queen sit close together in that space.</text>
      <text x="86" y="316" class="bds">Bicycle is a long way off.</text>

      <rect x="600" y="116" width="520" height="216" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2"/>
      <text x="626" y="152" class="bxs ok">Why it matters for retrieval</text>
      <text x="626" y="192" class="bd">Ask &ldquo;What is the return policy?&rdquo; and the</text>
      <text x="626" y="220" class="bd">embedding of your question is compared with</text>
      <text x="626" y="248" class="bd">the embedding of every chunk you indexed.</text>
      <text x="626" y="292" class="bds">The comparison is arithmetic &mdash; no keyword index,</text>
      <text x="626" y="316" class="bds">no word match. Two points, and the angle between them.</text>
    </svg>
  </div>
  <div class="take"><b>Coordinates for meaning.</b> The way GPS coordinates find you a nearby restaurant without knowing its name, embeddings find text that means the same thing in different words.</div>
</div>
<div class="slide" data-sec="Embeddings" data-notes="The scores are illustrative, not measured -- say so. What matters is the shape: there is no threshold in the box, so a score of 0.12 still comes back if you asked for top-3. Every one of these numbers is returned; you decide what to do with them. That is the floor conversation, and it is a lab.">

<div class="slide" data-sec="Embeddings" data-notes="Concept before API: this lands only after they know what an embedding is AND how two of them get compared, which is why it sits third in this run. Two methods are the entire contract -- embed_query for the question, embed_documents for the corpus. The class on the left is about ten lines wrapping all-MiniLM-L6-v2, the same model chromadb uses by default; the labs build it so the interface is visible rather than magic. Worth saying out loud: this model runs in the participant's own pod, so a kernel they left open two labs ago is still holding ~170 MB of it. That is the OOM they will otherwise hit in Lab 6.8.">
  <h2>Embeddings in LangChain</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="The Embeddings interface and the model this sandbox uses">
      <rect x="40" y="14" width="660" height="360" rx="8" class="cp"/>
      <text class="co" x="64" y="52" xml:space="preserve"><tspan class="k">from</tspan><tspan> langchain_core.embeddings </tspan><tspan class="k">import</tspan><tspan> Embeddings</tspan></text>
      <text class="co" x="64" y="104" xml:space="preserve"><tspan class="k">class</tspan><tspan> </tspan><tspan class="f">MiniLMEmbeddings</tspan><tspan>(Embeddings):</tspan></text>
      <text class="co" x="64" y="130" xml:space="preserve"><tspan>    </tspan><tspan class="k">def</tspan><tspan> </tspan><tspan class="f">embed_query</tspan><tspan>(self, text): ...</tspan></text>
      <text class="co" x="64" y="156" xml:space="preserve"><tspan>    </tspan><tspan class="k">def</tspan><tspan> </tspan><tspan class="f">embed_documents</tspan><tspan>(self, texts): ...</tspan></text>
      <text class="co" x="64" y="200" xml:space="preserve"><tspan class="c"># all-MiniLM-L6-v2, on this pod's CPU. No key, no gateway.</tspan></text>
      <text class="co" x="64" y="244" xml:space="preserve"><tspan>emb = MiniLMEmbeddings()</tspan></text>
      <text class="co" x="64" y="270" xml:space="preserve"><tspan>vec = emb.</tspan><tspan class="f">embed_query</tspan><tspan>("What is the refund policy?")</tspan></text>
      <text class="co" x="64" y="296" xml:space="preserve"><tspan>len(vec)</tspan><tspan class="c">      # 384</tspan></text>
      <text class="co" x="64" y="340" xml:space="preserve"><tspan class="c"># swap the class and the store, splitter and chain</tspan></text>
      <text class="co" x="64" y="362" xml:space="preserve"><tspan class="c"># never notice. That is the whole point of the interface.</tspan></text>

      <rect x="726" y="14" width="414" height="360" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="752" y="52" class="bxs">Two methods are the contract</text>
      <text x="752" y="86" class="bds">embed_query for the question,</text>
      <text x="752" y="110" class="bds">embed_documents for the corpus.</text>
      <text x="752" y="134" class="bds">There is nothing else to implement.</text>

      <text x="752" y="186" class="bxs">384 dimensions, ~170 MB</text>
      <text x="752" y="220" class="bds">It runs beside your notebook, not</text>
      <text x="752" y="244" class="bds">on a gateway &mdash; so every kernel you</text>
      <text x="752" y="268" class="bds">leave open holds its own copy.</text>

      <text x="752" y="320" class="bxs ok">Everything downstream is identical</text>
      <text x="752" y="354" class="bds">Store, splitter and chain never know.</text>
    </svg>
  </div>
  <div class="take"><b>Two methods, and that is the whole contract.</b> Everything downstream &mdash; the splitter, the store, the retriever, the chain &mdash; is written against those two and never learns which model answered.</div>
</div>
<div class="slide" data-sec="Vector stores" data-notes="The comparison is not that one is better. SQL answers a question you can already phrase exactly; a vector store answers one you can only gesture at. Most real systems end up with both, and the metadata filter on the next slides is where they meet.">
  <h2>What a vector store is</h2>
  <div class="body">
    <svg width="1180" height="380" viewBox="0 0 1180 380" role="img" aria-label="A relational database compared with a vector store">
      <text x="590" y="24" text-anchor="middle" class="lbl">A database built for similarity search rather than exact match</text>

      <rect x="40" y="44" width="540" height="310" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2.5"/>
      <text x="66" y="84" class="bx">Relational database</text>
      <text x="66" y="128" class="bd">&bull; Stores rows and columns</text>
      <text x="66" y="164" class="bd">&bull; Matches exactly</text>
      <text class="mono" x="66" y="204"><tspan>   WHERE city = 'Mumbai'</tspan></text>
      <text x="66" y="248" class="bd">&bull; Cannot search by meaning</text>
      <text x="66" y="312" class="bxs">&ldquo;Find rows where city is Mumbai&rdquo;</text>
      <text x="66" y="338" class="bds">&mdash; you must already know the word</text>

      <rect x="600" y="44" width="540" height="310" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="626" y="84" class="bx ok">Vector store</text>
      <text x="626" y="128" class="bd">&bull; Stores vectors, text and metadata together</text>
      <text x="626" y="164" class="bd">&bull; Ranks by closeness of meaning</text>
      <text class="mono ok" x="626" y="204"><tspan>   query_texts=["Indian cities"]</tspan></text>
      <text x="626" y="248" class="bd">&bull; Returns k results, ranked, always</text>
      <text x="626" y="312" class="bxs ok">&ldquo;Find documents about Indian cities&rdquo;</text>
      <text x="626" y="338" class="bds">&mdash; the word Mumbai need not appear</text>
    </svg>
  </div>
  <div class="take"><b>A filing cabinet against a librarian.</b> The cabinet needs the exact label; the librarian understands the question &mdash; even when you use none of the words on the spine.</div>
</div>
<div class="slide" data-sec="Vector stores" data-notes="Merged slide: what a document actually is inside the store, and where Chroma sits against the alternatives. The four fields matter more than any architecture diagram -- the id is the one people forget exists until re-indexing day. Say the table out loud: somebody in the room runs Pinecone and will otherwise spend the lab wondering whether any of this transfers. It does; as_retriever() returns the same object whichever store is underneath.">

<div class="slide" data-sec="Vector stores" data-notes="First code slide of part two. The collection is the unit of separation -- one per corpus, or per tenant, and it is far easier to get right at the start than to retrofit. Point at the metadatas list: those dictionaries are the difference between a demo and something a compliance team will accept.">
  <h2>Collections and metadata</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="Creating a Chroma collection and adding documents with metadata">
      <rect x="50" y="10" width="1080" height="380" rx="8" class="cp"/>
      <text class="co" x="76" y="48" xml:space="preserve"><tspan class="k">import</tspan><tspan> chromadb</tspan></text>
      <text class="co" x="76" y="98" xml:space="preserve"><tspan class="c"># a client that keeps what you write</tspan></text>
      <text class="co" x="76" y="124" xml:space="preserve"><tspan>client = chromadb.</tspan><tspan class="f">PersistentClient</tspan><tspan>(path="./chroma_db")</tspan></text>
      <text class="co" x="76" y="174" xml:space="preserve"><tspan class="c"># a collection is the unit of separation -- one per corpus</tspan></text>
      <text class="co" x="76" y="200" xml:space="preserve"><tspan>collection = client.</tspan><tspan class="f">get_or_create_collection</tspan><tspan>("company_docs")</tspan></text>
      <text class="co" x="76" y="250" xml:space="preserve"><tspan>collection.</tspan><tspan class="f">add</tspan><tspan>(</tspan></text>
      <text class="co" x="76" y="276" xml:space="preserve"><tspan>    documents=["Refund within 30 days of purchase",</tspan></text>
      <text class="co" x="76" y="302" xml:space="preserve"><tspan>               "Free shipping on orders above Rs 500"],</tspan></text>
      <text class="co" x="76" y="328" xml:space="preserve"><tspan>    metadatas=[{"source": "policy.pdf", "page": </tspan><tspan class="s">3</tspan><tspan>},</tspan></text>
      <text class="co" x="76" y="354" xml:space="preserve"><tspan>               {"source": "policy.pdf", "page": </tspan><tspan class="s">7</tspan><tspan>}],</tspan></text>
      <text class="co" x="76" y="380" xml:space="preserve"><tspan>    ids=["doc1", "doc2"])</tspan></text>
    </svg>
  </div>
  <div class="take"><b>Metadata is the filter you will actually use.</b> Similarity narrows by meaning; metadata narrows by fact &mdash; source, page, date, entitlement. Production retrieval is nearly always both.</div>
</div>
<div class="slide" data-sec="Vector stores" data-notes="The important line is the one nobody reads: distances. It comes back on every query, and it is the only signal you have that the top hit is rubbish. Nothing in Chroma will refuse to answer -- ask for three and you get three. The where clause is the second half of the story.">
  <h2>Querying a collection</h2>
  <div class="body">
    <svg width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-label="A similarity query, what it returns, and a metadata-filtered query">
      <rect x="50" y="6" width="1080" height="396" rx="8" class="cp"/>
      <text class="co" x="76" y="42" xml:space="preserve"><tspan class="c"># plain similarity search</tspan></text>
      <text class="co" x="76" y="68" xml:space="preserve"><tspan>results = collection.</tspan><tspan class="f">query</tspan><tspan>(</tspan></text>
      <text class="co" x="76" y="94" xml:space="preserve"><tspan>    query_texts=["How do I return a product?"],</tspan></text>
      <text class="co" x="76" y="120" xml:space="preserve"><tspan>    n_results=</tspan><tspan class="s">3</tspan><tspan>)</tspan></text>
      <text class="co" x="76" y="172" xml:space="preserve"><tspan>results["documents"]</tspan><tspan class="c">   # [["Refund within 30 days...", ...]]</tspan></text>
      <text class="co" x="76" y="198" xml:space="preserve"><tspan>results["metadatas"]</tspan><tspan class="c">   # [[{"source": "policy.pdf", "page": 3}]]</tspan></text>
      <text class="co" x="76" y="224" xml:space="preserve"><tspan>results["distances"]</tspan><tspan class="c">   # [[0.34, ...]]   lower is closer</tspan></text>
      <text class="co" x="76" y="276" xml:space="preserve"><tspan class="c"># the same search, scoped to one source</tspan></text>
      <text class="co" x="76" y="302" xml:space="preserve"><tspan>results = collection.</tspan><tspan class="f">query</tspan><tspan>(</tspan></text>
      <text class="co" x="76" y="328" xml:space="preserve"><tspan>    query_texts=["shipping info"],</tspan></text>
      <text class="co" x="76" y="354" xml:space="preserve"><tspan>    n_results=</tspan><tspan class="s">3</tspan><tspan>,</tspan></text>
      <text class="co" x="76" y="380" xml:space="preserve"><tspan>    where={"source": "policy.pdf"})</tspan><tspan class="c">   # metadata filter</tspan></text>
    </svg>
  </div>
  <div class="take"><b>You asked in one vocabulary and matched another</b> &mdash; &ldquo;return a product&rdquo; found &ldquo;refund within 30 days&rdquo;. Note also that asking for three always gets three, however bad the third one is.</div>
</div>
<div class="slide" data-sec="Ingestion" data-notes="Four steps, and only one of them is interesting. Loaders are a solved problem -- point at the list, say that all of them hand back the same Document object, and move on. Do NOT teach splitting here; the next slide does it with the code and the failure. The handoff line at the bottom is the point of this slide.">
  <h2>Getting documents in</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="The load, split, embed, store pipeline, and the loaders LangChain provides">
      <text x="590" y="22" text-anchor="middle" class="lbl">The ingestion pipeline &mdash; run once, and again whenever documents change</text>

      <rect x="40" y="40" width="230" height="84" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
      <text x="155" y="74" text-anchor="middle" class="bx">Load</text>
      <text x="155" y="102" text-anchor="middle" class="bds">PDF, web, CSV</text>
      <rect x="330" y="40" width="230" height="84" rx="7" fill="#f0fdf9" stroke="#0d9488" stroke-width="2"/>
      <text x="445" y="74" text-anchor="middle" class="bx">Split</text>
      <text x="445" y="102" text-anchor="middle" class="bds">into chunks</text>
      <rect x="620" y="40" width="230" height="84" rx="7" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="735" y="74" text-anchor="middle" class="bx">Embed</text>
      <text x="735" y="102" text-anchor="middle" class="bds">one vector per chunk</text>
      <rect x="910" y="40" width="230" height="84" rx="7" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="1025" y="74" text-anchor="middle" class="bx">Store</text>
      <text x="1025" y="102" text-anchor="middle" class="bds">ChromaDB</text>
      <line x1="276" y1="82" x2="324" y2="82" stroke="#4338ca" stroke-width="3" marker-end="url(#ai)"/>
      <line x1="566" y1="82" x2="614" y2="82" stroke="#4338ca" stroke-width="3" marker-end="url(#ai)"/>
      <line x1="856" y1="82" x2="904" y2="82" stroke="#4338ca" stroke-width="3" marker-end="url(#ai)"/>

      <rect x="40" y="156" width="1100" height="232" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="66" y="194" class="bxs">Document loaders &mdash; a solved problem</text>

      <text x="66" y="240" class="mono">PyPDFLoader</text>
      <text x="330" y="240" class="bds">PDF files, one Document per page</text>
      <text x="620" y="240" class="mono">WebBaseLoader</text>
      <text x="884" y="240" class="bds">web pages</text>

      <text x="66" y="286" class="mono">CSVLoader</text>
      <text x="330" y="286" class="bds">CSV files, one per row</text>
      <text x="620" y="286" class="mono">TextLoader</text>
      <text x="884" y="286" class="bds">plain text</text>

      <text x="66" y="346" class="bd">All four hand back the <tspan font-weight="600">same</tspan> <tspan font-style="italic">Document</tspan> objects, so nothing downstream ever</text>
      <text x="66" y="372" class="bd">learns whether the text arrived as a PDF, a web page or a row in a spreadsheet.</text>
    </svg>
  </div>
  <div class="take"><b>Only one of these four is a decision.</b> Loading is solved and storing is one call &mdash; <b>Split</b> is the step that decides what you can ever retrieve, and it is the next slide.</div>
</div>
<div class="slide" data-sec="Ingestion" data-notes="The chunk size argument in one slide. Too big and the vector is an average of several ideas, so it is close to nothing in particular. Too small and a rule gets separated from the exception that qualifies it -- and no retriever on earth can put them back together. Overlap is the cheap insurance against a cut landing mid-sentence.">
  <h2>Splitting: why, and how much</h2>
  <div class="body">
    <svg width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-label="A text splitter in code, and what chunk size does to retrieval">
      <text x="590" y="20" text-anchor="middle" class="lbl">A document is far too long to be one embedding</text>

      <rect x="40" y="34" width="660" height="310" rx="8" class="cp"/>
      <text class="co" x="64" y="70" xml:space="preserve"><tspan class="k">from</tspan><tspan> langchain_text_splitters </tspan><tspan class="k">import</tspan><tspan> (</tspan></text>
      <text class="co" x="64" y="96" xml:space="preserve"><tspan>    RecursiveCharacterTextSplitter)</tspan></text>
      <text class="co" x="64" y="146" xml:space="preserve"><tspan>splitter = </tspan><tspan class="f">RecursiveCharacterTextSplitter</tspan><tspan>(</tspan></text>
      <text class="co" x="64" y="172" xml:space="preserve"><tspan>    chunk_size=</tspan><tspan class="s">500</tspan><tspan>,</tspan><tspan class="c">      # characters in a chunk</tspan></text>
      <text class="co" x="64" y="198" xml:space="preserve"><tspan>    chunk_overlap=</tspan><tspan class="s">50</tspan><tspan>,</tspan><tspan class="c">    # carried across each cut</tspan></text>
      <text class="co" x="64" y="224" xml:space="preserve"><tspan>    separators=["\n\n", "\n", " ", ""])</tspan></text>
      <text class="co" x="64" y="274" xml:space="preserve"><tspan>chunks = splitter.</tspan><tspan class="f">split_documents</tspan><tspan>(pages)</tspan></text>
      <text class="co" x="64" y="316" xml:space="preserve"><tspan class="c"># it tries each separator in turn, so a paragraph</tspan></text>
      <text class="co" x="64" y="338" xml:space="preserve"><tspan class="c"># survives whole wherever it can</tspan></text>

      <rect x="730" y="34" width="410" height="146" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="756" y="72" class="bxs no">Chunks too large &mdash; 5,000+</text>
      <text x="756" y="106" class="bds">The vector averages several ideas, so</text>
      <text x="756" y="130" class="bds">it is close to nothing in particular and</text>
      <text x="756" y="154" class="bds">retrieval returns vaguely related prose.</text>

      <rect x="730" y="198" width="410" height="146" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="756" y="236" class="bxs ok">Right-sized &mdash; 200 to 1,000</text>
      <text x="756" y="270" class="bds">One chunk, one idea, so the vector</text>
      <text x="756" y="294" class="bds">means something. Overlap keeps a</text>
      <text x="756" y="318" class="bds">sentence that straddles a cut findable.</text>
    </svg>
  </div>
  <div class="take"><b>The cut decides what can ever be retrieved together.</b> Separate a rule from the exception that qualifies it and no amount of model quality will put them back.</div>
</div>
<div class="slide" data-sec="Ingestion" data-notes="Three steps and one call. Chroma.from_documents does the embedding and the writing together, which is convenient and also where people lose track of cost -- it embeds every chunk. persist_directory is what stops you paying for that twice.">
  <h2>LangChain and Chroma: the whole ingestion</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="Loading, splitting and storing a PDF in Chroma">
      <rect x="50" y="10" width="1080" height="380" rx="8" class="cp"/>
      <text class="co" x="76" y="48" xml:space="preserve"><tspan class="k">from</tspan><tspan> langchain_community.document_loaders </tspan><tspan class="k">import</tspan><tspan> PyPDFLoader</tspan></text>
      <text class="co" x="76" y="74" xml:space="preserve"><tspan class="k">from</tspan><tspan> langchain_text_splitters </tspan><tspan class="k">import</tspan><tspan> RecursiveCharacterTextSplitter</tspan></text>
      <text class="co" x="76" y="100" xml:space="preserve"><tspan class="k">from</tspan><tspan> langchain_chroma </tspan><tspan class="k">import</tspan><tspan> Chroma</tspan></text>
      <text class="co" x="76" y="152" xml:space="preserve"><tspan>pages    = </tspan><tspan class="f">PyPDFLoader</tspan><tspan>("company_policy.pdf").load()</tspan><tspan class="c">    # 1. load</tspan></text>
      <text class="co" x="76" y="192" xml:space="preserve"><tspan>splitter = </tspan><tspan class="f">RecursiveCharacterTextSplitter</tspan><tspan>(chunk_size=500,</tspan></text>
      <text class="co" x="76" y="218" xml:space="preserve"><tspan>                                            chunk_overlap=50)</tspan></text>
      <text class="co" x="76" y="244" xml:space="preserve"><tspan>chunks   = splitter.</tspan><tspan class="f">split_documents</tspan><tspan>(pages)</tspan><tspan class="c">                 # 2. split</tspan></text>
      <text class="co" x="76" y="296" xml:space="preserve"><tspan>vectorstore = Chroma.</tspan><tspan class="f">from_documents</tspan><tspan>(</tspan><tspan class="c">                       # 3. embed + store</tspan></text>
      <text class="co" x="76" y="322" xml:space="preserve"><tspan>    documents=chunks,</tspan></text>
      <text class="co" x="76" y="348" xml:space="preserve"><tspan>    embedding=</tspan><tspan class="f">MiniLMEmbeddings</tspan><tspan>(),</tspan><tspan class="c">   # the model from part one</tspan></text>
      <text class="co" x="76" y="374" xml:space="preserve"><tspan>    persist_directory="./chroma_db")</tspan></text>
    </svg>
  </div>
  <div class="take"><b>Load, split, store.</b> One call embeds every chunk and writes it &mdash; and <code>persist_directory</code> is what stops you paying for that on every restart.</div>
</div>
<div class="slide" data-sec="The RAG chain" data-notes="A retriever is just a Runnable: string in, list of Documents out. That is why it drops into a chain later without ceremony. Two dials -- k and search_type -- and neither is a project-level setting: a broad question and a specific one want different values, which is the point to leave them with. mmr was defined on the methods slide; do not re-explain it here.">
  <h2>Creating a retriever</h2>
  <div class="body">
    <svg width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-label="Turning a vector store into a retriever and calling it">
      <text x="590" y="20" text-anchor="middle" class="lbl">The bridge between the store and the chain</text>

      <rect x="40" y="34" width="700" height="310" rx="8" class="cp"/>
      <text class="co" x="64" y="72" xml:space="preserve"><tspan>retriever = vectorstore.</tspan><tspan class="f">as_retriever</tspan><tspan>(</tspan></text>
      <text class="co" x="64" y="98" xml:space="preserve"><tspan>    search_type="similarity",</tspan><tspan class="c">   # or "mmr" for variety</tspan></text>
      <text class="co" x="64" y="124" xml:space="preserve"><tspan>    search_kwargs={"k": </tspan><tspan class="s">3</tspan><tspan>})</tspan><tspan class="c">        # top three</tspan></text>
      <text class="co" x="64" y="176" xml:space="preserve"><tspan>docs = retriever.</tspan><tspan class="f">invoke</tspan><tspan>("What is the refund policy?")</tspan></text>
      <text class="co" x="64" y="228" xml:space="preserve"><tspan class="k">for</tspan><tspan> d </tspan><tspan class="k">in</tspan><tspan> docs:</tspan></text>
      <text class="co" x="64" y="254" xml:space="preserve"><tspan>    print(d.page_content)</tspan><tspan class="c">     # the text</tspan></text>
      <text class="co" x="64" y="280" xml:space="preserve"><tspan>    print(d.metadata)</tspan><tspan class="c">         # {"source": "policy.pdf", "page": 3}</tspan></text>
      <text class="co" x="64" y="324" xml:space="preserve"><tspan class="c"># a Runnable like any other -- which is why it pipes</tspan></text>

      <rect x="770" y="34" width="370" height="310" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="796" y="72" class="bxs">str in, list[Document] out</text>
      <text x="796" y="106" class="bds">That is the whole interface, and</text>
      <text x="796" y="130" class="bds">it is why a retriever drops into</text>
      <text x="796" y="154" class="bds">an LCEL chain without ceremony.</text>

      <text x="796" y="206" class="bxs">Two dials, and that is all</text>
      <text x="796" y="240" class="bds">k &mdash; how many come back.</text>
      <text x="796" y="264" class="bds">search_type &mdash; similarity, or mmr</text>
      <text x="796" y="288" class="bds">Both are decisions you re-make per</text>
      <text x="796" y="312" class="bds">kind of question, not once per project.</text>
    </svg>
  </div>
  <div class="take"><b>A research assistant, not an author.</b> It brings back pages; it never answers. The answering is the next slide, and keeping those two apart is what makes either one debuggable.</div>
</div>
<div class="slide" data-sec="The RAG chain" data-notes="This is the Module 2 chain with one addition -- say that explicitly, because half the room built it on Day 1 and will otherwise think RAG is a new mechanism. The dictionary at the front is the trick: two keys, filled by two different things, one of which happens to be a retriever.">
  <h2>The RAG chain</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="A retrieval-augmented chain built with LCEL">
      <rect x="50" y="4" width="1080" height="386" rx="8" class="cp"/>
      <text class="co" x="76" y="40" xml:space="preserve"><tspan class="k">from</tspan><tspan> langchain_openai </tspan><tspan class="k">import</tspan><tspan> ChatOpenAI</tspan></text>
      <text class="co" x="76" y="66" xml:space="preserve"><tspan class="k">from</tspan><tspan> langchain_core.prompts </tspan><tspan class="k">import</tspan><tspan> ChatPromptTemplate</tspan></text>
      <text class="co" x="76" y="92" xml:space="preserve"><tspan class="k">from</tspan><tspan> langchain_core.output_parsers </tspan><tspan class="k">import</tspan><tspan> StrOutputParser</tspan></text>
      <text class="co" x="76" y="118" xml:space="preserve"><tspan class="k">from</tspan><tspan> langchain_core.runnables </tspan><tspan class="k">import</tspan><tspan> RunnablePassthrough</tspan></text>
      <text class="co" x="76" y="164" xml:space="preserve"><tspan class="c"># the sandbox gateway -- these three come from your environment</tspan></text>
      <text class="co" x="76" y="190" xml:space="preserve"><tspan>llm = </tspan><tspan class="f">ChatOpenAI</tspan><tspan>(model=LLM_MODEL, base_url=LLM_BASE_URL, api_key=LLM_API_KEY)</tspan></text>
      <text class="co" x="76" y="236" xml:space="preserve"><tspan>prompt = ChatPromptTemplate.</tspan><tspan class="f">from_template</tspan><tspan>(</tspan></text>
      <text class="co" x="76" y="262" xml:space="preserve"><tspan>    "Answer from the context below. If it does not contain the answer, "</tspan></text>
      <text class="co" x="76" y="288" xml:space="preserve"><tspan>    "say you do not know.\n\nContext: {context}\nQuestion: {question}")</tspan></text>
      <text class="co" x="76" y="334" xml:space="preserve"><tspan>rag_chain = ({"context": retriever, "question": </tspan><tspan class="f">RunnablePassthrough</tspan><tspan>()}</tspan></text>
      <text class="co" x="76" y="360" xml:space="preserve"><tspan>             | prompt | llm | </tspan><tspan class="f">StrOutputParser</tspan><tspan>())</tspan></text>
      <text class="co" x="76" y="386" xml:space="preserve"><tspan>rag_chain.</tspan><tspan class="f">invoke</tspan><tspan>("What is the refund policy?")</tspan></text>
    </svg>
  </div>
</div>
<div class="slide" data-sec="The RAG chain" data-notes="Walk the five rows in order and let people see that nothing magic happens. The row worth pausing on is 2: the retriever gets the raw user question, which is exactly the limitation a proper agent removes later -- it would write its own query instead.">
  <h2>What happens inside that chain</h2>
  <div class="body">
    <svg width="1180" height="390" viewBox="0 0 1180 390" role="img" aria-label="The five steps a RAG chain runs, with input and output at each">
      <rect x="30" y="10" width="1120" height="44" fill="#eef2ff"/>
      <text x="54" y="39" class="lbl">Step</text>
      <text x="130" y="39" class="lbl">Component</text>
      <text x="430" y="39" class="lbl">Given</text>
      <text x="810" y="39" class="lbl">Returns</text>
      <rect x="30" y="10" width="1120" height="368" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <line x1="30" y1="54" x2="1150" y2="54" stroke="#94a3b8" stroke-width="2"/>
      <line x1="30" y1="119" x2="1150" y2="119" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="30" y1="184" x2="1150" y2="184" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="30" y1="249" x2="1150" y2="249" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="30" y1="314" x2="1150" y2="314" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="110" y1="10" x2="110" y2="378" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="410" y1="10" x2="410" y2="378" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="790" y1="10" x2="790" y2="378" stroke="#cbd5e1" stroke-width="1.5"/>

      <text x="60" y="94" class="num">1</text>
      <text class="mono" x="130" y="94"><tspan>RunnablePassthrough</tspan></text>
      <text x="430" y="94" class="bds">the user's question</text>
      <text x="810" y="94" class="bds">the same string, untouched</text>

      <text x="60" y="159" class="num">2</text>
      <text class="mono" x="130" y="159"><tspan>retriever</tspan></text>
      <text x="430" y="159" class="bds">the user's question, verbatim</text>
      <text x="810" y="159" class="bds">the top-k Document chunks</text>

      <text x="60" y="224" class="num">3</text>
      <text class="mono" x="130" y="224"><tspan>ChatPromptTemplate</tspan></text>
      <text x="430" y="224" class="bds">context and question together</text>
      <text x="810" y="224" class="bds">a formatted prompt</text>

      <text x="60" y="289" class="num">4</text>
      <text class="mono" x="130" y="289"><tspan>ChatOpenAI</tspan></text>
      <text x="430" y="289" class="bds">that prompt</text>
      <text x="810" y="289" class="bds">an AIMessage, grounded in it</text>

      <text x="60" y="354" class="num">5</text>
      <text class="mono" x="130" y="354"><tspan>StrOutputParser</tspan></text>
      <text x="430" y="354" class="bds">the AIMessage</text>
      <text x="810" y="354" class="bds">a plain answer string</text>
    </svg>
  </div>
  <div class="take"><b>The same pipe as Module 2</b>, with one addition: the retriever fills the context before the prompt is built. The model never sees a document it was not handed.</div>
</div>
<div class="slide" data-sec="The RAG chain" data-notes="Two changes, both small: the context is formatted with its source, and the prompt asks for the citation. That is all it takes -- and it is the single highest-value thing in this module for a regulated setting, because it turns an answer into something a second person can check.">
  <h2>Answers that say where they came from</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="Formatting retrieved documents with their source so the answer can cite them">
      <rect x="50" y="4" width="1080" height="386" rx="8" class="cp"/>
      <text class="co" x="76" y="40" xml:space="preserve"><tspan>prompt = ChatPromptTemplate.</tspan><tspan class="f">from_template</tspan><tspan>(</tspan></text>
      <text class="co" x="76" y="66" xml:space="preserve"><tspan>    "Answer using ONLY the context below. Cite the source and page "</tspan></text>
      <text class="co" x="76" y="92" xml:space="preserve"><tspan>    "for every fact.\n\nContext:\n{context}\n\nQuestion: {question}")</tspan></text>
      <text class="co" x="76" y="144" xml:space="preserve"><tspan class="c"># the source has to be IN the context, or it cannot be cited</tspan></text>
      <text class="co" x="76" y="170" xml:space="preserve"><tspan class="k">def</tspan><tspan> </tspan><tspan class="f">format_docs</tspan><tspan>(docs):</tspan></text>
      <text class="co" x="76" y="196" xml:space="preserve"><tspan>    </tspan><tspan class="k">return</tspan><tspan> "\n\n".join(</tspan></text>
      <text class="co" x="76" y="222" xml:space="preserve"><tspan>        f"[{d.metadata['source']}, page {d.metadata.get('page', '?')}]"</tspan></text>
      <text class="co" x="76" y="248" xml:space="preserve"><tspan>        f"\n{d.page_content}"</tspan></text>
      <text class="co" x="76" y="274" xml:space="preserve"><tspan>        </tspan><tspan class="k">for</tspan><tspan> d </tspan><tspan class="k">in</tspan><tspan> docs)</tspan></text>
      <text class="co" x="76" y="326" xml:space="preserve"><tspan>rag_chain = ({"context": retriever | </tspan><tspan class="f">format_docs</tspan><tspan>,</tspan></text>
      <text class="co" x="76" y="352" xml:space="preserve"><tspan>              "question": </tspan><tspan class="f">RunnablePassthrough</tspan><tspan>()}</tspan></text>
      <text class="co" x="76" y="378" xml:space="preserve"><tspan>             | prompt | llm | </tspan><tspan class="f">StrOutputParser</tspan><tspan>())</tspan></text>
    </svg>
  </div>
  <div class="take"><b>You get:</b> &ldquo;Returns are accepted within 30 days (policy.pdf, page 3).&rdquo; The citation is what makes a right answer checkable &mdash; and a wrong one findable.</div>
</div>
<div class="slide" data-sec="Where it goes" data-notes="The taxonomy, and where this module sits in it. Naive is what the labs build, and it is not an insult -- a great many production systems are naive RAG with good chunking. Agentic is the destination and the reason this module carries that name: the agent decides whether to retrieve, what to ask for, and whether to ask again.">
  <h2>Four RAG patterns</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Naive, advanced, modular and agentic RAG compared">
      <rect x="30" y="10" width="560" height="190" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="56" y="48" class="bx">Naive RAG</text>
      <text x="56" y="80" class="bds">Retrieve, then generate. Always, in that order.</text>
      <text x="56" y="112" class="bds">&bull; embed the question &nbsp;&bull; take the top k</text>
      <text x="56" y="140" class="bds">&bull; hand the chunks to the model</text>
      <text x="56" y="180" class="bxs">What today's labs build &mdash; and plenty of production</text>

      <rect x="610" y="10" width="540" height="190" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="636" y="48" class="bx ok">Advanced RAG</text>
      <text x="636" y="80" class="bds">The same pipeline, with work either side of it.</text>
      <text x="636" y="112" class="bds">&bull; rewrite or expand the query</text>
      <text x="636" y="140" class="bds">&bull; re-rank &nbsp;&bull; hybrid keyword and semantic search</text>
      <text x="636" y="180" class="bxs ok">Where most production systems end up</text>

      <rect x="30" y="220" width="560" height="190" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="56" y="258" class="bx am">Modular RAG</text>
      <text x="56" y="290" class="bds">Pieces you can swap without touching the rest.</text>
      <text x="56" y="322" class="bds">&bull; pluggable retrievers &nbsp;&bull; several stores</text>
      <text x="56" y="350" class="bds">&bull; routing by the kind of question asked</text>
      <text x="56" y="390" class="bxs am">A structural choice, not a quality one</text>

      <rect x="610" y="220" width="540" height="190" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="636" y="258" class="bx no">Agentic RAG</text>
      <text x="636" y="290" class="bds">Retrieval becomes a tool the agent chooses.</text>
      <text x="636" y="322" class="bds">&bull; whether to retrieve at all</text>
      <text x="636" y="350" class="bds">&bull; what to ask for &nbsp;&bull; whether to ask again</text>
      <text x="636" y="390" class="bxs no">Three decisions move from build time to run time</text>
    </svg>
  </div>
</div>
<div class="slide" data-sec="Where it goes" data-notes="Tell people to photograph this one. It is the import list for every lab in the module, and the only row that differs from a laptop with internet is the embeddings row.">
  <h2>Quick reference</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="What you want, the LangChain class, and where to import it from">
      <rect x="30" y="6" width="1120" height="40" fill="#eef2ff"/>
      <text x="54" y="33" class="lbl">What you want</text>
      <text x="384" y="33" class="lbl">Class</text>
      <text x="714" y="33" class="lbl">Import from</text>
      <rect x="30" y="6" width="1120" height="382" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <line x1="30" y1="46" x2="1150" y2="46" stroke="#94a3b8" stroke-width="2"/>
      <line x1="30" y1="95" x2="1150" y2="95" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="30" y1="144" x2="1150" y2="144" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="30" y1="193" x2="1150" y2="193" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="30" y1="242" x2="1150" y2="242" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="30" y1="291" x2="1150" y2="291" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="30" y1="340" x2="1150" y2="340" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="360" y1="6" x2="360" y2="388" stroke="#cbd5e1" stroke-width="1.5"/>
      <line x1="690" y1="6" x2="690" y2="388" stroke="#cbd5e1" stroke-width="1.5"/>

      <text x="54" y="77" class="bds">Load PDFs</text>
      <text class="mono" x="384" y="77"><tspan>PyPDFLoader</tspan></text>
      <text class="mono" x="714" y="77"><tspan>langchain_community.document_loaders</tspan></text>

      <text x="54" y="126" class="bds">Load web pages</text>
      <text class="mono" x="384" y="126"><tspan>WebBaseLoader</tspan></text>
      <text class="mono" x="714" y="126"><tspan>langchain_community.document_loaders</tspan></text>

      <text x="54" y="175" class="bds">Split documents</text>
      <text class="mono" x="384" y="175"><tspan>RecursiveCharacterTextSplitter</tspan></text>
      <text class="mono" x="714" y="175"><tspan>langchain_text_splitters</tspan></text>

      <text x="54" y="224" class="bds">Embed text</text>
      <text class="mono" x="384" y="224"><tspan>Embeddings subclass</tspan></text>
      <text class="mono" x="714" y="224"><tspan>langchain_core.embeddings</tspan></text>

      <text x="54" y="273" class="bds">Store and search vectors</text>
      <text class="mono" x="384" y="273"><tspan>Chroma</tspan></text>
      <text class="mono" x="714" y="273"><tspan>langchain_chroma</tspan></text>

      <text x="54" y="322" class="bds">Pass the question through</text>

<script>
(function(){
  var stage = document.getElementById('stage');
  stage.appendChild(document.getElementById('deck').content.cloneNode(true));
  var slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));
  var i = 0, total = slides.length;

  var num = document.getElementById('num'),
      progf = document.getElementById('progf'),
      secname = document.getElementById('secname'),
      toc = document.getElementById('toc'),
      toclist = document.getElementById('toclist'),
      notes = document.getElementById('notes'),
      notesbody = document.getElementById('notesbody');

  /* ---- build the index, grouped by section ---- */
  var groups = [], last = null;
  slides.forEach(function(s, n){
    var sec = s.getAttribute('data-sec') || '';
    if (sec !== last) { groups.push({sec: sec, items: []}); last = sec; }
    var h = s.querySelector('h2, h1'), q = s.querySelector('.qtag');
    var t = h ? h.textContent.trim() : sec;
    if (q) t = q.textContent.trim() + ' \u2014 ' + t;
    groups[groups.length-1].items.push({n: n, t: t});
  });
  groups.forEach(function(g){
    var d = document.createElement('div'); d.className = 'grp';
    var hd = document.createElement('div'); hd.className = 'grph'; hd.textContent = g.sec; d.appendChild(hd);
    g.items.forEach(function(it){
      var a = document.createElement('a');
      a.href = '#'; a.dataset.n = it.n;
      a.innerHTML = '<span class="n">' + (it.n + 1) + '</span>';
      a.appendChild(document.createTextNode(it.t));
      a.addEventListener('click', function(e){ e.preventDefault(); go(it.n); toc.classList.remove('on'); });
      d.appendChild(a);
    });
    toclist.appendChild(d);
  });
  var tocLinks = Array.prototype.slice.call(toclist.querySelectorAll('a'));

  function go(n){
    if (n < 0) n = 0;
    if (n > total - 1) n = total - 1;
    slides[i].classList.remove('active');
    i = n;
    slides[i].classList.add('active');
    num.textContent = (i + 1) + ' / ' + total;
    progf.style.width = ((i + 1) / total * 100) + '%';
    secname.textContent = slides[i].getAttribute('data-sec') || '';
    notesbody.textContent = slides[i].getAttribute('data-notes') || 'No notes for this slide.';
    tocLinks.forEach(function(a){ a.classList.toggle('cur', +a.dataset.n === i); });
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  /* ---- scale the 1280x720 stage to the available space ---- */
  function fit(){
    var w = document.getElementById('wrap');
    var s = Math.min(w.clientWidth / 1280, w.clientHeight / 720);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){
    var n = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(n) && n - 1 !== i) go(n - 1);
  });

  document.getElementById('bnext').addEventListener('click', function(){ go(i + 1); });
  document.getElementById('bprev').addEventListener('click', function(){ go(i - 1); });
  document.getElementById('btoc').addEventListener('click', function(){ toc.classList.toggle('on'); });
  document.getElementById('bnotes').addEventListener('click', function(){ notes.classList.toggle('on'); });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(i - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(total - 1); }
    else if (k === 't' || k === 'T') { toc.classList.toggle('on'); }
    else if (k === 'n' || k === 'N') { notes.classList.toggle('on'); }
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if (k === 'Escape') { toc.classList.remove('on'); notes.classList.remove('on'); }
  });

  fit();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(isNaN(start) ? 0 : start - 1);
})();
</script>
