<div class="slide" data-sec="Orientation" data-notes="Say plainly what changed: Module 1 settled WHETHER to build an agent. This module is about how it thinks inside the loop you already built. The last question is the one that matters at review time.">

<div class="slide div" data-sec="Four architectures" data-notes="The core of the module. Resist ranking them in the abstract -- the whole point is that the ranking changes with the task.">

  <h1>Four ways to think</h1>

<div class="slide" data-sec="Four architectures" data-notes="One slide, all four, so the room has a map before the detail. Stress the last column: every one of these buys quality with tokens or latency. None is free, and none is best.">
  <h2>Four architectures, one map</h2>
  <div class="body">
    <svg width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-label="Chain-of-Thought, ReAct, Tree-of-Thought and Reflection compared">
      <g>
        <rect x="50" y="50" width="255" height="240" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
        <text x="177" y="82" text-anchor="middle" class="lbl">01</text>
        <text x="177" y="112" text-anchor="middle" class="big">Chain-of-Thought</text>
        <line x1="120" y1="132" x2="234" y2="132" stroke="#4338ca" stroke-width="2"/>
        <circle cx="90" cy="168" r="9" fill="#4338ca"/><circle cx="150" cy="168" r="9" fill="#4338ca"/>
        <circle cx="210" cy="168" r="9" fill="#4338ca"/><circle cx="264" cy="168" r="9" fill="#0d9488"/>
        <line x1="99" y1="168" x2="141" y2="168" stroke="#94a3b8" stroke-width="2"/>
        <line x1="159" y1="168" x2="201" y2="168" stroke="#94a3b8" stroke-width="2"/>
        <line x1="219" y1="168" x2="255" y2="168" stroke="#94a3b8" stroke-width="2"/>
        <text x="177" y="212" text-anchor="middle" class="bd">Think in steps, then answer.</text>
        <text x="177" y="240" text-anchor="middle" class="bds">No tools. One pass.</text>
        <text x="177" y="272" text-anchor="middle" class="bxs am">Cost: a few hundred tokens</text>
      </g>
      <g>
        <rect x="320" y="50" width="255" height="240" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
        <text x="447" y="82" text-anchor="middle" class="lbl">02</text>
        <text x="447" y="112" text-anchor="middle" class="big">ReAct</text>
        <line x1="390" y1="132" x2="504" y2="132" stroke="#4338ca" stroke-width="2"/>
        <circle cx="447" cy="178" r="42" fill="none" stroke="#4338ca" stroke-width="2" stroke-dasharray="4 4"/>
        <text x="447" y="166" text-anchor="middle" class="bds">think</text>

        <text x="447" y="260" text-anchor="middle" class="bds">then reason on what came back.</text>

      </g>
      <g>
        <rect x="590" y="50" width="255" height="240" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
        <text x="717" y="82" text-anchor="middle" class="lbl">03</text>
        <text x="717" y="112" text-anchor="middle" class="big">Tree-of-Thought</text>
        <line x1="660" y1="132" x2="774" y2="132" stroke="#4338ca" stroke-width="2"/>
        <circle cx="717" cy="156" r="8" fill="#4338ca"/>
        <line x1="717" y1="164" x2="665" y2="192" stroke="#94a3b8" stroke-width="2"/>

        <text x="717" y="256" text-anchor="middle" class="bd">Branch, score, prune.</text>

<div class="slide" data-sec="Four architectures" data-notes="The decisive question is not which is cleverest but what the task actually needs. Two axes: does the answer need outside facts, and is there more than one plausible route? That is the whole selection rule.">
  <h2>Two questions pick the architecture</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="Selection grid on facts needed and route ambiguity">
      <text x="70" y="46" class="lbl">Needs facts the model does not have &#8594;</text>
      <text x="30" y="220" text-anchor="middle" class="lbl" transform="rotate(-90 30 220)">More than one plausible route &#8594;</text>

      <rect x="180" y="62" width="420" height="150" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
      <text x="390" y="98" text-anchor="middle" class="bx ok">Chain-of-Thought</text>
      <text x="390" y="130" text-anchor="middle" class="bd">One route, no outside facts.</text>
      <text x="390" y="158" text-anchor="middle" class="bds">Classify this exception by reason code.</text>
      <text x="390" y="188" text-anchor="middle" class="bds ok">Cheapest thing that still shows its work.</text>

      <rect x="620" y="62" width="420" height="150" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="830" y="98" text-anchor="middle" class="bx">ReAct</text>
      <text x="830" y="130" text-anchor="middle" class="bd">One route, but it needs the ledger.</text>
      <text x="830" y="158" text-anchor="middle" class="bds">Why did PMT-1002 fail, and what is the policy?</text>
      <text x="830" y="188" text-anchor="middle" class="bds">The default for tool-using agents.</text>

      <rect x="180" y="228" width="420" height="150" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="390" y="264" text-anchor="middle" class="bx">Reflection</text>
      <text x="390" y="296" text-anchor="middle" class="bd">Several routes, all checkable in-head.</text>
      <text x="390" y="324" text-anchor="middle" class="bds">Draft the client-facing explanation.</text>
      <text x="390" y="354" text-anchor="middle" class="bds">Quality is a judgement, so add a judge.</text>

      <rect x="620" y="228" width="420" height="150" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="830" y="264" text-anchor="middle" class="bx am">Tree-of-Thought</text>
      <text x="830" y="296" text-anchor="middle" class="bd">Several routes AND outside facts.</text>
      <text x="830" y="324" text-anchor="middle" class="bds">Which of four causes explains this break?</text>
      <text x="830" y="354" text-anchor="middle" class="bds no">The most expensive box. Justify it.</text>
    </svg>
  </div>
  <div class="take"><b>Read the grid, not the hype:</b> most production work sits in the top two boxes. Tree-of-Thought is a deliberate purchase.</div>
</div>

<div class="slide" data-sec="Four architectures" data-notes="Chain-of-Thought detail. The important nuance for an advanced room: the visible reasoning is a rationalisation, not a transcript of the computation. Do not treat it as an audit trail -- Module 7 gives you the real one.">
  <h2>Chain-of-Thought &mdash; and what its reasoning is not</h2>
  <div class="body">
    <svg width="1180" height="410" viewBox="0 0 1180 410" role="img" aria-label="What chain-of-thought gives you and what it does not">
      <rect x="60" y="50" width="490" height="300" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
      <text x="305" y="86" text-anchor="middle" class="bx ok">What it buys</text>
      <text x="100" y="132" class="bd">&bull;&nbsp; Better accuracy on multi-step questions</text>
      <text x="100" y="172" class="bd">&bull;&nbsp; A draft you can read and challenge</text>
      <text x="100" y="212" class="bd">&bull;&nbsp; Failures that are legible &mdash; you see</text>
      <text x="126" y="238" class="bd">which step went wrong</text>
      <text x="100" y="278" class="bd">&bull;&nbsp; Almost no engineering: it is a prompt</text>
      <text x="305" y="322" text-anchor="middle" class="bds">Cheapest quality win available.</text>

      <rect x="620" y="50" width="490" height="300" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="865" y="86" text-anchor="middle" class="bx no">What it is not</text>
      <text x="660" y="132" class="bd">&bull;&nbsp; Not a transcript of the computation</text>
      <text x="660" y="172" class="bd">&bull;&nbsp; Not an audit trail &mdash; a model can reach</text>
      <text x="686" y="198" class="bd">the right answer and narrate a wrong route</text>
      <text x="660" y="238" class="bd">&bull;&nbsp; Not a guarantee &mdash; confident prose is</text>
      <text x="686" y="264" class="bd">exactly what a wrong answer also looks like</text>
      <text x="660" y="304" class="bd">&bull;&nbsp; Not free: it is tokens on every call</text>
      <text x="865" y="336" text-anchor="middle" class="bds no">Plausible reasoning is not verified reasoning.</text>
    </svg>
  </div>
  <div class="take"><b>For a regulated setting:</b> the reasoning text is evidence for a human reviewer, never the control. The control is the trace and the check &mdash; Modules 7 and 8.</div>
</div>

<div class="slide" data-sec="Four architectures" data-notes="ReAct in detail. The engineering point everyone underestimates: the format contract. The model must emit something parseable, and it will drift. Lab 2.2 breaks the parser on purpose.">
  <h2>ReAct &mdash; the loop, and the contract it depends on</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="The ReAct cycle and its parsing contract">
      <text x="300" y="44" text-anchor="middle" class="lbl">The cycle</text>
      <rect x="120" y="62" width="360" height="46" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
      <text x="300" y="91" text-anchor="middle" class="bxs">Thought: I need the reason code first</text>
      <line x1="300" y1="112" x2="300" y2="128" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <rect x="120" y="132" width="360" height="46" rx="5" fill="#4338ca"/>
      <text x="300" y="161" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Action: lookup_payment("PMT-1002")</text>
      <line x1="300" y1="182" x2="300" y2="198" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <rect x="120" y="202" width="360" height="46" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
      <text x="300" y="231" text-anchor="middle" class="bxs">Observation: INSUFFICIENT_FUNDS</text>
      <path d="M120 225 Q70 225 70 85 Q70 62 114 78" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <text x="300" y="288" text-anchor="middle" class="bd">Each observation changes the next thought.</text>
      <text x="300" y="314" text-anchor="middle" class="bds">That is the whole difference from Chain-of-Thought.</text>

      <line x1="560" y1="50" x2="560" y2="360" stroke="#e2e8f0" stroke-width="2"/>

      <text x="860" y="44" text-anchor="middle" class="lbl">The contract it rests on</text>
      <rect x="620" y="62" width="480" height="106" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="860" y="94" text-anchor="middle" class="bx am">Your parser is a protocol boundary</text>
      <text x="860" y="124" text-anchor="middle" class="bd">The model emits text. Your code must turn</text>
      <text x="860" y="148" text-anchor="middle" class="bd">it into a tool call &mdash; every single time.</text>

      <text x="640" y="204" class="bxs no">It will drift:</text>
      <text x="640" y="238" class="bd">&bull;&nbsp; `Action:` becomes `**Action:**`</text>
      <text x="640" y="272" class="bd">&bull;&nbsp; arguments arrive unquoted, or as prose</text>
      <text x="640" y="306" class="bd">&bull;&nbsp; two actions in one turn</text>
      <text x="640" y="340" class="bd">&bull;&nbsp; a thought with no action at all</text>
    </svg>
  </div>
  <div class="take"><b>Lab 2.2 breaks it on purpose:</b> a strict parser fails a good answer; a lenient one runs the wrong tool. You will pick a side and defend it.</div>
</div>

<div class="slide" data-sec="Four architectures" data-notes="Tree-of-Thought. Be blunt about cost: branches times depth times tokens per node. The scoring function is the part teams forget, and a bad scorer makes the whole tree worse than a single line of reasoning.">

<div class="slide" data-sec="Four architectures" data-notes="Reflection, and the finding that matters commercially: gains flatten fast. Round one is usually worth it, round two sometimes, round three almost never. Lab 2.4 measures where the knee is.">
  <h2>Reflection &mdash; and where it stops paying</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="Reflection rounds against quality showing diminishing returns">
      <line x1="140" y1="330" x2="640" y2="330" stroke="#94a3b8" stroke-width="2"/>
      <line x1="140" y1="330" x2="140" y2="70" stroke="#94a3b8" stroke-width="2"/>
      <text x="390" y="368" text-anchor="middle" class="lbl">reflection rounds</text>
      <text x="96" y="200" class="lbl" transform="rotate(-90 96 200)">quality</text>
      <text x="160" y="352" class="bds">0</text><text x="280" y="352" class="bds">1</text>
      <text x="400" y="352" class="bds">2</text><text x="520" y="352" class="bds">3</text>
      <path d="M160 300 L280 160 L400 122 L520 112" fill="none" stroke="#4338ca" stroke-width="3"/>
      <circle cx="160" cy="300" r="7" fill="#4338ca"/><circle cx="280" cy="160" r="7" fill="#0d9488"/>
      <circle cx="400" cy="122" r="7" fill="#4338ca"/><circle cx="520" cy="112" r="7" fill="#b91c1c"/>
      <text x="286" y="142" class="bds ok">big win</text>
      <text x="406" y="104" class="bds">small</text>
      <text x="500" y="94" class="bds no">noise</text>
      <path d="M160 300 L280 240 L400 300 L520 380" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="6 4"/>
      <text x="548" y="330" class="bds no">cost</text>

      <line x1="700" y1="50" x2="700" y2="370" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="750" y="70" width="380" height="118" rx="7" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
      <text x="940" y="102" text-anchor="middle" class="bx ok">Reflection works when</text>
      <text x="775" y="134" class="bd">the critic knows something the drafter</text>
      <text x="775" y="158" class="bd">did not use &mdash; a rule, a schema, a policy</text>
      <text x="940" y="180" text-anchor="middle" class="bds">Give the critic a checklist, not "improve this"</text>

      <rect x="750" y="212" width="380" height="118" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="940" y="244" text-anchor="middle" class="bx no">Reflection fails when</text>
      <text x="775" y="276" class="bd">the same model grades its own work with</text>
      <text x="775" y="300" class="bd">the same knowledge and no new input</text>
      <text x="940" y="322" text-anchor="middle" class="bds">You pay 3&times; for a rephrase</text>
    </svg>
  </div>
  <div class="take"><b>Cap it at one or two rounds by default,</b> and make the third conditional on a measured gain &mdash; never on a hope.</div>
</div>

<div class="slide div" data-sec="Decomposition" data-notes="Short section. The failure it prevents is subtle: a sub-goal that no single step can finish, which turns into a loop that looks like a reasoning problem.">
  <div class="k">Part two</div>
  <h1>Decomposition that an agent can finish</h1>
</div>

<div class="slide" data-sec="Decomposition" data-notes="The test for a good sub-goal is the one on the right: could you tell, from the output alone, whether it succeeded? If not, the agent cannot either, and it will not know when to stop.">
  <h2>A sub-goal an agent cannot finish is a loop waiting to happen</h2>
  <div class="body">
    <svg width="1180" height="410" viewBox="0 0 1180 410" role="img" aria-label="Bad and good sub-goals compared by whether completion is detectable">
      <rect x="60" y="50" width="490" height="300" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="305" y="86" text-anchor="middle" class="bx no">Cannot be finished</text>
      <rect x="95" y="106" width="420" height="40" rx="4" fill="#fff" stroke="#fecaca"/>
      <text x="305" y="132" text-anchor="middle" class="bds">&ldquo;Understand the payment problem&rdquo;</text>
      <rect x="95" y="156" width="420" height="40" rx="4" fill="#fff" stroke="#fecaca"/>
      <text x="305" y="182" text-anchor="middle" class="bds">&ldquo;Investigate thoroughly&rdquo;</text>
      <rect x="95" y="206" width="420" height="40" rx="4" fill="#fff" stroke="#fecaca"/>
      <text x="305" y="232" text-anchor="middle" class="bds">&ldquo;Make sure nothing is missed&rdquo;</text>
      <text x="305" y="286" text-anchor="middle" class="bd">No output tells you it is done.</text>
      <text x="305" y="316" text-anchor="middle" class="bxs no">So the agent keeps going &mdash; and you</text>
      <text x="305" y="338" text-anchor="middle" class="bxs no">debug it as a &ldquo;reasoning bug&rdquo;.</text>

      <rect x="620" y="50" width="490" height="300" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
      <text x="865" y="86" text-anchor="middle" class="bx ok">Can be finished</text>
      <rect x="655" y="106" width="420" height="40" rx="4" fill="#fff" stroke="#99f6e4"/>
      <text x="865" y="132" text-anchor="middle" class="bds">Return the reason code for PMT-1002</text>
      <rect x="655" y="156" width="420" height="40" rx="4" fill="#fff" stroke="#99f6e4"/>
      <text x="865" y="182" text-anchor="middle" class="bds">Return the policy text for that code</text>
      <rect x="655" y="206" width="420" height="40" rx="4" fill="#fff" stroke="#99f6e4"/>
      <text x="865" y="232" text-anchor="middle" class="bds">State whether policy reserves this for a human</text>
      <text x="865" y="286" text-anchor="middle" class="bd">Each has a checkable output.</text>
      <text x="865" y="316" text-anchor="middle" class="bxs ok">The definition of done is a property</text>
      <text x="865" y="338" text-anchor="middle" class="bxs ok">of the sub-goal, not of the model.</text>
    </svg>
  </div>
  <div class="take"><b>The test:</b> could you tell from the output alone whether the step succeeded? If you cannot, neither can the agent.</div>
</div>

<div class="slide div" data-sec="Retry or re-plan" data-notes="This is the highest-value fifteen minutes of the module for anyone who runs production systems.">
  <div class="k">Part three</div>
  <h1>Retry, or re-plan?</h1>
</div>

<div class="slide" data-sec="Retry or re-plan" data-notes="One decision, two failure modes. Retrying a wrong plan burns the budget and produces the same failure more expensively; re-planning a transient blip throws away correct work. The diagnosis is the whole job.">
  <h2>The same error, two right answers</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="Diagnosing whether a failure is transient or a wrong plan">
      <rect x="430" y="40" width="320" height="52" rx="6" fill="#1e1b4b"/>
      <text x="590" y="72" text-anchor="middle" font-size="17" font-weight="600" fill="#fff">A step failed. Why?</text>
      <line x1="500" y1="96" x2="300" y2="140" stroke="#0d9488" stroke-width="2.5" marker-end="url(#at)"/>
      <line x1="680" y1="96" x2="880" y2="140" stroke="#d97706" stroke-width="2.5" marker-end="url(#aa)"/>

      <rect x="60" y="148" width="480" height="216" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
      <text x="300" y="182" text-anchor="middle" class="bx ok">Transient &mdash; the plan was fine</text>
      <text x="95" y="220" class="bd">timeout &middot; 429 &middot; 503 &middot; connection reset</text>
      <text x="95" y="252" class="bd">a lock &middot; a slow dependency</text>
      <line x1="95" y1="272" x2="505" y2="272" stroke="#99f6e4" stroke-width="2"/>
      <text x="300" y="302" text-anchor="middle" class="bx ok">Retry &mdash; same step, backoff</text>
      <text x="300" y="330" text-anchor="middle" class="bds">Bounded attempts. Keep the plan and the work.</text>
      <text x="300" y="352" text-anchor="middle" class="bds no">Re-planning here throws away correct work.</text>

      <rect x="640" y="148" width="480" height="216" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="880" y="182" text-anchor="middle" class="bx am">Wrong plan &mdash; the step cannot work</text>
      <text x="675" y="220" class="bd">404 &middot; not found &middot; no such reference</text>
      <text x="675" y="252" class="bd">403 &middot; validation error &middot; wrong tool entirely</text>
      <line x1="675" y1="272" x2="1085" y2="272" stroke="#fde68a" stroke-width="2"/>
      <text x="880" y="302" text-anchor="middle" class="bx am">Re-plan &mdash; different route</text>
      <text x="880" y="330" text-anchor="middle" class="bds">Feed the error back as an observation.</text>
      <text x="880" y="352" text-anchor="middle" class="bds no">Retrying here just buys the same failure again.</text>

      <text x="590" y="400" text-anchor="middle" class="bx">Most agents do only one of these. That is the bug.</text>
    </svg>
  </div>
  <div class="take"><b>Classify before you react.</b> The error type is data your tools already return &mdash; if they return it properly, which is why Module 1 made them report failure rather than raise it.</div>
</div>

<div class="slide" data-sec="Retry or re-plan" data-notes="The escalation ladder. Point out that every rung has a bound, and the last rung is a human. An agent with no last rung is an agent that improvises when it should stop.">
  <h2>Four rungs, each with a bound</h2>
  <div class="body">
    <svg width="1180" height="410" viewBox="0 0 1180 410" role="img" aria-label="Escalation ladder from retry to human">
      <rect x="120" y="60" width="940" height="58" rx="6" fill="#ecfdf5" stroke="#0d9488" stroke-width="2"/>
      <text x="150" y="96" class="num" fill="#0d9488">1</text>
      <text x="215" y="88" class="bx ok">Retry the same step</text>
      <text x="215" y="110" class="bds">transient only &middot; exponential backoff &middot; hard cap on attempts</text>
      <text x="1030" y="96" text-anchor="end" class="bds">cheapest</text>

      <rect x="120" y="130" width="940" height="58" rx="6" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
      <text x="150" y="166" class="num">2</text>
      <text x="215" y="158" class="bx">Try a different tool for the same sub-goal</text>
      <text x="215" y="180" class="bds">the sub-goal still stands; the route to it does not</text>

      <rect x="120" y="200" width="940" height="58" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
      <text x="150" y="236" class="num" fill="#d97706">3</text>
      <text x="215" y="228" class="bx am">Re-plan from the current state</text>
      <text x="215" y="250" class="bds">keep what you learned &middot; new sub-goals &middot; count it against the step budget</text>

      <rect x="120" y="270" width="940" height="58" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="150" y="306" class="num" fill="#b91c1c">4</text>
      <text x="215" y="298" class="bx no">Stop and escalate to a human</text>
      <text x="215" y="320" class="bds">with the trace, the plan, and what was tried &mdash; not just &ldquo;I failed&rdquo;</text>
      <text x="1030" y="306" text-anchor="end" class="bds">correct, not a defeat</text>

      <text x="590" y="374" text-anchor="middle" class="bx">Every rung is bounded. An agent with no rung 4 improvises when it should stop.</text>
    </svg>
  </div>
</div>

<div class="slide div" data-sec="What it costs" data-notes="Close the module where Module 1 closed: on measurement. The bake-off is the take-home artefact.">
  <div class="k">Part four</div>
  <h1>What each pattern costs</h1>
</div>

<div class="slide" data-sec="What it costs" data-notes="The honest price list. These are shapes, not promises -- the point is the ORDER of magnitude between rows, and that quality does not track cost. Lab 2.5 makes them measure their own numbers on their own eval set.">
  <h2>The price list &mdash; shapes, not promises</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="Relative cost and latency of the four architectures">
      <line x1="60" y1="80" x2="1120" y2="80" stroke="#4338ca" stroke-width="2"/>
      <text x="70" y="66" class="lbl">Architecture</text>
      <text x="470" y="66" text-anchor="middle" class="lbl">Model calls</text>
      <text x="660" y="66" text-anchor="middle" class="lbl">Tokens</text>
      <text x="850" y="66" text-anchor="middle" class="lbl">Latency</text>
      <text x="1030" y="66" text-anchor="middle" class="lbl">Buys you</text>

      <text x="70" y="126" class="bx">Direct answer</text>
      <text x="470" y="126" text-anchor="middle" class="bd ok">1</text>
      <text x="660" y="126" text-anchor="middle" class="bd ok">&times;1</text>
      <text x="850" y="126" text-anchor="middle" class="bd ok">&times;1</text>
      <text x="1030" y="126" text-anchor="middle" class="bds">the baseline</text>
      <line x1="60" y1="142" x2="1120" y2="142" stroke="#eef2ff" stroke-width="1.5"/>

      <text x="70" y="180" class="bx">Chain-of-Thought</text>
      <text x="470" y="180" text-anchor="middle" class="bd">1</text>
      <text x="660" y="180" text-anchor="middle" class="bd">&times;2 to &times;4</text>
      <text x="850" y="180" text-anchor="middle" class="bd">&times;1.5</text>
      <text x="1030" y="180" text-anchor="middle" class="bds">legible failures</text>
      <line x1="60" y1="196" x2="1120" y2="196" stroke="#eef2ff" stroke-width="1.5"/>

      <text x="70" y="234" class="bx">ReAct</text>
      <text x="470" y="234" text-anchor="middle" class="bd">n steps</text>
      <text x="660" y="234" text-anchor="middle" class="bd">&times;n, context re-sent</text>
      <text x="850" y="234" text-anchor="middle" class="bd">&times;n round trips</text>
      <text x="1030" y="234" text-anchor="middle" class="bds ok">outside facts</text>
      <line x1="60" y1="250" x2="1120" y2="250" stroke="#eef2ff" stroke-width="1.5"/>

      <text x="70" y="288" class="bx">Reflection</text>
      <text x="470" y="288" text-anchor="middle" class="bd">2&ndash;3 per round</text>
      <text x="660" y="288" text-anchor="middle" class="bd">&times;2 to &times;3</text>

    var t = h ? h.textContent.trim() : sec;
    if (q) t = q.textContent.trim() + ' \u2014 ' + t;
    groups[groups.length-1].items.push({n: n, t: t});
  });
  groups.forEach(function(g){
    var d = document.createElement('div'); d.className = 'grp';
    var hd = document.createElement('div'); hd.className = 'grph'; hd.textContent = g.sec; d.appendChild(hd);
    g.items.forEach(function(it){
      var a = document.createElement('a');
      a.href = '#'; a.dataset.n = it.n;
      a.innerHTML = '<span class="n">' + (it.n + 1) + '</span>';
      a.appendChild(document.createTextNode(it.t));
      a.addEventListener('click', function(e){ e.preventDefault(); go(it.n); toc.classList.remove('on'); });
      d.appendChild(a);
    });
    toclist.appendChild(d);
  });
  var tocLinks = Array.prototype.slice.call(toclist.querySelectorAll('a'));

  function go(n){
    if (n < 0) n = 0;
    if (n > total - 1) n = total - 1;
    slides[i].classList.remove('active');
    i = n;
    slides[i].classList.add('active');
    num.textContent = (i + 1) + ' / ' + total;
    progf.style.width = ((i + 1) / total * 100) + '%';
    secname.textContent = slides[i].getAttribute('data-sec') || '';
    notesbody.textContent = slides[i].getAttribute('data-notes') || 'No notes for this slide.';
    tocLinks.forEach(function(a){ a.classList.toggle('cur', +a.dataset.n === i); });
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  /* ---- scale the 1280x720 stage to the available space ---- */
  function fit(){
    var w = document.getElementById('wrap');
    var s = Math.min(w.clientWidth / 1280, w.clientHeight / 720);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){
    var n = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(n) && n - 1 !== i) go(n - 1);
  });

  document.getElementById('bnext').addEventListener('click', function(){ go(i + 1); });
  document.getElementById('bprev').addEventListener('click', function(){ go(i - 1); });
  document.getElementById('btoc').addEventListener('click', function(){ toc.classList.toggle('on'); });
  document.getElementById('bnotes').addEventListener('click', function(){ notes.classList.toggle('on'); });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(i - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(total - 1); }
    else if (k === 't' || k === 'T') { toc.classList.toggle('on'); }
    else if (k === 'n' || k === 'N') { notes.classList.toggle('on'); }
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if (k === 'Escape') { toc.classList.remove('on'); notes.classList.remove('on'); }
  });

  fit();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(isNaN(start) ? 0 : start - 1);
})();
</script>
</body>
</html>
