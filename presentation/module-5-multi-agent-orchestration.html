<div class="slide" data-sec="Topologies" data-notes="The reframing slide for this module. A supervisor is a router, so routing accuracy is measurable exactly the way tool selection was in Lab 4.2 -- same harness, same confusion table. Almost nobody measures it, and a supervisor that misroutes 20% of cases wastes every downstream token. The rule-based column is not a strawman: it is often right.">
  <h2>A supervisor is a router &mdash; so measure it like one</h2>
  <div class="body">
    <svg width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-label="Rule-based routing compared with LLM routing">
      <rect x="50" y="48" width="500" height="268" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="300" y="78" text-anchor="middle" class="lbl">Rule-based</text>
      <text x="300" y="112" text-anchor="middle" class="bx">if reason_code in SANCTIONS: compliance</text>
      <text x="76" y="152" class="bd">&bull; free, instant, and the same every time</text>
      <text x="76" y="186" class="bd">&bull; you can read it, test it, and show an auditor</text>
      <text x="76" y="220" class="bd">&bull; a wrong route is a bug you can fix once</text>
      <text x="76" y="254" class="bd am">&bull; breaks on anything the table did not foresee</text>
      <text x="300" y="294" text-anchor="middle" class="bds ok">right whenever the categories are known and stable</text>

      <rect x="630" y="48" width="500" height="268" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="880" y="78" text-anchor="middle" class="lbl">LLM-routed</text>
      <text x="880" y="112" text-anchor="middle" class="bx">&ldquo;which specialist should handle this?&rdquo;</text>
      <text x="656" y="152" class="bd">&bull; handles the case nobody enumerated</text>
      <text x="656" y="186" class="bd">&bull; costs a model call before any work begins</text>
      <text x="656" y="220" class="bd">&bull; can route differently for the same input twice</text>
      <text x="656" y="254" class="bd am">&bull; its worker descriptions are Module 4 all over again</text>
      <text x="880" y="294" text-anchor="middle" class="bds">right when the input is open-ended</text>

      <rect x="150" y="336" width="880" height="82" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="366" text-anchor="middle" class="bxs am">Routing accuracy is the same measurement you built in Lab 4.2</text>
      <text x="590" y="394" text-anchor="middle" class="bds">an eval set, accuracy, a confusion table naming the two workers that overlap &mdash; and a</text>
      <text x="590" y="412" text-anchor="middle" class="bds">misroute wastes every token spent downstream of it, so it is the cheapest thing to fix</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Topologies" data-notes="The slide that saves them a week of debugging. A handoff feels like passing a task; what actually crosses is whatever you put in the message. The three things on the right are dropped by default, and each one produces a characteristic bug: repeated work, violated constraints, and confidently repeating a failure.">
  <h2>What a handoff actually transfers</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="What crosses a handoff and what is silently dropped">
      <rect x="60" y="60" width="200" height="96" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="160" y="98" text-anchor="middle" class="bxs">Triage agent</text>
      <text x="160" y="128" text-anchor="middle" class="bds">has done the work</text>

      <rect x="920" y="60" width="200" height="96" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="1020" y="98" text-anchor="middle" class="bxs">Policy agent</text>
      <text x="1020" y="128" text-anchor="middle" class="bds">starts from what it is told</text>

      <line x1="266" y1="108" x2="914" y2="108" stroke="#4338ca" stroke-width="3" marker-end="url(#ai)"/>
      <text x="590" y="94" text-anchor="middle" class="bxs">handoff</text>

      <rect x="120" y="192" width="440" height="196" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="340" y="224" text-anchor="middle" class="lbl">Crosses, because you sent it</text>
      <text x="148" y="264" class="bd ok">&#10003;&nbsp; the task &mdash; &ldquo;decide whether PMT-1003 can be released&rdquo;</text>
      <text x="148" y="300" class="bd ok">&#10003;&nbsp; the findings so far &mdash; status, amount, reason code</text>
      <text x="148" y="336" class="bd ok">&#10003;&nbsp; who is asking, and for what outcome</text>
      <text x="340" y="372" text-anchor="middle" class="bds">this is the part everyone remembers</text>

      <text x="270" y="84" text-anchor="middle" class="lbl ok">One agent</text>

      <text x="440" y="126" text-anchor="end" class="bd">1&times;</text>
      <text x="76" y="164" class="bd">case context</text>
      <text x="440" y="164" text-anchor="end" class="bd">1&times;</text>
      <text x="76" y="202" class="bd">reasoning turns</text>
      <text x="440" y="202" text-anchor="end" class="bd">6</text>
      <line x1="76" y1="222" x2="440" y2="222" stroke="#0d9488" stroke-width="1.5"/>
      <text x="76" y="258" class="bxs ok">total</text>

      <text x="556" y="126" class="bd">system prompt + tools, <tspan font-weight="600">per agent</tspan></text>
      <text x="1104" y="126" text-anchor="end" class="bd no">5&times;</text>
      <text x="556" y="164" class="bd">case context, re-sent at <tspan font-weight="600">every hop</tspan></text>
      <text x="1104" y="164" text-anchor="end" class="bd no">5&times;</text>
      <text x="556" y="202" class="bd">supervisor reads every worker's output</text>
      <text x="1104" y="202" text-anchor="end" class="bd no">+4 calls</text>

      <text x="590" y="398" text-anchor="middle" class="bd">not the whole case file. That is a design decision, and it is worth more than a model change.</text>

</div>

<div class="slide" data-sec="Economics" data-notes="The single biggest lever, and the one people reach for last. Most calls in a multi-agent system are routing, extraction and formatting -- work a small model does perfectly. Reserve the expensive model for the one node that actually reasons. Note the honest caveat: a mis-routing cheap supervisor can cost more than it saves, which is exactly why Lab 5.1 measures routing accuracy first.">

      <text x="450" y="352" text-anchor="middle" class="bds ok">no model at all</text>

      <line x1="284" y1="94" x2="336" y2="66" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ag)"/>

      <line x1="284" y1="108" x2="336" y2="246" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ag)"/>

<div class="slide div" data-sec="Control" data-notes="Part four. Human-in-the-loop appears twice in this course: here as an orchestration mechanism, and in Module 8 as a safety control. Same machinery, different reason, and it is worth naming the difference.">
  <div class="k">Part four</div>
  <h1>The human is part of the graph</h1>
</div>

<div class="slide" data-sec="Control" data-notes="Four mechanisms, and the one people forget is timeout. An approval gate with no timeout is a graph that hangs forever on a Friday evening. Point out that all four rest on Module 3's checkpointing -- you can only pause a run whose state you can persist and resume.">
  <h2>Interrupt, approve, time out, escalate</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Four human-in-the-loop mechanisms built on checkpointing">
      <rect x="50" y="48" width="255" height="200" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="177" y="78" text-anchor="middle" class="lbl">Interrupt</text>
      <text x="177" y="114" text-anchor="middle" class="bxs">pause here</text>
      <text x="177" y="152" text-anchor="middle" class="bds">the run stops at a</text>
      <text x="177" y="174" text-anchor="middle" class="bds">named node and the</text>
      <text x="177" y="196" text-anchor="middle" class="bds">state is written down</text>
      <text x="177" y="230" text-anchor="middle" class="bds ok">Module 3's checkpoint</text>

      <rect x="325" y="48" width="255" height="200" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="452" y="78" text-anchor="middle" class="lbl">Approve</text>
      <text x="452" y="114" text-anchor="middle" class="bxs">a named human</text>
      <text x="452" y="152" text-anchor="middle" class="bds">who approved, when,</text>
      <text x="452" y="174" text-anchor="middle" class="bds">and on what evidence</text>
      <text x="452" y="196" text-anchor="middle" class="bds">&mdash; all recorded</text>
      <text x="452" y="230" text-anchor="middle" class="bds ok">an identity, not a boolean</text>

      <rect x="600" y="48" width="255" height="200" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="727" y="78" text-anchor="middle" class="lbl no">Timeout</text>
      <text x="727" y="114" text-anchor="middle" class="bxs no">the forgotten one</text>
      <text x="727" y="152" text-anchor="middle" class="bds">a gate with no deadline</text>
      <text x="727" y="174" text-anchor="middle" class="bds">is a run that waits</text>
      <text x="727" y="196" text-anchor="middle" class="bds">until Monday</text>
      <text x="727" y="230" text-anchor="middle" class="bds no">decide what expiry means</text>

      <rect x="875" y="48" width="255" height="200" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="1002" y="78" text-anchor="middle" class="lbl am">Escalate</text>
      <text x="1002" y="114" text-anchor="middle" class="bxs am">to someone else</text>
      <text x="1002" y="152" text-anchor="middle" class="bds">expiry is not refusal</text>
      <text x="1002" y="174" text-anchor="middle" class="bds">and not approval &mdash;</text>
      <text x="1002" y="196" text-anchor="middle" class="bds">it is a different queue</text>
      <text x="1002" y="230" text-anchor="middle" class="bds am">the ladder ends somewhere</text>

      <rect x="150" y="280" width="880" height="126" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="314" text-anchor="middle" class="bxs am">All four rest on being able to stop and resume</text>
      <text x="590" y="346" text-anchor="middle" class="bd">You can only pause a run whose state you can write down and pick up again.</text>
      <text x="590" y="376" text-anchor="middle" class="bd">That is why checkpointing came first &mdash; approval gates are an application of it,</text>
      <text x="590" y="400" text-anchor="middle" class="bds">not a separate feature. Lab 5.4 builds all four on the graph from Lab 5.3.</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Control" data-notes="Placement, which is the part that decides whether the human is doing review or rubber-stamping. The middle column is the one to aim for: after the evidence is assembled and before anything irreversible. Too early and they approve a plan they cannot evaluate; too late and they are being told, not asked.">
  <h2>Where the gate goes decides what the human can actually do</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Three placements of an approval gate along a run">
      <line x1="80" y1="118" x2="1110" y2="118" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ag)"/>
      <circle cx="200" cy="118" r="9" fill="#4338ca"/>
      <circle cx="590" cy="118" r="9" fill="#0d9488"/>
      <circle cx="960" cy="118" r="9" fill="#b91c1c"/>
      <text x="140" y="96" class="bds">start</text>
      <text x="1050" y="96" class="bds">done</text>

      <rect x="70" y="152" width="300" height="212" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="220" y="182" text-anchor="middle" class="lbl">Before the work</text>
      <text x="220" y="218" text-anchor="middle" class="bxs">&ldquo;approve this plan&rdquo;</text>
      <text x="220" y="256" text-anchor="middle" class="bds">nothing has been</text>
      <text x="220" y="278" text-anchor="middle" class="bds">looked up yet, so</text>
      <text x="220" y="300" text-anchor="middle" class="bds">there is no evidence</text>
      <text x="220" y="322" text-anchor="middle" class="bds">to judge it against</text>
      <text x="220" y="352" text-anchor="middle" class="bds no">approval as ritual</text>

      <rect x="400" y="152" width="380" height="212" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="590" y="182" text-anchor="middle" class="lbl ok">After evidence, before the write</text>
      <text x="590" y="218" text-anchor="middle" class="bxs ok">&ldquo;release PMT-1003? here is why&rdquo;</text>
      <text x="590" y="256" text-anchor="middle" class="bds">every finding is in, with sources</text>
      <text x="590" y="278" text-anchor="middle" class="bds">nothing irreversible has happened</text>
      <text x="590" y="300" text-anchor="middle" class="bds">the human can disagree, and it</text>
      <text x="590" y="322" text-anchor="middle" class="bds">still costs nothing to stop</text>
      <text x="590" y="352" text-anchor="middle" class="bds ok">the only placement that is review</text>

      <rect x="810" y="152" width="300" height="212" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="960" y="182" text-anchor="middle" class="lbl no">After the write</text>
      <text x="960" y="218" text-anchor="middle" class="bxs no">&ldquo;here is what we did&rdquo;</text>
      <text x="960" y="256" text-anchor="middle" class="bds">the payment already</text>
      <text x="960" y="278" text-anchor="middle" class="bds">went out</text>
      <text x="960" y="308" text-anchor="middle" class="bds">this is a notification</text>
      <text x="960" y="330" text-anchor="middle" class="bds">wearing a gate's name</text>
      <text x="960" y="352" text-anchor="middle" class="bds no">not a control</text>

      <text x="590" y="402" text-anchor="middle" class="bd am">One test: at this gate, is &ldquo;no&rdquo; still free? If not, it is not an approval gate.</text>
    </svg>
  </div>
</div>

<div class="slide div" data-sec="Verdict" data-notes="Part five, and the shortest. This is the part that distinguishes this course from a framework tutorial.">
  <div class="k">Part five</div>
  <h1>And then measure it</h1>
</div>

<div class="slide" data-sec="Verdict" data-notes="The scorecard is the deliverable of this module and of Lab 5.5. Insist on the fourth row: a graph that wins on quality and loses 6x on cost has not obviously won. Emphasise that the comparison uses their own Day 1 eval set, so the answer is about their workload and not about anybody's benchmark.">
  <h2>The scorecard, against your own baseline</h2>

      <text x="700" y="180" text-anchor="middle" class="bd no">6.2&times;</text>

      <text x="80" y="228" class="bxs">Latency (p95)</text>
      <text x="380" y="228" text-anchor="middle" class="bd">11 s</text>
      <text x="700" y="228" text-anchor="middle" class="bd">19 s</text>
      <text x="960" y="228" text-anchor="middle" class="bd">agent wins</text>

      <text x="80" y="276" class="bxs">Debuggable</text>
      <text x="380" y="276" text-anchor="middle" class="bd">one trace</text>
      <text x="700" y="276" text-anchor="middle" class="bd">five, and a router</text>
      <text x="960" y="276" text-anchor="middle" class="bd">agent wins</text>
      <line x1="60" y1="298" x2="1120" y2="298" stroke="#cbd5e1" stroke-width="1.5"/>

      <rect x="150" y="316" width="880" height="94" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>

<div class="slide" data-sec="Verdict" data-notes="Close the section by giving them permission to not build it. Every one of these is a real outcome that the scorecard makes defensible in a design review -- which is the actual value of having measured. The last box is the one that most often applies: the single agent was fine, and now they can prove it.">
  <h2>Four honest outcomes, and one of them is &ldquo;don't&rdquo;</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Four defensible conclusions from a multi-agent scorecard">
      <rect x="60" y="52" width="510" height="150" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="315" y="84" text-anchor="middle" class="lbl ok">Ship the graph</text>
      <text x="315" y="122" text-anchor="middle" class="bx ok">quality gain justifies the bill</text>
      <text x="315" y="156" text-anchor="middle" class="bd">the error is expensive and the volume is low</text>
      <text x="315" y="182" text-anchor="middle" class="bds">now argue about which agent, not whether</text>

      <rect x="610" y="52" width="510" height="150" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="865" y="84" text-anchor="middle" class="lbl">Ship a smaller graph</text>
      <text x="865" y="122" text-anchor="middle" class="bx">two of the five earned their place</text>
      <text x="865" y="156" text-anchor="middle" class="bd">drop the workers whose findings never changed</text>
      <text x="865" y="182" text-anchor="middle" class="bds">the most common real answer</text>

      <rect x="60" y="222" width="510" height="150" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="315" y="254" text-anchor="middle" class="lbl am">Ship it for some cases</text>
      <text x="315" y="292" text-anchor="middle" class="bx am">route by value, not by type</text>
      <text x="315" y="326" text-anchor="middle" class="bd">the graph above a threshold, one agent below it</text>
      <text x="315" y="352" text-anchor="middle" class="bds">the cost curve bends where the risk does</text>

      <rect x="610" y="222" width="510" height="150" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="865" y="254" text-anchor="middle" class="lbl no">Don't</text>
      <text x="865" y="292" text-anchor="middle" class="bx no">the single agent was fine</text>
      <text x="865" y="326" text-anchor="middle" class="bd">and you can now say so with a number</text>
      <text x="865" y="352" text-anchor="middle" class="bds no">an afternoon spent, a quarter saved</text>

      <text x="590" y="406" text-anchor="middle" class="bd am">All four are wins. Only one of them is a system you then have to operate.</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Recap" data-notes="Tie it together and hand over. The one sentence to leave them with: adding an agent is a cost you pay on every single run, and a capability you use on some of them.">
  <h2>What this module actually changed</h2>

<script>
(function(){
  var stage = document.getElementById('stage');
  stage.appendChild(document.getElementById('deck').content.cloneNode(true));
  var slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));
  var i = 0, total = slides.length;

  var num = document.getElementById('num'),
      progf = document.getElementById('progf'),
      secname = document.getElementById('secname'),
      toc = document.getElementById('toc'),
      toclist = document.getElementById('toclist'),
      notes = document.getElementById('notes'),
      notesbody = document.getElementById('notesbody');

  /* ---- build the index, grouped by section ---- */
  var groups = [], last = null;
  slides.forEach(function(s, n){
    var sec = s.getAttribute('data-sec') || '';
    if (sec !== last) { groups.push({sec: sec, items: []}); last = sec; }
    var h = s.querySelector('h2, h1'), q = s.querySelector('.qtag');
    var t = h ? h.textContent.trim() : sec;
    if (q) t = q.textContent.trim() + ' \u2014 ' + t;
    groups[groups.length-1].items.push({n: n, t: t});
  });
  groups.forEach(function(g){
    var d = document.createElement('div'); d.className = 'grp';
    var hd = document.createElement('div'); hd.className = 'grph'; hd.textContent = g.sec; d.appendChild(hd);
    g.items.forEach(function(it){
      var a = document.createElement('a');
      a.href = '#'; a.dataset.n = it.n;
      a.innerHTML = '<span class="n">' + (it.n + 1) + '</span>';
      a.appendChild(document.createTextNode(it.t));
      a.addEventListener('click', function(e){ e.preventDefault(); go(it.n); toc.classList.remove('on'); });
      d.appendChild(a);
    });
    toclist.appendChild(d);
  });
  var tocLinks = Array.prototype.slice.call(toclist.querySelectorAll('a'));

  function go(n){
    if (n < 0) n = 0;
    if (n > total - 1) n = total - 1;
    slides[i].classList.remove('active');
    i = n;
    slides[i].classList.add('active');
    num.textContent = (i + 1) + ' / ' + total;
    progf.style.width = ((i + 1) / total * 100) + '%';
    secname.textContent = slides[i].getAttribute('data-sec') || '';
    notesbody.textContent = slides[i].getAttribute('data-notes') || 'No notes for this slide.';
    tocLinks.forEach(function(a){ a.classList.toggle('cur', +a.dataset.n === i); });
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  /* ---- scale the 1280x720 stage to the available space ---- */
  function fit(){
    var w = document.getElementById('wrap');
    var s = Math.min(w.clientWidth / 1280, w.clientHeight / 720);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){
    var n = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(n) && n - 1 !== i) go(n - 1);
  });

  document.getElementById('bnext').addEventListener('click', function(){ go(i + 1); });
  document.getElementById('bprev').addEventListener('click', function(){ go(i - 1); });
  document.getElementById('btoc').addEventListener('click', function(){ toc.classList.toggle('on'); });
  document.getElementById('bnotes').addEventListener('click', function(){ notes.classList.toggle('on'); });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(i - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(total - 1); }
    else if (k === 't' || k === 'T') { toc.classList.toggle('on'); }
    else if (k === 'n' || k === 'N') { notes.classList.toggle('on'); }
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if (k === 'Escape') { toc.classList.remove('on'); notes.classList.remove('on'); }
  });

  fit();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(isNaN(start) ? 0 : start - 1);
})();
</script>
