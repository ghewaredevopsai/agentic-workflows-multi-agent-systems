<div class="slide title" data-sec="Title" data-notes="Three slides, and they are three systems rather than three concepts. Say that up front: the shapes -- supervisor, fan-out, cycle -- were built in Module 3, and the rubric for when to use more than one agent was Module 1. Neither is repeated here. What this module does is show three real systems that are built out of them, and then hand the room the bench for the rest of the session. Open by asking which of the three they have already been asked to build. In most rooms it is the first, and someone always has the third in production without calling it an agent.">
  <h1>Multi-Agent Collaboration &amp; Orchestration</h1>
  <div class="sub">Module 5 &middot; Day 2 &mdash; Tools, MCP, Orchestration &amp; Agentic RAG</div>
  <div class="rule"></div>
  <div class="meta">
    Agentic Workflows &amp; Multi-Agent Systems &middot; 3 days &middot; Advanced<br>
    Trainer: Rajesh Gheware
  </div>

<div class="slide" data-sec="Support triage" data-notes="Use case one, and the one everybody recognises. Walk it left to right: tickets arrive on one queue, a supervisor node reads each and picks a specialist, one specialist runs, and a resolve node writes the reply. The whole multi-agent part is the one call to add_conditional_edges -- fn takes STATE and returns a KEY, path_map says which node each key means, and people mix those two up constantly. The point to press: a supervisor is a classifier, so it has an accuracy, and almost nobody measures it. A router that misroutes one ticket in five wastes every token spent downstream of the mistake, and the routing call is the cheapest one in the graph -- so cheapening the router is usually the wrong trade. Lab 5.1 builds exactly this graph, scores the rule-based router against a labelled eval set, then swaps in a model-routed supervisor and scores that. Ask the room how their own service desk routes today; it is almost always keywords, and it is usually better than they expect.">

<div class="slide" data-sec="Report writer" data-notes="Use case two: the shape changes from one-of-N to all-of-N. A planner splits the brief into questions, the researchers run in the same superstep, and a writer turns whatever came back into one document. The thing to spend time on is the box in the middle, because it is where the bug lives. Three nodes returning findings in one superstep all write the same state key. If that key carries no reducer, LangGraph raises InvalidUpdateError -- it does not silently drop two of the three. Say that plainly, because most rooms expect silent loss: silent loss is what a hand-rolled dict.update does, and a hand-rolled merge is what people write before they know about Annotated. So the framework protects the keys you declared, and only those. Second point, if there is time: parallelism buys latency, not tokens. The same work is still paid for, just sooner -- if the bill is the problem, fanning out will not help at all. Lab 5.2 builds it, including the un-annotated twin that raises, so they see the error rather than being told about it.">

<div class="slide" data-sec="Incident response" data-notes="Use case three, and the one most likely to already be running in their estate under a different name. An alert arrives, triage matches it to a runbook, a remediation is attempted, and a verify node asks whether it held. Everything interesting is in what happens when it did not. The backwards edge is a cycle -- an edge pointing at a node that already ran -- and it is the same construct as Module 3's loop, so what makes it safe is the same thing: a budget that is a property of the RUN, decremented every attempt, not a per-node retry count. Per-node budgets multiply, and people write per-node budgets because that is where the code is. Then the part worth arguing about: exhausting the budget is not an error, it is a routing decision, and the way out is a node. An escalate node that assembles the handoff -- what was tried, what happened each time, what is still unknown -- is the difference between waking someone up with a page and waking someone up with a case. Lab 5.3 builds both halves and makes the handoff the thing that is graded.">
  <h2>An incident responder that knows when to stop</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="An alert is triaged against a runbook, a remediation is attempted and verified, failures cycle back with backoff until the attempt budget is spent, and then an escalate node hands off to a human">
      <text x="590" y="48" text-anchor="middle" class="bds" font-weight="700" fill="#4338ca">the cycle needs a budget &mdash; and the way out needs a node</text>

      <rect x="20" y="178" width="182" height="76" rx="6" fill="#f8f8fd" stroke="#cbd5e1" stroke-width="1.8"/>
      <text x="111" y="208" text-anchor="middle" class="bxs">alert</text>
      <text x="111" y="232" text-anchor="middle" class="bds">p99 &gt; 2s on checkout</text>

      <line x1="206" y1="216" x2="232" y2="216" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>

      <rect x="240" y="178" width="152" height="76" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="316" y="208" text-anchor="middle" class="bx">triage</text>
      <text x="316" y="232" text-anchor="middle" class="bds">match runbook</text>

      <line x1="396" y1="216" x2="422" y2="216" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>

      <rect x="430" y="178" width="176" height="76" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="518" y="208" text-anchor="middle" class="bx">remediate</text>
      <text x="518" y="232" text-anchor="middle" class="bds">the safe fix</text>

      <line x1="610" y1="216" x2="636" y2="216" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>

      <rect x="644" y="178" width="152" height="76" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="720" y="208" text-anchor="middle" class="bx">verify</text>
      <text x="720" y="232" text-anchor="middle" class="bds">did it hold?</text>

      <path d="M720,178 L720,116 L518,116 L518,172" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#aa)"/>

<div class="slide div" data-sec="End" data-notes="Into the labs, and the labs are the module. Three systems, one each: 5.1 is the triage desk -- build the graph, then score the supervisor against a labelled eval set and swap in a model-routed one. 5.2 is the report writer -- fan out, meet InvalidUpdateError for real, declare the reducer, and decide what the writer does when two researchers disagree. 5.3 is the incident responder -- the retry cycle with a run-level budget, and the escalate node that assembles a handoff. Every lab builds real LangGraph objects; the self-checks assert on those and need no model, and the cells marked 'Run it for real' are the ones that go to the gateway.">
  <div class="k">End of Module 5</div>

</div>
</template>

<script>
(function(){
  var stage = document.getElementById('stage');
  stage.appendChild(document.getElementById('deck').content.cloneNode(true));
  var slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));
  var i = 0, total = slides.length;

  var num = document.getElementById('num'),
      progf = document.getElementById('progf'),
      secname = document.getElementById('secname'),
      toc = document.getElementById('toc'),
      toclist = document.getElementById('toclist'),
      notes = document.getElementById('notes'),
      notesbody = document.getElementById('notesbody');

  /* ---- build the index, grouped by section ---- */
  var groups = [], last = null;
  slides.forEach(function(s, n){
    var sec = s.getAttribute('data-sec') || '';
    if (sec !== last) { groups.push({sec: sec, items: []}); last = sec; }
    var h = s.querySelector('h2, h1'), q = s.querySelector('.qtag');
    var t = h ? h.textContent.trim() : sec;
    if (q) t = q.textContent.trim() + ' \u2014 ' + t;
    groups[groups.length-1].items.push({n: n, t: t});
  });
  groups.forEach(function(g){
    var d = document.createElement('div'); d.className = 'grp';
    var hd = document.createElement('div'); hd.className = 'grph'; hd.textContent = g.sec; d.appendChild(hd);
    g.items.forEach(function(it){
      var a = document.createElement('a');
      a.href = '#'; a.dataset.n = it.n;
      a.innerHTML = '<span class="n">' + (it.n + 1) + '</span>';
      a.appendChild(document.createTextNode(it.t));
      a.addEventListener('click', function(e){ e.preventDefault(); go(it.n); toc.classList.remove('on'); });
      d.appendChild(a);
    });
    toclist.appendChild(d);
  });
  var tocLinks = Array.prototype.slice.call(toclist.querySelectorAll('a'));

  function go(n){
    if (n < 0) n = 0;
    if (n > total - 1) n = total - 1;
    slides[i].classList.remove('active');
    i = n;
    slides[i].classList.add('active');
    num.textContent = (i + 1) + ' / ' + total;
    progf.style.width = ((i + 1) / total * 100) + '%';
    secname.textContent = slides[i].getAttribute('data-sec') || '';
    notesbody.textContent = slides[i].getAttribute('data-notes') || 'No notes for this slide.';
    tocLinks.forEach(function(a){ a.classList.toggle('cur', +a.dataset.n === i); });
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  /* ---- scale the 1280x720 stage to the available space ---- */
  function fit(){
    var w = document.getElementById('wrap');
    var s = Math.min(w.clientWidth / 1280, w.clientHeight / 720);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){
    var n = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(n) && n - 1 !== i) go(n - 1);
  });

  document.getElementById('bnext').addEventListener('click', function(){ go(i + 1); });
  document.getElementById('bprev').addEventListener('click', function(){ go(i - 1); });
  document.getElementById('btoc').addEventListener('click', function(){ toc.classList.toggle('on'); });
  document.getElementById('bnotes').addEventListener('click', function(){ notes.classList.toggle('on'); });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(i - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(total - 1); }
    else if (k === 't' || k === 'T') { toc.classList.toggle('on'); }
    else if (k === 'n' || k === 'N') { notes.classList.toggle('on'); }
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if (k === 'Escape') { toc.classList.remove('on'); notes.classList.remove('on'); }
  });

  fit();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(isNaN(start) ? 0 : start - 1);
})();
</script>
</body>
