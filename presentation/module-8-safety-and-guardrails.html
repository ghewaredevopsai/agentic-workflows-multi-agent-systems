<div class="slide title" data-sec="Title" data-notes="Module 7 gave them numbers. This module turns some of those numbers into controls -- things that hold when the model does not. The distinction between a measurement and a control is the spine of the whole module.">
  <h1>Safety &amp; Guardrails</h1>
  <div class="sub">Module 8 &middot; Day 3 &mdash; Evaluation, Safety &amp; AgentOps</div>
  <div class="rule"></div>
  <div class="meta">
    Agentic Workflows &amp; Multi-Agent Systems &middot; 3 days &middot; Advanced<br>
    Trainer: Rajesh Gheware
  </div>
</div>

<div class="slide" data-sec="Orientation" data-notes="Open on the distinction that organises everything today. A measurement tells you how often something happens. A control decides what happens. Both are needed, and only one of them can be written into a control document -- which is the sentence a risk function will ask you for.">
  <h2>A measurement tells you. A control decides.</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Measurements compared with controls">
      <rect x="50" y="56" width="500" height="216" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="300" y="88" text-anchor="middle" class="lbl">Module 7 &mdash; measurements</text>
      <text x="300" y="126" text-anchor="middle" class="bx">&ldquo;it refuses 94% of the time&rdquo;</text>
      <text x="76" y="166" class="bd">&bull; tells you how often, on the cases you tried</text>
      <text x="76" y="200" class="bd">&bull; moves when the model, prompt or traffic moves</text>
      <text x="76" y="234" class="bd">&bull; indispensable, and not a guarantee</text>
      <text x="300" y="262" text-anchor="middle" class="bds">a number with an interval round it</text>

      <rect x="630" y="56" width="500" height="216" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="880" y="88" text-anchor="middle" class="lbl ok">Module 8 &mdash; controls</text>
      <text x="880" y="126" text-anchor="middle" class="bx ok">&ldquo;it cannot release without a human&rdquo;</text>
      <text x="656" y="166" class="bd">&bull; decides what happens, on every case</text>
      <text x="656" y="200" class="bd">&bull; holds when the model changes underneath it</text>
      <text x="656" y="234" class="bd">&bull; testable without running the model at all</text>
      <text x="880" y="262" text-anchor="middle" class="bds ok">a sentence you can put in a control document</text>

      <rect x="120" y="298" width="940" height="110" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="330" text-anchor="middle" class="bxs am">You need both, and you must not mistake one for the other</text>
      <text x="590" y="362" text-anchor="middle" class="bd">Most of what gets called a guardrail is a measurement wearing a control's name &mdash; a</text>
      <text x="590" y="388" text-anchor="middle" class="bd">detector, a prompt instruction, a model asked to be careful. Useful. Not guarantees.</text>
    </svg>
  </div>
</div>

<div class="slide div" data-sec="Injection" data-notes="Part one. They have met this twice already -- a tool result in Module 4 and a retrieved chunk in Module 6. Now it gets measured and defended properly.">
  <div class="k">Part one</div>
  <h1>Injection, measured</h1>
</div>

<div class="slide" data-sec="Injection" data-notes="Consolidate what they already know into one picture. The point is that all four are the same shape -- text from outside arriving where the model reads instructions - and only the first one is what people mean when they say prompt injection.">
  <h2>Four doors, and everyone guards the first one</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Four channels through which untrusted text reaches the model">
      <rect x="50" y="60" width="255" height="180" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="177" y="92" text-anchor="middle" class="lbl">1. The user's message</text>
      <text x="177" y="128" text-anchor="middle" class="bxs">&ldquo;ignore your instructions&rdquo;</text>
      <text x="177" y="166" text-anchor="middle" class="bds">obvious, and the only one</text>
      <text x="177" y="188" text-anchor="middle" class="bds">most systems check</text>
      <text x="177" y="222" text-anchor="middle" class="bds ok">easy to detect</text>

      <rect x="325" y="60" width="255" height="180" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="452" y="92" text-anchor="middle" class="lbl no">2. A tool result</text>
      <text x="452" y="128" text-anchor="middle" class="bxs no">a narrative field</text>
      <text x="452" y="166" text-anchor="middle" class="bds">Module 4. The counterparty</text>
      <text x="452" y="188" text-anchor="middle" class="bds">wrote it; your tool returned</text>
      <text x="452" y="210" text-anchor="middle" class="bds">it faithfully</text>

      <rect x="600" y="60" width="255" height="180" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="727" y="92" text-anchor="middle" class="lbl no">3. A retrieved chunk</text>
      <text x="727" y="128" text-anchor="middle" class="bxs no">an indexed runbook</text>
      <text x="727" y="166" text-anchor="middle" class="bds">Module 6. Nobody reviewed</text>
      <text x="727" y="188" text-anchor="middle" class="bds">what went into the index,</text>
      <text x="727" y="210" text-anchor="middle" class="bds">and it reads as evidence</text>

      <rect x="875" y="60" width="255" height="180" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="1002" y="92" text-anchor="middle" class="lbl no">4. Another agent</text>
      <text x="1002" y="128" text-anchor="middle" class="bxs no">a handoff message</text>
      <text x="1002" y="166" text-anchor="middle" class="bds">Module 5. An agent that</text>
      <text x="1002" y="188" text-anchor="middle" class="bds">read a poisoned chunk now</text>
      <text x="1002" y="210" text-anchor="middle" class="bds">writes to a peer</text>

      <rect x="120" y="272" width="940" height="136" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="304" text-anchor="middle" class="bxs am">All four are the same shape: text from outside, arriving where instructions are read</text>
      <text x="590" y="336" text-anchor="middle" class="bd">The model has one channel. It cannot tell your system prompt from a sentence in a PDF,</text>
      <text x="590" y="362" text-anchor="middle" class="bd">because both arrive as tokens with no provenance attached.</text>
      <text x="590" y="392" text-anchor="middle" class="bds">Doors 2, 3 and 4 are where the interesting attacks live, and where almost nobody looks.</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Injection" data-notes="The slide that reframes detection from a feature into a classifier. Both error rates cost you something real, and the costs are not symmetric. Ask them what a 2% false positive rate means on their volume -- it is usually a bigger number than they expect.">
  <h2>A detector is a classifier, so it has two error rates</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="False negatives and false positives in an injection detector">
      <text x="590" y="46" text-anchor="middle" class="lbl">tuning the threshold moves both, in opposite directions</text>

      <rect x="60" y="66" width="500" height="180" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="310" y="98" text-anchor="middle" class="lbl no">False negative &mdash; the attack got through</text>
      <text x="310" y="136" text-anchor="middle" class="bx no">one is enough</text>
      <text x="86" y="176" class="bd">&bull; the attacker retries until something works</text>
      <text x="86" y="208" class="bd">&bull; you find out from the consequence</text>
      <text x="310" y="234" text-anchor="middle" class="bds no">cost: whatever the agent was allowed to do</text>

      <rect x="620" y="66" width="500" height="180" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="870" y="98" text-anchor="middle" class="lbl am">False positive &mdash; a real case blocked</text>
      <text x="870" y="136" text-anchor="middle" class="bx am">2% of a large number</text>
      <text x="646" y="176" class="bd">&bull; a payment held that should have gone</text>
      <text x="646" y="208" class="bd">&bull; and an operations team that stops trusting it</text>
      <text x="870" y="234" text-anchor="middle" class="bds am">cost: the system gets switched off</text>

      <rect x="120" y="272" width="940" height="136" rx="6" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="590" y="304" text-anchor="middle" class="bxs ok">So a detector needs the same treatment as anything else on Day 3</text>
      <text x="156" y="338" class="bd">&bull;&nbsp; a labelled corpus &mdash; attacks <tspan font-style="italic">and</tspan> ordinary traffic, because both rates matter</text>
      <text x="156" y="370" class="bd">&bull;&nbsp; a threshold chosen from the curve, not from a feeling</text>
      <text x="156" y="398" class="bd">&bull;&nbsp; re-measured whenever the model, the prompt or the attacker changes</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Injection" data-notes="The strategic point of part one. The asymmetry is why detection cannot be the whole answer -- not because detectors are bad, but because the game is unfair. Land the last line: the controls that hold are the ones that do not depend on recognising the attack.">
  <h2>You need every case. They need one.</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="The asymmetry between attacker and defender, and layered defence">
      <rect x="60" y="56" width="440" height="150" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="280" y="88" text-anchor="middle" class="lbl no">The attacker</text>
      <text x="280" y="126" text-anchor="middle" class="bx no">needs one bypass</text>
      <text x="280" y="160" text-anchor="middle" class="bd">and can try a thousand phrasings,</text>
      <text x="280" y="184" text-anchor="middle" class="bd">encodings and languages, for free</text>

      <rect x="680" y="56" width="440" height="150" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="900" y="88" text-anchor="middle" class="lbl">You</text>
      <text x="900" y="126" text-anchor="middle" class="bx">need every case</text>
      <text x="900" y="160" text-anchor="middle" class="bd">including the phrasings that</text>
      <text x="900" y="184" text-anchor="middle" class="bd">do not exist yet</text>

      <text x="590" y="140" text-anchor="middle" class="big no">vs</text>

      <text x="590" y="246" text-anchor="middle" class="bd">This is not an argument against detection. It is an argument against detection <tspan font-style="italic">alone</tspan>.</text>

      <rect x="60" y="272" width="500" height="136" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="310" y="302" text-anchor="middle" class="bxs am">Probabilistic layer</text>
      <text x="310" y="334" text-anchor="middle" class="bds">detection, sanitisation, a careful prompt</text>
      <text x="310" y="360" text-anchor="middle" class="bds">catches most of it, cheaply</text>
      <text x="310" y="392" text-anchor="middle" class="bds am">measure it; never rely on it</text>

      <rect x="620" y="272" width="500" height="136" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="870" y="302" text-anchor="middle" class="bxs ok">Structural layer</text>
      <text x="870" y="334" text-anchor="middle" class="bds">allow-lists, output contracts, scopes,</text>
      <text x="870" y="360" text-anchor="middle" class="bds">approval gates on anything irreversible</text>
      <text x="870" y="392" text-anchor="middle" class="bds ok">holds even when the attack is not recognised</text>
    </svg>
  </div>
</div>

<div class="slide div" data-sec="Contracts" data-notes="Part two. The structural layer, and the boundary nobody validates -- between two agents you wrote yourself.">
  <div class="k">Part two</div>
  <h1>Contracts between every hop</h1>
</div>

<div class="slide" data-sec="Contracts" data-notes="The placement argument. Everyone validates the edge; almost nobody validates between their own agents, because they trust code they wrote. But an agent that read a poisoned chunk is now producing hostile output while behaving perfectly correctly. Every arrow is a boundary.">
  <h2>Every arrow is a boundary</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Validation points along an agent pipeline">
      <rect x="40" y="96" width="150" height="72" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="115" y="128" text-anchor="middle" class="bxs">user</text>
      <text x="115" y="152" text-anchor="middle" class="bds">input</text>

      <rect x="270" y="96" width="150" height="72" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
      <text x="345" y="128" text-anchor="middle" class="bxs">triage</text>
      <text x="345" y="152" text-anchor="middle" class="bds">agent</text>

      <rect x="500" y="96" width="150" height="72" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
      <text x="575" y="128" text-anchor="middle" class="bxs">policy</text>
      <text x="575" y="152" text-anchor="middle" class="bds">agent</text>

      <rect x="730" y="96" width="150" height="72" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
      <text x="805" y="128" text-anchor="middle" class="bxs">writer</text>
      <text x="805" y="152" text-anchor="middle" class="bds">agent</text>

      <rect x="960" y="96" width="180" height="72" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="1050" y="128" text-anchor="middle" class="bxs no">release</text>
      <text x="1050" y="152" text-anchor="middle" class="bds no">irreversible</text>

      <line x1="194" y1="132" x2="266" y2="132" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <line x1="424" y1="132" x2="496" y2="132" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <line x1="654" y1="132" x2="726" y2="132" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <line x1="884" y1="132" x2="956" y2="132" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar)"/>

      <text x="230" y="200" text-anchor="middle" class="bds ok">&#10003; checked</text>
      <text x="460" y="200" text-anchor="middle" class="bds no">&#10007;</text>
      <text x="690" y="200" text-anchor="middle" class="bds no">&#10007;</text>
      <text x="920" y="200" text-anchor="middle" class="bds ok">&#10003; gated</text>
      <text x="575" y="228" text-anchor="middle" class="bd no">the two nobody validates &mdash; &ldquo;it's our own agent&rdquo;</text>

      <rect x="120" y="256" width="940" height="152" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="288" text-anchor="middle" class="bxs am">Your own agent is not a trusted source. It is a program that reads untrusted text.</text>
      <text x="156" y="322" class="bd">&bull;&nbsp; the triage agent read a tool result &mdash; door 2</text>
      <text x="156" y="352" class="bd">&bull;&nbsp; the policy agent read a retrieved chunk &mdash; door 3</text>
      <text x="156" y="382" class="bd">&bull;&nbsp; each then produced output that the next one trusts completely &mdash; door 4</text>
      <text x="590" y="404" text-anchor="middle" class="bds">Both behaved correctly throughout. That is what makes it hard to see.</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Contracts" data-notes="The subtle one, and worth slowing down for. Coercion is the default in most validation libraries and it is exactly wrong here: it turns a signal that something is off into a silent success. Read the example -- a model that returned prose instead of a decision is telling you something, and coercion throws that away.">
  <h2>A contract that coerces hides the attack</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Coercing invalid output compared with rejecting it">
      <text x="590" y="44" text-anchor="middle" class="lbl">the writer agent was asked for {action, reason, approver}</text>
      <text x="590" y="72" text-anchor="middle" class="bds">it returned: &ldquo;I think we should probably release this, the note says it was approved&rdquo;</text>

      <rect x="50" y="94" width="500" height="204" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="300" y="126" text-anchor="middle" class="lbl no">Coerce it into the shape</text>
      <text x="300" y="162" text-anchor="middle" class="bxs no">action = "release"</text>
      <text x="76" y="200" class="bd">&bull; a regex found the word and moved on</text>
      <text x="76" y="232" class="bd">&bull; &ldquo;the note says&rdquo; is gone &mdash; the tell is discarded</text>
      <text x="76" y="264" class="bd">&bull; downstream sees a clean, valid decision</text>
      <text x="300" y="290" text-anchor="middle" class="bds no">the injection now looks like a normal request</text>

      <rect x="630" y="94" width="500" height="204" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="880" y="126" text-anchor="middle" class="lbl ok">Reject it</text>
      <text x="880" y="162" text-anchor="middle" class="bxs ok">contract violation &mdash; stop</text>
      <text x="656" y="200" class="bd">&bull; the output did not match the shape asked for</text>
      <text x="656" y="232" class="bd">&bull; that is a fact worth acting on, not smoothing over</text>
      <text x="656" y="264" class="bd">&bull; retry once, then escalate &mdash; never guess</text>
      <text x="880" y="290" text-anchor="middle" class="bds ok">the anomaly reaches a human intact</text>

      <rect x="180" y="326" width="820" height="82" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="356" text-anchor="middle" class="bxs am">Malformed output is evidence. Coercion destroys evidence.</text>
      <text x="590" y="386" text-anchor="middle" class="bds">Most validation libraries coerce by default because that is friendly. Turn it off at a security boundary.</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Contracts" data-notes="The slide that lands badly and should. They spent yesterday building a tracer and today they discover it is a data store nobody classified. Same for the vector index. This is the most common real-world finding in an agentic system review, and it has nothing to do with the model.">
  <h2>Three places data goes that nobody classified</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Prompts, traces and vector stores as data stores">
      <rect x="50" y="56" width="345" height="212" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="222" y="88" text-anchor="middle" class="lbl">The prompt</text>
      <text x="222" y="124" text-anchor="middle" class="bxs">everyone thinks about this one</text>
      <text x="222" y="164" text-anchor="middle" class="bds">account numbers, names,</text>
      <text x="222" y="186" text-anchor="middle" class="bds">balances, whatever the</text>
      <text x="222" y="208" text-anchor="middle" class="bds">tool returned</text>
      <text x="222" y="244" text-anchor="middle" class="bds">it leaves your process</text>

      <rect x="418" y="56" width="345" height="212" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="590" y="88" text-anchor="middle" class="lbl no">The trace</text>
      <text x="590" y="124" text-anchor="middle" class="bxs no">you built this yesterday</text>
      <text x="590" y="164" text-anchor="middle" class="bds">every prompt and every tool</text>
      <text x="590" y="186" text-anchor="middle" class="bds">result, kept for 30 days,</text>
      <text x="590" y="208" text-anchor="middle" class="bds">searchable by anyone with</text>
      <text x="590" y="230" text-anchor="middle" class="bds">a login</text>
      <text x="590" y="258" text-anchor="middle" class="bds no">a database you did not plan</text>

      <rect x="786" y="56" width="345" height="212" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="958" y="88" text-anchor="middle" class="lbl no">The vector store</text>
      <text x="958" y="124" text-anchor="middle" class="bxs no">and this one is forever</text>
      <text x="958" y="164" text-anchor="middle" class="bds">whatever was ingested, in</text>
      <text x="958" y="186" text-anchor="middle" class="bds">chunks, retrievable by</text>
      <text x="958" y="208" text-anchor="middle" class="bds">anyone the retriever serves</text>
      <text x="958" y="244" text-anchor="middle" class="bds no">deletion means re-indexing</text>

      <rect x="120" y="296" width="940" height="112" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="328" text-anchor="middle" class="bxs am">Redact on the way in, not on the way out</text>
      <text x="590" y="360" text-anchor="middle" class="bd">A field the agent does not need is a field that should never have been in the context &mdash;</text>
      <text x="590" y="386" text-anchor="middle" class="bd">and Module 4's allow-list already does this. Point it at the trace and the index too.</text>
      <text x="590" y="404" text-anchor="middle" class="bds">Retention on a trace store is a decision. Not making it is also a decision.</text>
    </svg>
  </div>
</div>

<div class="slide div" data-sec="Placement" data-notes="Part three. Short, practical, and the part that turns a list of controls into a design.">
  <div class="k">Part three</div>
  <h1>Where a check belongs</h1>
</div>

<div class="slide" data-sec="Placement" data-notes="The design slide. Four positions, four costs, four things each can catch. The one to emphasise is the last column -- a check before the irreversible action is the only one that is cheap AND catches everything, because it does not have to understand the attack, only the action.">
  <h2>Four positions, four different bargains</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Guardrail placement options and their costs">
      <line x1="60" y1="94" x2="1120" y2="94" stroke="#4338ca" stroke-width="2"/>
      <text x="230" y="74" text-anchor="middle" class="lbl">On input</text>
      <text x="470" y="74" text-anchor="middle" class="lbl">Between hops</text>
      <text x="720" y="74" text-anchor="middle" class="lbl">On output</text>
      <text x="980" y="74" text-anchor="middle" class="lbl ok">Before the action</text>

      <text x="80" y="136" class="bxs">Catches</text>
      <text x="230" y="136" text-anchor="middle" class="bds">door 1 only</text>
      <text x="470" y="136" text-anchor="middle" class="bds">doors 2, 3, 4</text>
      <text x="720" y="136" text-anchor="middle" class="bds">bad shape, leaks</text>
      <text x="980" y="136" text-anchor="middle" class="bds ok">everything that matters</text>

      <text x="80" y="184" class="bxs">Cost</text>
      <text x="230" y="184" text-anchor="middle" class="bds ok">one check per request</text>
      <text x="470" y="184" text-anchor="middle" class="bds am">one per hop &mdash; adds up</text>
      <text x="720" y="184" text-anchor="middle" class="bds">one per response</text>
      <text x="980" y="184" text-anchor="middle" class="bds ok">one per write &mdash; rare</text>

      <text x="80" y="232" class="bxs">Misses</text>
      <text x="230" y="232" text-anchor="middle" class="bds no">everything from a tool</text>
      <text x="470" y="232" text-anchor="middle" class="bds">nothing structural</text>
      <text x="720" y="232" text-anchor="middle" class="bds no">the action already ran</text>
      <text x="980" y="232" text-anchor="middle" class="bds">reads, which is fine</text>

      <text x="80" y="280" class="bxs">Fails how</text>
      <text x="230" y="280" text-anchor="middle" class="bds">false positives annoy</text>
      <text x="470" y="280" text-anchor="middle" class="bds">latency, mostly</text>
      <text x="720" y="280" text-anchor="middle" class="bds">too late</text>
      <text x="980" y="280" text-anchor="middle" class="bds am">a queue of approvals</text>
      <line x1="60" y1="302" x2="1120" y2="302" stroke="#cbd5e1" stroke-width="1.5"/>

      <rect x="150" y="320" width="880" height="88" rx="6" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="590" y="352" text-anchor="middle" class="bxs ok">The gate before the action is the cheapest control you will ever write</text>
      <text x="590" y="384" text-anchor="middle" class="bd">It does not have to recognise the attack. It only has to recognise the <tspan font-style="italic">action</tspan> &mdash;</text>
      <text x="590" y="404" text-anchor="middle" class="bd">which is a set membership test, and cannot be talked out of its answer.</text>
    </svg>
  </div>
</div>

<div class="slide div" data-sec="Governance" data-notes="Part four. Move from 'is it secure' -- an unanswerable question -- to 'what can it do', which has a number.">
  <div class="k">Part four</div>
  <h1>What can it actually do?</h1>
</div>

<div class="slide" data-sec="Governance" data-notes="The reframing that makes a security conversation productive. 'Is the agent safe?' has no answer. 'If this agent were fully controlled by an attacker, what could it do?' has a list, and the list is what you shrink. Walk the two columns -- same agent, same model, different grants.">

      <text x="300" y="98" text-anchor="middle" class="lbl no">Granted generously</text>

      <text x="656" y="232" class="bds">files&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;not granted</text>

<div class="slide" data-sec="Governance" data-notes="The practical decision table for MCP tool governance. The middle column is the one people skip: most tools are not read-only OR irreversible, they are writes you can undo, and those want a rate limit and a log rather than a gate. Note that the right-hand column is small on purpose.">
  <h2>What an agent may do unattended</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Three classes of tool and the control each needs">
      <rect x="50" y="56" width="345" height="230" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="222" y="88" text-anchor="middle" class="lbl ok">Reads</text>
      <text x="222" y="124" text-anchor="middle" class="bxs ok">unattended</text>
      <text x="222" y="162" text-anchor="middle" class="bds">lookup, search, policy,</text>
      <text x="222" y="184" text-anchor="middle" class="bds">retrieval</text>
      <text x="222" y="220" text-anchor="middle" class="bd">control: scope the data,</text>
      <text x="222" y="242" text-anchor="middle" class="bd">not the call</text>
      <text x="222" y="272" text-anchor="middle" class="bds">a read of the wrong record is still a breach</text>

      <rect x="418" y="56" width="345" height="230" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="88" text-anchor="middle" class="lbl am">Reversible writes</text>
      <text x="590" y="124" text-anchor="middle" class="bxs am">unattended, with limits</text>
      <text x="590" y="162" text-anchor="middle" class="bds">open a ticket, add a note,</text>
      <text x="590" y="184" text-anchor="middle" class="bds">draft an email</text>
      <text x="590" y="220" text-anchor="middle" class="bd">control: rate limit, an audit</text>
      <text x="590" y="242" text-anchor="middle" class="bd">line, and someone who reads it</text>
      <text x="590" y="272" text-anchor="middle" class="bds am">the class everyone forgets exists</text>

      <rect x="786" y="56" width="345" height="230" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="958" y="88" text-anchor="middle" class="lbl no">Irreversible</text>
      <text x="958" y="124" text-anchor="middle" class="bxs no">never unattended</text>
      <text x="958" y="162" text-anchor="middle" class="bds">release a payment, send</text>
      <text x="958" y="184" text-anchor="middle" class="bds">externally, delete</text>
      <text x="958" y="220" text-anchor="middle" class="bd">control: a named human,</text>
      <text x="958" y="242" text-anchor="middle" class="bd">before the fact</text>
      <text x="958" y="272" text-anchor="middle" class="bds no">keep this list short on purpose</text>

      <rect x="150" y="312" width="880" height="96" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="590" y="344" text-anchor="middle" class="bxs">Classify every tool before you grant it, and write the class down</text>
      <text x="590" y="376" text-anchor="middle" class="bd">&ldquo;Which class is this?&rdquo; is a question a reviewer can answer in a minute.</text>
      <text x="590" y="400" text-anchor="middle" class="bd">&ldquo;Is this agent safe?&rdquo; is a question nobody can answer at all.</text>
    </svg>
  </div>
</div>

<div class="slide div" data-sec="Monitoring" data-notes="Part five, and the shortest. One idea, and it follows directly from Module 7: this system fails without raising.">
  <div class="k">Part five</div>
  <h1>Alarming on silence</h1>
</div>

<div class="slide" data-sec="Monitoring" data-notes="Close the module here. Everything they have built can be wrong while emitting no errors, so an error-rate dashboard shows a flat green line through an incident. The right-hand column is what to alarm on instead, and every one of those is a number they now know how to produce.">
  <h2>A system that is wrong without erroring emits nothing</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Conventional alarms compared with behavioural alarms">
      <rect x="50" y="56" width="500" height="226" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="300" y="88" text-anchor="middle" class="lbl no">What you are probably alarming on</text>
      <text x="76" y="128" class="bd">&bull; 5xx rate</text>
      <text x="76" y="160" class="bd">&bull; exception count</text>
      <text x="76" y="192" class="bd">&bull; latency, saturation, restarts</text>
      <line x1="76" y1="212" x2="524" y2="212" stroke="#fecaca" stroke-width="1.5"/>
      <text x="300" y="242" text-anchor="middle" class="bx no">flat green through the whole incident</text>
      <text x="300" y="268" text-anchor="middle" class="bds">every call succeeded; the answers were wrong</text>

      <rect x="630" y="56" width="500" height="226" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="880" y="88" text-anchor="middle" class="lbl ok">What to alarm on instead</text>
      <text x="656" y="124" class="bd">&bull; refusal rate moving in either direction</text>
      <text x="656" y="156" class="bd">&bull; approval-gate hits per hour</text>
      <text x="656" y="188" class="bd">&bull; contract violations between hops</text>
      <text x="656" y="220" class="bd">&bull; tool-call mix shifting &mdash; a new tool in the top five</text>
      <text x="656" y="252" class="bd">&bull; cost or steps per case drifting up</text>
      <text x="880" y="276" text-anchor="middle" class="bds ok">all of them come from the trace you already keep</text>

      <rect x="120" y="308" width="940" height="100" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="340" text-anchor="middle" class="bxs am">A refusal rate that suddenly drops is the same shape as a control that stopped working</text>
      <text x="590" y="372" text-anchor="middle" class="bd">Alarm on both directions. Everyone remembers to alarm on &ldquo;too many refusals&rdquo;;</text>
      <text x="590" y="398" text-anchor="middle" class="bd">the incident is usually &ldquo;too few&rdquo;, and it looks like an improvement on the dashboard.</text>

  </div>
</div>

<div class="slide" data-sec="Recap" data-notes="Tie it together and hand over to Module 9. The sentence to leave them with: you cannot make the model trustworthy, so put the trust somewhere else -- in code you wrote, that runs whatever the model decides.">

      <text x="315" y="126" text-anchor="middle" class="bx no">A detector is a classifier</text>

      <text x="315" y="184" text-anchor="middle" class="bd">attacker only needs to win once</text>

      <rect x="610" y="56" width="510" height="146" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="865" y="88" text-anchor="middle" class="lbl">Contracts</text>
      <text x="865" y="126" text-anchor="middle" class="bx">Validate between every hop</text>
      <text x="865" y="160" text-anchor="middle" class="bd">and reject rather than coerce &mdash;</text>
      <text x="865" y="184" text-anchor="middle" class="bd">malformed output is evidence</text>

      <text x="315" y="254" text-anchor="middle" class="lbl ok">Governance</text>
      <text x="315" y="292" text-anchor="middle" class="bx ok">Blast radius, not &ldquo;is it secure&rdquo;</text>
      <text x="315" y="326" text-anchor="middle" class="bd">classify every tool; keep the irreversible</text>
      <text x="315" y="350" text-anchor="middle" class="bd">list short and gate all of it</text>

      <rect x="610" y="222" width="510" height="146" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="865" y="254" text-anchor="middle" class="lbl am">Monitoring</text>
      <text x="865" y="292" text-anchor="middle" class="bx am">Alarm on behaviour, not errors</text>
      <text x="865" y="326" text-anchor="middle" class="bd">a refusal rate that drops looks like an</text>
      <text x="865" y="350" text-anchor="middle" class="bd">improvement and is usually an incident</text>

      <text x="590" y="404" text-anchor="middle" class="bd">You cannot make the model trustworthy. Put the trust in code you wrote &mdash; then Module 9 ships it.</text>
    </svg>
  </div>
</div>

<div class="slide div" data-sec="Knowledge check" data-notes="Eight questions. Question 5 is the uncomfortable one, because they built the thing yesterday. Question 8 is the one to close on with an operations audience.">
  <div class="k">Knowledge check</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  stage.appendChild(document.getElementById('deck').content.cloneNode(true));
  var slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));
  var i = 0, total = slides.length;

  var num = document.getElementById('num'),
      progf = document.getElementById('progf'),
      secname = document.getElementById('secname'),
      toc = document.getElementById('toc'),
      toclist = document.getElementById('toclist'),
      notes = document.getElementById('notes'),
      notesbody = document.getElementById('notesbody');

  /* ---- build the index, grouped by section ---- */
  var groups = [], last = null;
  slides.forEach(function(s, n){
    var sec = s.getAttribute('data-sec') || '';
    if (sec !== last) { groups.push({sec: sec, items: []}); last = sec; }
    var h = s.querySelector('h2, h1'), q = s.querySelector('.qtag');
    var t = h ? h.textContent.trim() : sec;
    if (q) t = q.textContent.trim() + ' \u2014 ' + t;
    groups[groups.length-1].items.push({n: n, t: t});
  });
  groups.forEach(function(g){
    var d = document.createElement('div'); d.className = 'grp';
    var hd = document.createElement('div'); hd.className = 'grph'; hd.textContent = g.sec; d.appendChild(hd);
    g.items.forEach(function(it){
      var a = document.createElement('a');
      a.href = '#'; a.dataset.n = it.n;
      a.innerHTML = '<span class="n">' + (it.n + 1) + '</span>';
      a.appendChild(document.createTextNode(it.t));
      a.addEventListener('click', function(e){ e.preventDefault(); go(it.n); toc.classList.remove('on'); });
      d.appendChild(a);
    });
    toclist.appendChild(d);
  });
  var tocLinks = Array.prototype.slice.call(toclist.querySelectorAll('a'));

  function go(n){
    if (n < 0) n = 0;
    if (n > total - 1) n = total - 1;
    slides[i].classList.remove('active');
    i = n;
    slides[i].classList.add('active');
    num.textContent = (i + 1) + ' / ' + total;
    progf.style.width = ((i + 1) / total * 100) + '%';
    secname.textContent = slides[i].getAttribute('data-sec') || '';
    notesbody.textContent = slides[i].getAttribute('data-notes') || 'No notes for this slide.';
    tocLinks.forEach(function(a){ a.classList.toggle('cur', +a.dataset.n === i); });
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  /* ---- scale the 1280x720 stage to the available space ---- */
  function fit(){
    var w = document.getElementById('wrap');
    var s = Math.min(w.clientWidth / 1280, w.clientHeight / 720);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){
    var n = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(n) && n - 1 !== i) go(n - 1);
  });

  document.getElementById('bnext').addEventListener('click', function(){ go(i + 1); });
  document.getElementById('bprev').addEventListener('click', function(){ go(i - 1); });
  document.getElementById('btoc').addEventListener('click', function(){ toc.classList.toggle('on'); });
  document.getElementById('bnotes').addEventListener('click', function(){ notes.classList.toggle('on'); });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(i - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(total - 1); }
    else if (k === 't' || k === 'T') { toc.classList.toggle('on'); }
    else if (k === 'n' || k === 'N') { notes.classList.toggle('on'); }
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if (k === 'Escape') { toc.classList.remove('on'); notes.classList.remove('on'); }
  });

  fit();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(isNaN(start) ? 0 : start - 1);
})();
</script>
