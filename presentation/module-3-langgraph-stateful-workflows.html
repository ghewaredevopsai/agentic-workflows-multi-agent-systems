<div class="slide div" data-sec="Why a graph" data-notes="Short divider. The question this section answers: you already have create_agent, so why learn anything else?">
  <div class="k">Section 1</div>
  <h1>Why a graph</h1>
</div>

<div class="slide" data-sec="Why a graph" data-notes="The honest framing. create_agent is not a lesser tool -- it is the right tool when the control flow IS that loop, and most of Day 2 uses it. You drop to LangGraph when the control flow belongs to you. Ask the room for a workflow of theirs that needs a branch or an approval; that is the moment they will need this.">
  <h2>When one loop is not enough</h2>
  <div class="body">
    <svg width="1180" height="415" viewBox="0 0 1180 415" role="img" aria-label="A fixed agent loop compared with control flow you own">
      <rect x="45" y="45" width="510" height="330" rx="8" fill="#f8f8fd" stroke="#4338ca" stroke-width="2.5"/>
      <text x="300" y="82" text-anchor="middle" class="bx">create_agent</text>
      <text x="300" y="108" text-anchor="middle" class="bds">one fixed loop, and a good one</text>

      <rect x="150" y="132" width="140" height="48" rx="6" fill="#4338ca"/>
      <text x="220" y="162" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">model</text>
      <rect x="320" y="132" width="140" height="48" rx="6" fill="#4338ca"/>
      <text x="390" y="162" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">tools</text>
      <line x1="290" y1="156" x2="314" y2="156" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>
      <path d="M390 180 Q390 218 305 218 Q220 218 220 184" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>
      <text x="305" y="240" text-anchor="middle" class="bds">repeat until done</text>

      <text x="300" y="288" text-anchor="middle" class="bd">Right whenever the loop is the workflow</text>
      <text x="300" y="316" text-anchor="middle" class="bds">Most of Day 2 uses it</text>
      <text x="300" y="352" text-anchor="middle" class="bds no">You cannot branch, pause, or inspect inside it</text>

      <rect x="625" y="45" width="510" height="330" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
      <text x="880" y="82" text-anchor="middle" class="bx">StateGraph</text>
      <text x="880" y="108" text-anchor="middle" class="bds">the control flow is yours</text>

      <rect x="660" y="132" width="200" height="44" rx="6" fill="#fff" stroke="#818cf8" stroke-width="2"/>
      <text x="760" y="160" text-anchor="middle" class="bds">branch on the state</text>
      <rect x="900" y="132" width="200" height="44" rx="6" fill="#fff" stroke="#818cf8" stroke-width="2"/>
      <text x="1000" y="160" text-anchor="middle" class="bds">go round again</text>
      <rect x="660" y="188" width="200" height="44" rx="6" fill="#fff" stroke="#818cf8" stroke-width="2"/>
      <text x="760" y="216" text-anchor="middle" class="bds">stop for a person</text>
      <rect x="900" y="188" width="200" height="44" rx="6" fill="#fff" stroke="#818cf8" stroke-width="2"/>
      <text x="1000" y="216" text-anchor="middle" class="bds">resume tomorrow</text>

      <text x="880" y="288" text-anchor="middle" class="bd">Right when a person, a policy or a branch</text>
      <text x="880" y="314" text-anchor="middle" class="bd">has to sit inside the flow</text>
      <text x="880" y="352" text-anchor="middle" class="bxs ok">And all of it is testable without a model</text>
    </svg>
  </div>
  <div class="take"><b>Not a replacement.</b> You drop to LangGraph when the control flow stops being &ldquo;model, tools, repeat&rdquo; and starts being yours.</div>
</div>

<div class="slide" data-sec="Why a graph" data-notes="The core contrast of the module, and the one slide to slow down on. On the left the fact 'this needs a manager' exists only as text inside a conversation -- you cannot assert on it, resume it, or show it to an auditor. On the right it is a field. Everything else in this module follows from that single move, and so does the audit trail two sections later.">
  <h2>From a message list to an object you can inspect</h2>
  <div class="body">
    <svg width="1180" height="405" viewBox="0 0 1180 405" role="img" aria-label="Implicit conversational state compared with an explicit state object">
      <rect x="45" y="42" width="500" height="300" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="295" y="76" text-anchor="middle" class="bx no">State hidden in a conversation</text>
      <rect x="75" y="96" width="440" height="26" rx="3" fill="#fff" stroke="#fecaca"/>
      <text x="90" y="114" font-size="14" fill="#64748b">human: Vikram wants 15 days off</text>
      <rect x="75" y="128" width="440" height="26" rx="3" fill="#fff" stroke="#fecaca"/>
      <text x="90" y="146" font-size="14" fill="#64748b">ai: Action: lookup_request("LV-5004")</text>
      <rect x="75" y="160" width="440" height="26" rx="3" fill="#fff" stroke="#fecaca"/>
      <text x="90" y="178" font-size="14" fill="#64748b">tool: {"days":15,"balance":20, ...}</text>
      <rect x="75" y="192" width="440" height="26" rx="3" fill="#fff" stroke="#fecaca"/>
      <text x="90" y="210" font-size="14" fill="#64748b">ai: that will need manager approval</text>
      <text x="295" y="252" text-anchor="middle" class="bd">Where is &ldquo;needs a manager&rdquo; stored?</text>
      <text x="295" y="282" text-anchor="middle" class="bxs no">Nowhere. It is implied by text.</text>
      <text x="295" y="312" text-anchor="middle" class="bds">You cannot assert on it, resume it,</text>
      <text x="295" y="332" text-anchor="middle" class="bds">or show an auditor what was known when.</text>

      <line x1="560" y1="192" x2="600" y2="192" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>

      <rect x="625" y="42" width="510" height="300" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
      <text x="880" y="76" text-anchor="middle" class="bx ok">State as an explicit object</text>
      <rect x="655" y="96" width="450" height="150" rx="4" fill="#fff" stroke="#99f6e4"/>
      <text x="673" y="120" font-size="15" font-family="Consolas,monospace"><tspan fill="#0d9488">class LeaveState(TypedDict):</tspan></text>
      <text x="673" y="144" font-size="15" font-family="Consolas,monospace"><tspan fill="#475569">    request_id: str</tspan></text>
      <text x="673" y="168" font-size="15" font-family="Consolas,monospace"><tspan fill="#475569">    days: int</tspan></text>
      <text x="673" y="192" font-size="15" font-family="Consolas,monospace"><tspan fill="#475569">    needs_manager: bool</tspan></text>
      <text x="673" y="216" font-size="15" font-family="Consolas,monospace"><tspan fill="#475569">    notes: Annotated[list, add]</tspan></text>
      <text x="673" y="238" font-size="15" font-family="Consolas,monospace"><tspan fill="#b91c1c">    # every node reads and writes THIS</tspan></text>
      <text x="880" y="280" text-anchor="middle" class="bd">Printable. Assertable. Storable.</text>
      <text x="880" y="310" text-anchor="middle" class="bxs ok">Everything else in this module</text>
      <text x="880" y="332" text-anchor="middle" class="bxs ok">follows from that one move.</text>
    </svg>
  </div>
  <div class="take"><b>This is why we drop to LangGraph.</b> Not for the graph &mdash; for the state the graph forces you to declare.</div>
</div>

<div class="slide div" data-sec="The three parts" data-notes="Divider. Three parts and no more: state, nodes, edges. Say that out loud -- people expect a framework and it is three ideas.">
  <div class="k">Section 2</div>
  <h1>State, nodes, edges</h1>
</div>

<div class="slide" data-sec="The three parts" data-notes="Part one of three. A TypedDict is a schema for a plain dict -- there is no new runtime type to learn, which is worth saying because people brace for one. The three properties on the right are what the rest of the module cashes in: assertable gives you Lab 3.1's offline self-checks, storable gives you checkpointing, printable gives you the audit trail.">
  <h2>State &mdash; one object every node reads and writes</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="A TypedDict state schema and the three properties it buys">
      <rect x="45" y="45" width="580" height="300" rx="8" fill="#fff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="335" y="82" text-anchor="middle" class="bx">A TypedDict, and nothing more</text>
      <text x="75" y="128" font-size="17" font-family="Consolas,monospace"><tspan fill="#4338ca">class</tspan><tspan fill="#1e1b4b"> LeaveState(TypedDict):</tspan></text>
      <text x="75" y="158" font-size="17" font-family="Consolas,monospace"><tspan fill="#475569">    request_id: str</tspan><tspan fill="#94a3b8">      # in at the start</tspan></text>
      <text x="75" y="188" font-size="17" font-family="Consolas,monospace"><tspan fill="#475569">    days: int</tspan><tspan fill="#94a3b8">            # written by summarise</tspan></text>
      <text x="75" y="218" font-size="17" font-family="Consolas,monospace"><tspan fill="#475569">    covered: bool</tspan><tspan fill="#94a3b8">        # written by check</tspan></text>
      <text x="75" y="248" font-size="17" font-family="Consolas,monospace"><tspan fill="#475569">    decision: str</tspan><tspan fill="#94a3b8">        # written by draft</tspan></text>
      <text x="335" y="296" text-anchor="middle" class="bds">At runtime it is a plain dict.</text>
      <text x="335" y="322" text-anchor="middle" class="bds">There is no new object type to learn.</text>

      <rect x="665" y="45" width="470" height="88" rx="6" fill="#f8f8fd" stroke="#c7d2fe" stroke-width="2"/>
      <text x="700" y="80" class="bxs">Printable</text>
      <text x="700" y="108" class="bds">you can look at what the agent knows</text>

      <rect x="665" y="151" width="470" height="88" rx="6" fill="#f8f8fd" stroke="#c7d2fe" stroke-width="2"/>
      <text x="700" y="186" class="bxs">Assertable</text>
      <text x="700" y="214" class="bds">a workflow test needs no model in it</text>

      <rect x="665" y="257" width="470" height="88" rx="6" fill="#f8f8fd" stroke="#c7d2fe" stroke-width="2"/>
      <text x="700" y="292" class="bxs">Storable</text>
      <text x="700" y="320" class="bds">which is what makes resume and audit possible</text>
    </svg>
  </div>
  <div class="take"><b>Declaring the state is the whole move.</b> Checkpoints, approval gates and the audit trail are all consequences of it.</div>
</div>

<div class="slide" data-sec="The three parts" data-notes="Part two. The partial-state rule is the single most common first mistake and it is worth a beat. Returning the whole state WORKS in a chain -- which is why nobody notices -- and then two nodes run in the same step and one writes back a stale copy of what the other just changed. Lab 3.1 makes them choose between the two return values, and Lab 3.4 shows the failure.">
  <h2>Nodes &mdash; state in, <i>partial</i> state out</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="A node function returning only the keys it changed">
      <rect x="45" y="50" width="1090" height="130" rx="8" fill="#fff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="75" y="86" font-size="17" font-family="Consolas,monospace"><tspan fill="#4338ca">def</tspan><tspan fill="#1e1b4b"> check(state: LeaveState) -&gt; dict:</tspan></text>
      <text x="75" y="114" font-size="17" font-family="Consolas,monospace"><tspan fill="#475569">    return {"covered": state["balance"] &gt;= state["days"],</tspan></text>
      <text x="75" y="142" font-size="17" font-family="Consolas,monospace"><tspan fill="#475569">            "needs_manager": state["days"] &gt; 2}</tspan></text>
      <text x="75" y="168" font-size="16" font-family="Consolas,monospace"><tspan fill="#0d9488">    # only the two keys it changed. LangGraph merges the rest.</tspan></text>

      <rect x="45" y="210" width="530" height="150" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
      <text x="310" y="246" text-anchor="middle" class="bxs ok">Return only what you changed</text>
      <text x="310" y="280" text-anchor="middle" class="bds">LangGraph merges it into the state</text>
      <text x="310" y="308" text-anchor="middle" class="bds">Untouched fields survive on their own</text>
      <text x="310" y="340" text-anchor="middle" class="bds ok">Two nodes can safely run at once</text>

      <rect x="605" y="210" width="530" height="150" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="870" y="246" text-anchor="middle" class="bxs no">Return the whole state</text>
      <text x="870" y="280" text-anchor="middle" class="bds">Works fine &mdash; in a straight chain</text>
      <text x="870" y="308" text-anchor="middle" class="bds">Then two nodes run in the same step</text>
      <text x="870" y="340" text-anchor="middle" class="bds no">and one writes back a stale copy</text>
    </svg>
  </div>
  <div class="take"><b>A node is a plain function.</b> No base class, no decorator &mdash; which is why you can unit-test one without a graph at all.</div>
</div>

<div class="slide" data-sec="The three parts" data-notes="Part three. Two things to land. First, START and END are ordinary edge endpoints, not settings -- people look for set_entry_point. Second, and this is the design point: the edges are what guarantee a field exists when a later node reads it. Swap two and you get KeyError on the first run, which is enormously better than a confident answer built on a field nobody set.">
  <h2>Edges &mdash; what runs next</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="A three-node chain from START to END and the dependency it enforces">
      <circle cx="80" cy="120" r="24" fill="#1e1b4b"/><text x="80" y="126" text-anchor="middle" font-size="13" fill="#fff">START</text>
      <line x1="104" y1="120" x2="156" y2="120" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>

      <rect x="163" y="90" width="205" height="60" rx="6" fill="#4338ca"/>
      <text x="265" y="115" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">summarise</text>
      <text x="265" y="136" text-anchor="middle" font-size="14" fill="#c7d2fe">writes days, balance</text>
      <line x1="368" y1="120" x2="420" y2="120" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>

      <rect x="427" y="90" width="205" height="60" rx="6" fill="#4338ca"/>
      <text x="529" y="115" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">check</text>
      <text x="529" y="136" text-anchor="middle" font-size="14" fill="#c7d2fe">writes covered</text>
      <line x1="632" y1="120" x2="684" y2="120" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>

      <rect x="691" y="90" width="205" height="60" rx="6" fill="#4338ca"/>
      <text x="793" y="115" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">draft</text>
      <text x="793" y="136" text-anchor="middle" font-size="14" fill="#c7d2fe">reads covered</text>
      <line x1="896" y1="120" x2="948" y2="120" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>
      <circle cx="972" cy="120" r="24" fill="#1e1b4b"/><text x="972" y="126" text-anchor="middle" font-size="15" fill="#fff">END</text>

      <path d="M529 156 Q529 196 660 196 Q793 196 793 158" fill="none" stroke="#0d9488" stroke-width="2.5" marker-end="url(#at)"/>
      <text x="660" y="218" text-anchor="middle" class="bds ok">covered is created here, and read here</text>

      <rect x="45" y="248" width="1090" height="110" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
      <text x="590" y="284" text-anchor="middle" class="bxs am">The edges are not decoration &mdash; they are the dependency order</text>
      <text x="590" y="316" text-anchor="middle" class="bd">Wire draft before check and you get <tspan font-family="Consolas,monospace">KeyError: 'covered'</tspan> on the first run</text>

    </svg>
  </div>
  <div class="take"><b><code>START</code> and <code>END</code> are edges</b>, not settings. A graph is a set of edges and two of them touch the ends.</div>
</div>

<div class="slide" data-sec="The three parts" data-notes="Only now the API, after three slides of concept. Six calls, and they have already met every idea behind them. Emphasise the last line of the panel: nothing here needs an endpoint, so in Lab 3.1 through 3.4 every self-check builds and runs a real compiled graph with no model in it. Leave them with that: put the model in one node and the control flow around it stays code you can unit-test.">

      <text x="75" y="146" font-size="17" font-family="Consolas,monospace"><tspan fill="#818cf8">builder</tspan><tspan fill="#e2e8f0">.</tspan><tspan fill="#fbbf24">add_edge</tspan><tspan fill="#e2e8f0">(START, "check")</tspan></text>

      <text x="75" y="296" font-size="16" font-family="Consolas,monospace"><tspan fill="#94a3b8"># that is the entire surface used in all eight labs</tspan></text>
      <text x="75" y="330" font-size="16" font-family="Consolas,monospace"><tspan fill="#5eead4"># none of it needs a model or a network</tspan></text>

      <rect x="785" y="40" width="350" height="150" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
      <text x="960" y="80" text-anchor="middle" class="bxs ok">Building is free</text>
      <text x="960" y="114" text-anchor="middle" class="bds">nodes, edges, reducers, a compiled</text>
      <text x="960" y="138" text-anchor="middle" class="bds">graph &mdash; no endpoint involved</text>
      <text x="960" y="170" text-anchor="middle" class="bds ok">so your tests never flake</text>

      <text x="960" y="255" text-anchor="middle" class="bxs am">Only invoking costs</text>
      <text x="960" y="289" text-anchor="middle" class="bds">and only in the nodes that</text>
      <text x="960" y="313" text-anchor="middle" class="bds">actually call the model</text>
      <text x="960" y="345" text-anchor="middle" class="bds am">usually one of them</text>
    </svg>
  </div>
  <div class="take"><b>Put the model in one node.</b> Everything around it stays ordinary software you can unit-test.</div>
</div>
<div class="slide div" data-sec="Choosing at runtime" data-notes="Divider. Everything so far ran the same way every time. Now the state decides.">
  <div class="k">Section 3</div>
  <h1>Choosing at runtime</h1>
</div>

<div class="slide div" data-sec="Merging" data-notes="Divider. The piece people skip and then debug for a day.">

  <h1>When two nodes write the same key</h1>
</div>

<div class="slide div" data-sec="Persistence" data-notes="Divider. The part that turns a demo into something operable, and the part a regulated organisation cares about most.">
  <div class="k">Section 5</div>
  <h1>Checkpoints, and stopping for a person</h1>
</div>

<div class="slide" data-sec="Persistence" data-notes="One keyword argument, four capabilities. Stress the fourth: nobody adds logging calls, the history exists because the state is explicit and the checkpointer saved it after every node. And it beats asking the model -- an agent asked to explain itself produces a plausible reconstruction, while the trail is what was actually true at each step, recorded before anyone knew the outcome would matter. Then the bottom strip: only the constructor changes in production.">
  <h2>One argument, four things you get</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="The four capabilities a checkpointer provides">
      <rect x="45" y="36" width="1090" height="56" rx="6" fill="#1e1b4b"/>
      <text x="75" y="72" font-size="18" font-family="Consolas,monospace"><tspan fill="#e2e8f0">app = builder.compile(</tspan><tspan fill="#fbbf24">checkpointer=InMemorySaver()</tspan><tspan fill="#e2e8f0">)</tspan></text>

      <rect x="45" y="112" width="262" height="120" rx="8" fill="#f8f8fd" stroke="#c7d2fe" stroke-width="2"/>

<div class="slide" data-sec="Persistence" data-notes="Walk the sequence top to bottom; it is exactly Lab 3.7. Two things to say out loud. First, resuming passes None -- that means carry on rather than start again, and passing the original input instead re-runs the earlier nodes. Second, the amber box, which surprises everyone: interrupt_before is a property of the COMPILED GRAPH, not of a run, so replaying from an older checkpoint runs forward into the same gate and stops there again. If you want a rewind that keeps an approval, the approval has to be a fact in the state the gate reads.">

  <div class="qtag">Answer 1 of 8</div>
  <h2>What does a node return?</h2>
  <div class="body"><div class="qbox">
    <div class="qstem">A LangGraph node receives the whole state. What should it return?</div>
    <div class="opt miss"><span class="k">A</span><span>The whole state, with its changes applied</span></div>
    <div class="opt hit"><span class="k">B</span><span>Only the keys it changed</span></div>
    <div class="opt miss"><span class="k">C</span><span>Nothing &mdash; it mutates the state in place</span></div>
    <div class="opt miss"><span class="k">D</span><span>The name of the next node to run</span></div>
    <div class="why"><b>Why:</b> LangGraph merges a partial return into the state for you. Returning the whole state works in a straight chain, which is why nobody notices &mdash; and then two nodes run in the same step and one writes back a stale copy of what the other just changed. D is a routing function, not a node.</div>
  </div></div>
</div>

    <div class="opt miss"><span class="k">A</span><span>A boolean</span></div>

    <div class="opt hit"><span class="k">C</span><span>The node that emails and debits</span></div>

    <div class="why"><b>Why:</b> Gate the step with a consequence outside your process. Gate earlier and the approver is looking at nothing yet; gate everything and people stop reading the queue. B is the tempting one &mdash; it feels like approving the <i>decision</i>, but nothing has happened yet, so there is nothing to approve.</div>
  </div></div>
</div>

<div class="slide q" data-sec="Knowledge check" data-notes="Answer B. This surprises everyone once. Right behaviour for approvals, wrong thing to discover in production.">

<div class="slide q" data-sec="Knowledge check" data-notes="Answer B. This surprises everyone once. Right behaviour for approvals, wrong thing to discover in production.">

  <h2>Rewinding past an approval</h2>
  <div class="body"><div class="qbox">
    <div class="qstem">You approve a gated run, it completes, then you rewind to a checkpoint before the gate and run forward. What happens?</div>
    <div class="opt miss"><span class="k">A</span><span>It runs through to the end &mdash; it was already approved</span></div>
    <div class="opt hit"><span class="k">B</span><span>It pauses at the gate again</span></div>
    <div class="opt miss"><span class="k">C</span><span>It raises, because the run is finished</span></div>
    <div class="opt miss"><span class="k">D</span><span>It skips the gate and re-sends the notification</span></div>
    <div class="why"><b>Why:</b> <code>interrupt_before</code> is a property of the compiled graph, not of a run. Replaying meets the same gate. The approval was a state edit at one point in history, so rewinding past it un-does it. For a rewind that keeps an approval, the gate has to read a <i>fact in the state</i>.</div>
  </div></div>
</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  stage.appendChild(document.getElementById('deck').content.cloneNode(true));
  var slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));
  var i = 0, total = slides.length;

  var num = document.getElementById('num'),
      progf = document.getElementById('progf'),
      secname = document.getElementById('secname'),
      toc = document.getElementById('toc'),
      toclist = document.getElementById('toclist'),
      notes = document.getElementById('notes'),
      notesbody = document.getElementById('notesbody');

  /* ---- build the index, grouped by section ---- */
  var groups = [], last = null;
  slides.forEach(function(s, n){
    var sec = s.getAttribute('data-sec') || '';
    if (sec !== last) { groups.push({sec: sec, items: []}); last = sec; }
    var h = s.querySelector('h2, h1'), q = s.querySelector('.qtag');
    var t = h ? h.textContent.trim() : sec;
    if (q) t = q.textContent.trim() + ' \u2014 ' + t;
    groups[groups.length-1].items.push({n: n, t: t});
  });
  groups.forEach(function(g){
    var d = document.createElement('div'); d.className = 'grp';
    var hd = document.createElement('div'); hd.className = 'grph'; hd.textContent = g.sec; d.appendChild(hd);
    g.items.forEach(function(it){
      var a = document.createElement('a');
      a.href = '#'; a.dataset.n = it.n;
      a.innerHTML = '<span class="n">' + (it.n + 1) + '</span>';
      a.appendChild(document.createTextNode(it.t));
      a.addEventListener('click', function(e){ e.preventDefault(); go(it.n); toc.classList.remove('on'); });
      d.appendChild(a);
    });
    toclist.appendChild(d);
  });
  var tocLinks = Array.prototype.slice.call(toclist.querySelectorAll('a'));

  function go(n){
    if (n < 0) n = 0;
    if (n > total - 1) n = total - 1;
    slides[i].classList.remove('active');
    i = n;
    slides[i].classList.add('active');
    num.textContent = (i + 1) + ' / ' + total;
    progf.style.width = ((i + 1) / total * 100) + '%';
    secname.textContent = slides[i].getAttribute('data-sec') || '';
    notesbody.textContent = slides[i].getAttribute('data-notes') || 'No notes for this slide.';
    tocLinks.forEach(function(a){ a.classList.toggle('cur', +a.dataset.n === i); });
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  /* ---- scale the 1280x720 stage to the available space ---- */
  function fit(){
    var w = document.getElementById('wrap');
    var s = Math.min(w.clientWidth / 1280, w.clientHeight / 720);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){
    var n = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(n) && n - 1 !== i) go(n - 1);
  });

  document.getElementById('bnext').addEventListener('click', function(){ go(i + 1); });
  document.getElementById('bprev').addEventListener('click', function(){ go(i - 1); });
  document.getElementById('btoc').addEventListener('click', function(){ toc.classList.toggle('on'); });
  document.getElementById('bnotes').addEventListener('click', function(){ notes.classList.toggle('on'); });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(i - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(total - 1); }
    else if (k === 't' || k === 'T') { toc.classList.toggle('on'); }
    else if (k === 'n' || k === 'N') { notes.classList.toggle('on'); }
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if (k === 'Escape') { toc.classList.remove('on'); notes.classList.remove('on'); }
  });

  fit();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(isNaN(start) ? 0 : start - 1);
})();
</script>
</body>
</html>
