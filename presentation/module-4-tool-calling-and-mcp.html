<div class="slide div" data-sec="Tools" data-notes="Part one is deliberately unglamorous: what a tool actually is, and why most tool-calling failures are authoring failures rather than model failures.">
  <div class="k">Part one</div>
  <h1>Tools: the contract, not the code</h1>
</div>

<div class="slide" data-sec="Tools" data-notes="This is the slide to slow down on. Participants who have written tools before almost always over-invest in the function body and under-invest in the description and the schema. The model never sees the body. It sees a name, a sentence and a shape -- and it decides on those alone.">
  <h2>What the model actually sees</h2>
  <div class="body">
    <svg width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-label="What a tool author writes versus what the model receives">
      <text x="290" y="42" text-anchor="middle" class="lbl">What you write</text>
      <rect x="60" y="58" width="460" height="290" rx="8" fill="#f8f8fd" stroke="#cbd5e1" stroke-width="2"/>
      <text x="86" y="92" class="bxs">def lookup_payment(ref: str) -&gt; str:</text>
      <text x="102" y="122" class="bd">"""Return the ledger record for one</text>
      <text x="102" y="146" class="bd">payment reference such as 'PMT-1002'.</text>
      <text x="102" y="176" class="bd">Use when you need status, amount or</text>
      <text x="102" y="200" class="bd">reason code. Not for searching."""</text>
      <text x="102" y="238" class="bds">record = LEDGER.get(ref)</text>
      <text x="102" y="262" class="bds">if record is None:</text>
      <text x="102" y="286" class="bds">    return f"no payment {ref!r}"</text>
      <text x="102" y="310" class="bds">return json.dumps(record)</text>

      <path d="M530 200 L648 200" stroke="#4338ca" stroke-width="3" marker-end="url(#ai)"/>
      <text x="589" y="186" text-anchor="middle" class="bds">serialised</text>

      <text x="895" y="42" text-anchor="middle" class="lbl">What the model receives</text>
      <rect x="660" y="58" width="460" height="290" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="686" y="94" class="bxs">name</text>
      <text x="800" y="94" class="bd">lookup_payment</text>
      <text x="686" y="132" class="bxs">description</text>
      <text x="800" y="132" class="bd">the docstring, verbatim</text>
      <text x="686" y="170" class="bxs">parameters</text>
      <text x="800" y="170" class="bd">{ref: string, required}</text>
      <line x1="686" y1="196" x2="1094" y2="196" stroke="#c7d2fe" stroke-width="1.5"/>
      <text x="686" y="232" class="bxs no">the body</text>
      <text x="800" y="232" class="bd no">never sent</text>
      <text x="686" y="270" class="bxs no">your tests</text>
      <text x="800" y="270" class="bd no">never sent</text>
      <text x="686" y="308" class="bxs no">your types</text>
      <text x="800" y="308" class="bd no">only as a shape</text>

      <rect x="230" y="366" width="720" height="52" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="398" text-anchor="middle" class="bxs am">Three fields decide every call. Two of them are prose you wrote in a hurry.</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Tools" data-notes="Name the four failure modes explicitly -- participants will hit all four in Lab 4.2 and 4.3, and having names for them makes the lab debuggable. The fourth is the one nobody instruments: the call succeeded, the model misread the result. Module 3's perception work is the fix for that one.">
  <h2>Four ways a tool call goes wrong &mdash; only one is the model's fault</h2>
  <div class="body">
    <svg width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-label="Four tool-calling failure modes and their causes">
      <rect x="50" y="56" width="255" height="230" rx="8" fill="#f8f8fd" stroke="#cbd5e1" stroke-width="2"/>
      <text x="177" y="88" text-anchor="middle" class="lbl">Failure 1</text>
      <text x="177" y="122" text-anchor="middle" class="bxs">Never called</text>
      <text x="177" y="156" text-anchor="middle" class="bds">the model answered</text>
      <text x="177" y="178" text-anchor="middle" class="bds">from memory instead</text>
      <text x="177" y="222" text-anchor="middle" class="bd am">Cause: description</text>
      <text x="177" y="246" text-anchor="middle" class="bds">never said <tspan font-style="italic">when</tspan> to use it</text>

      <rect x="325" y="56" width="255" height="230" rx="8" fill="#f8f8fd" stroke="#cbd5e1" stroke-width="2"/>
      <text x="452" y="88" text-anchor="middle" class="lbl">Failure 2</text>
      <text x="452" y="122" text-anchor="middle" class="bxs">Wrong tool</text>
      <text x="452" y="156" text-anchor="middle" class="bds">two descriptions</text>
      <text x="452" y="178" text-anchor="middle" class="bds">overlap</text>
      <text x="452" y="222" text-anchor="middle" class="bd am">Cause: no boundary</text>
      <text x="452" y="246" text-anchor="middle" class="bds">&ldquo;not for &hellip;&rdquo; was missing</text>

      <rect x="600" y="56" width="255" height="230" rx="8" fill="#f8f8fd" stroke="#cbd5e1" stroke-width="2"/>
      <text x="727" y="88" text-anchor="middle" class="lbl">Failure 3</text>
      <text x="727" y="122" text-anchor="middle" class="bxs">Wrong arguments</text>
      <text x="727" y="156" text-anchor="middle" class="bds">right tool, malformed</text>
      <text x="727" y="178" text-anchor="middle" class="bds">or invented value</text>
      <text x="727" y="222" text-anchor="middle" class="bd am">Cause: schema</text>
      <text x="727" y="246" text-anchor="middle" class="bds">no format, no example</text>

      <rect x="875" y="56" width="255" height="230" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="1002" y="88" text-anchor="middle" class="lbl">Failure 4</text>
      <text x="1002" y="122" text-anchor="middle" class="bxs no">Result misread</text>
      <text x="1002" y="156" text-anchor="middle" class="bds">the call succeeded and</text>
      <text x="1002" y="178" text-anchor="middle" class="bds">the conclusion is wrong</text>
      <text x="1002" y="222" text-anchor="middle" class="bd am">Cause: return value</text>
      <text x="1002" y="246" text-anchor="middle" class="bds">raw, ambiguous, unlabelled</text>

      <text x="590" y="330" text-anchor="middle" class="bd">Every logged metric catches failures 1&ndash;3. Nothing catches failure 4 &mdash; it looks like success.</text>

      <rect x="230" y="352" width="720" height="60" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="380" text-anchor="middle" class="bxs am">All four are fixed by editing text, not by changing model</text>
      <text x="590" y="404" text-anchor="middle" class="bds">which is why Lab 4.2 measures accuracy against description quality alone</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Tools" data-notes="This is the module's headline claim and Lab 4.2 is where they prove it on their own eval set. Do not assert the numbers as universal -- the shape is what transfers. Point out that the third column costs one extra sentence per tool and no tokens at inference beyond that sentence.">
  <h2>A tool description is a specification, not a comment</h2>
  <div class="body">
    <svg width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-label="Three qualities of tool description and their effect on selection accuracy">
      <rect x="50" y="52" width="340" height="250" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
      <text x="220" y="84" text-anchor="middle" class="lbl">Level 0 &mdash; a label</text>
      <text x="220" y="120" text-anchor="middle" class="bxs">&ldquo;Gets a payment.&rdquo;</text>
      <text x="220" y="164" text-anchor="middle" class="bd">The model must guess when</text>
      <text x="220" y="188" text-anchor="middle" class="bd">it applies and what a</text>
      <text x="220" y="212" text-anchor="middle" class="bd">reference looks like</text>
      <text x="220" y="262" text-anchor="middle" class="num no">low</text>
      <text x="220" y="286" text-anchor="middle" class="bds">selection accuracy</text>

      <rect x="420" y="52" width="340" height="250" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="590" y="84" text-anchor="middle" class="lbl">Level 1 &mdash; what it does</text>
      <text x="590" y="120" text-anchor="middle" class="bxs">&ldquo;Return the ledger record</text>
      <text x="590" y="144" text-anchor="middle" class="bxs">for a reference like PMT-1002.&rdquo;</text>
      <text x="590" y="188" text-anchor="middle" class="bd">Now it knows the shape</text>
      <text x="590" y="212" text-anchor="middle" class="bd">of a valid argument</text>
      <text x="590" y="262" text-anchor="middle" class="num">better</text>
      <text x="590" y="286" text-anchor="middle" class="bds">fixes failure 3</text>

      <rect x="790" y="52" width="340" height="250" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="960" y="84" text-anchor="middle" class="lbl">Level 2 &mdash; when, and when not</text>
      <text x="960" y="120" text-anchor="middle" class="bxs">&hellip; &ldquo;Use when you need the</text>
      <text x="960" y="144" text-anchor="middle" class="bxs">status of one payment.</text>
      <text x="960" y="168" text-anchor="middle" class="bxs ok">Not for searching.&rdquo;</text>
      <text x="960" y="212" text-anchor="middle" class="bd">The boundary is the sentence</text>
      <text x="960" y="236" text-anchor="middle" class="bd">that stops the wrong call</text>
      <text x="960" y="278" text-anchor="middle" class="num ok">best</text>

      <rect x="230" y="330" width="720" height="84" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="360" text-anchor="middle" class="bxs am">Write the description for a competent new joiner with no context</text>
      <text x="590" y="386" text-anchor="middle" class="bds">what it returns &middot; when to reach for it &middot; when <tspan font-style="italic">not</tspan> to &middot; what a valid argument looks like</text>
      <text x="590" y="406" text-anchor="middle" class="bds">Lab 4.2 holds the model fixed and moves only this text</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Tools" data-notes="Errors are the most-skipped part of tool authoring and the highest-yield. An exception ends the agent's turn; a returned error keeps the loop alive and tells it what to do next. Read the right-hand column aloud -- it is a template participants can copy into their own tools this afternoon.">
  <h2>What a tool must return when it fails</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="Raising an exception versus returning a structured failure">
      <rect x="50" y="52" width="500" height="290" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
      <text x="300" y="84" text-anchor="middle" class="lbl">Raising</text>
      <text x="300" y="120" text-anchor="middle" class="bxs no">raise KeyError(ref)</text>
      <text x="76" y="164" class="bd">&bull; the agent loop stops mid-turn</text>
      <text x="76" y="198" class="bd">&bull; the model never learns what happened</text>
      <text x="76" y="232" class="bd">&bull; nothing distinguishes &ldquo;bad input&rdquo;</text>
      <text x="90" y="256" class="bd">from &ldquo;service down&rdquo;</text>
      <text x="76" y="290" class="bd">&bull; a retry repeats the same mistake</text>
      <text x="300" y="324" text-anchor="middle" class="bds no">the failure escapes the agent's reasoning</text>

      <rect x="630" y="52" width="500" height="290" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="880" y="84" text-anchor="middle" class="lbl">Returning</text>
      <text x="880" y="120" text-anchor="middle" class="bxs ok">a result the model can act on</text>
      <text x="656" y="160" class="bd"><tspan class="bxs">ok</tspan>&nbsp; false</text>
      <text x="656" y="194" class="bd"><tspan class="bxs">error</tspan>&nbsp; not_found | invalid_input |</text>
      <text x="736" y="216" class="bd">unavailable | not_permitted</text>
      <text x="656" y="250" class="bd"><tspan class="bxs">message</tspan>&nbsp; one plain sentence</text>
      <text x="656" y="284" class="bd"><tspan class="bxs">retryable</tspan>&nbsp; true / false</text>
      <text x="880" y="324" text-anchor="middle" class="bds ok">the model can retry, switch tool, or stop and say why</text>

      <rect x="230" y="358" width="720" height="52" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="390" text-anchor="middle" class="bxs am">&ldquo;retryable&rdquo; is the field that ends Module 2's blind-retry loop</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Tools" data-notes="Move from one tool to many. The point of this slide is that adding tools is not free: selection difficulty rises faster than capability, and every tool's description competes with every other. Fifty tools in one prompt is a known failure shape -- that is one of the arguments for MCP servers scoped by domain, and for the routing you will build in Module 5.">
  <h2>The cost of the tenth tool</h2>

<div class="slide div" data-sec="MCP" data-notes="Part two. Everything so far assumed you wrote the tool. Now the tools belong to someone else, live in another process, and are discovered at runtime.">
  <div class="k">Part two</div>
  <h1>MCP: a protocol instead of an integration</h1>
</div>

<div class="slide" data-sec="MCP" data-notes="The architecture in one picture. Stress the process boundary: the server is a separate program with its own identity, its own permissions and its own audit log. That boundary is what makes MCP a governance story as much as an integration story -- which is why Module 8 returns to it.">

<div class="slide" data-sec="MCP" data-notes="Three primitives, and the distinction that matters is who decides. Tools are model-controlled, resources are application-controlled, prompts are user-controlled. Most teams collapse everything into tools and then wonder why the agent keeps calling a data fetch it should never have chosen.">
  <h2>Three primitives &mdash; and who decides to use each</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="MCP tools, resources and prompts and who controls each">
      <rect x="50" y="56" width="345" height="256" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="222" y="88" text-anchor="middle" class="lbl">Tools</text>
      <text x="222" y="124" text-anchor="middle" class="bx">the model decides</text>
      <text x="222" y="162" text-anchor="middle" class="bd">something happens when called</text>
      <text x="222" y="192" text-anchor="middle" class="bds">release_payment, open_ticket</text>
      <text x="222" y="230" text-anchor="middle" class="bd am">may have side effects</text>
      <text x="222" y="266" text-anchor="middle" class="bds">this is the one that needs</text>
      <text x="222" y="288" text-anchor="middle" class="bds">scopes and approval gates</text>

      <rect x="418" y="56" width="345" height="256" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="590" y="88" text-anchor="middle" class="lbl">Resources</text>
      <text x="590" y="124" text-anchor="middle" class="bx">the application decides</text>
      <text x="590" y="162" text-anchor="middle" class="bd">addressable, read-only context</text>
      <text x="590" y="192" text-anchor="middle" class="bds">policy://limits, runbook://sanctions</text>
      <text x="590" y="230" text-anchor="middle" class="bd">no side effects, by contract</text>
      <text x="590" y="266" text-anchor="middle" class="bds">you attach it deliberately &mdash;</text>
      <text x="590" y="288" text-anchor="middle" class="bds">the model cannot go fishing</text>

      <rect x="786" y="56" width="345" height="256" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="958" y="88" text-anchor="middle" class="lbl">Prompts</text>
      <text x="958" y="124" text-anchor="middle" class="bx">the user decides</text>
      <text x="958" y="162" text-anchor="middle" class="bd">named, parameterised workflows</text>
      <text x="958" y="192" text-anchor="middle" class="bds">&ldquo;investigate this exception&rdquo;</text>
      <text x="958" y="230" text-anchor="middle" class="bd">the server ships its own</text>
      <text x="958" y="252" text-anchor="middle" class="bd">best-practice usage</text>
      <text x="958" y="288" text-anchor="middle" class="bds">the least used, and underrated</text>

      <rect x="230" y="348" width="720" height="60" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="376" text-anchor="middle" class="bxs am">If everything is a tool, every read is a decision the model can get wrong</text>
      <text x="590" y="400" text-anchor="middle" class="bds">choosing the primitive is a design act, not bookkeeping</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="MCP" data-notes="Walk the lifecycle left to right -- this is exactly the sequence they implement by hand in Lab 4.4, framing and all. The key insight is discovery: the agent does not know the tools at build time. It asks. That is what makes a server upgradeable without redeploying the agent, and also what makes a compromised server dangerous.">

<div class="slide" data-sec="MCP" data-notes="Transport is the question the platform team asks first. stdio is the default and the most secure -- no port, no network, lifetime tied to the process. Remote HTTP is what you need for a shared enterprise server, and it is where authentication and multi-tenancy suddenly become your problem.">
  <h2>Two transports, two different security conversations</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="stdio transport compared with streamable HTTP transport">
      <rect x="50" y="52" width="500" height="292" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="300" y="84" text-anchor="middle" class="lbl">stdio</text>
      <text x="300" y="120" text-anchor="middle" class="bx">a child process on the same host</text>
      <text x="76" y="164" class="bd">&bull; the host launches it; lifetime is tied to yours</text>
      <text x="76" y="198" class="bd">&bull; no port, no listener, nothing to firewall</text>
      <text x="76" y="232" class="bd">&bull; identity is the OS user you already are</text>
      <text x="76" y="266" class="bd">&bull; one server process per client session</text>
      <text x="300" y="310" text-anchor="middle" class="bds ok">the default &mdash; and what you configure in Lab 4.4</text>

      <rect x="630" y="52" width="500" height="292" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="880" y="84" text-anchor="middle" class="lbl">Streamable HTTP</text>
      <text x="880" y="120" text-anchor="middle" class="bx">a service someone else operates</text>
      <text x="656" y="164" class="bd">&bull; one server, many clients, many tenants</text>
      <text x="656" y="198" class="bd">&bull; you now own authentication and authorization</text>
      <text x="656" y="232" class="bd">&bull; server-sent events carry streamed results</text>
      <text x="656" y="266" class="bd am">&bull; origin checks and bound tokens are not optional</text>
      <text x="880" y="310" text-anchor="middle" class="bds">the enterprise shape &mdash; and Module 8's problem</text>

      <rect x="230" y="360" width="720" height="52" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="392" text-anchor="middle" class="bxs am">Same protocol, same tools. The transport decides who can reach them.</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="MCP" data-notes="Configuration is where most people meet MCP first, so show the shape and name the parts. The important line is the last one: the config file is the grant. Adding four lines of JSON gives an agent a new capability with no code review, which is exactly the governance gap Module 8 closes.">
  <h2>Client configuration is an access grant</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="Anatomy of an MCP client configuration entry">
      <rect x="120" y="46" width="700" height="248" rx="8" fill="#f8f8fd" stroke="#4338ca" stroke-width="2"/>
      <text x="146" y="80" class="bds">{ "mcpServers": {</text>
      <text x="176" y="112" class="bxs">"ledger"</text>

  <h2>When MCP earns its complexity &mdash; and when it does not</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="When to prefer plain functions versus an MCP server">
      <rect x="50" y="52" width="500" height="292" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="300" y="84" text-anchor="middle" class="lbl">Plain functions are enough</text>
      <text x="76" y="128" class="bd">&bull; you own the tool and the agent</text>
      <text x="76" y="164" class="bd">&bull; they ship together, version together</text>
      <text x="76" y="200" class="bd">&bull; a handful of tools, one team</text>
      <text x="76" y="236" class="bd">&bull; no separate identity or scope needed</text>
      <text x="76" y="272" class="bd">&bull; nobody else will ever call them</text>
      <text x="300" y="318" text-anchor="middle" class="bds">a protocol here is cost without benefit</text>

      <text x="880" y="84" text-anchor="middle" class="lbl">MCP pays for itself</text>
      <text x="656" y="128" class="bd">&bull; another team owns the system</text>
      <text x="656" y="164" class="bd">&bull; several agents need the same access</text>
      <text x="656" y="200" class="bd">&bull; the tool needs its own credentials</text>
      <text x="656" y="236" class="bd">&bull; you must grant, revoke and audit it</text>
      <text x="656" y="272" class="bd">&bull; it should upgrade without your release</text>
      <text x="880" y="318" text-anchor="middle" class="bds ok">the boundary was already there &mdash; now it is explicit</text>

      <rect x="230" y="360" width="720" height="52" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="392" text-anchor="middle" class="bxs am">Adopt MCP where an ownership boundary exists, not where you wish one did</text>
    </svg>
  </div>
</div>

    <div class="opt miss"><span class="k">D</span><span><code>{ok: false, error: "not_found"}</code> &mdash; there is no answer either way</span></div>
    <div class="why"><b>Why:</b> D is the dangerous one: &ldquo;I could not look&rdquo; reported as &ldquo;it is not there&rdquo; makes the agent confidently wrong, and it is exactly Module 3's four-kinds-of-nothing failure. A ends the turn; C invites a hallucinated answer. Only B lets the agent decide between retrying, switching tool, and stopping.</div>
  </div></div>
</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  stage.appendChild(document.getElementById('deck').content.cloneNode(true));
  var slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));
  var i = 0, total = slides.length;

  var num = document.getElementById('num'),
      progf = document.getElementById('progf'),
      secname = document.getElementById('secname'),
      toc = document.getElementById('toc'),
      toclist = document.getElementById('toclist'),
      notes = document.getElementById('notes'),
      notesbody = document.getElementById('notesbody');

  /* ---- build the index, grouped by section ---- */
  var groups = [], last = null;
  slides.forEach(function(s, n){
    var sec = s.getAttribute('data-sec') || '';
    if (sec !== last) { groups.push({sec: sec, items: []}); last = sec; }
    var h = s.querySelector('h2, h1'), q = s.querySelector('.qtag');
    var t = h ? h.textContent.trim() : sec;
    if (q) t = q.textContent.trim() + ' \u2014 ' + t;
    groups[groups.length-1].items.push({n: n, t: t});
  });
  groups.forEach(function(g){
    var d = document.createElement('div'); d.className = 'grp';
    var hd = document.createElement('div'); hd.className = 'grph'; hd.textContent = g.sec; d.appendChild(hd);
    g.items.forEach(function(it){
      var a = document.createElement('a');
      a.href = '#'; a.dataset.n = it.n;
      a.innerHTML = '<span class="n">' + (it.n + 1) + '</span>';
      a.appendChild(document.createTextNode(it.t));
      a.addEventListener('click', function(e){ e.preventDefault(); go(it.n); toc.classList.remove('on'); });
      d.appendChild(a);
    });
    toclist.appendChild(d);
  });
  var tocLinks = Array.prototype.slice.call(toclist.querySelectorAll('a'));

  function go(n){
    if (n < 0) n = 0;
    if (n > total - 1) n = total - 1;
    slides[i].classList.remove('active');
    i = n;
    slides[i].classList.add('active');
    num.textContent = (i + 1) + ' / ' + total;
    progf.style.width = ((i + 1) / total * 100) + '%';
    secname.textContent = slides[i].getAttribute('data-sec') || '';
    notesbody.textContent = slides[i].getAttribute('data-notes') || 'No notes for this slide.';
    tocLinks.forEach(function(a){ a.classList.toggle('cur', +a.dataset.n === i); });
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  /* ---- scale the 1280x720 stage to the available space ---- */
  function fit(){
    var w = document.getElementById('wrap');
    var s = Math.min(w.clientWidth / 1280, w.clientHeight / 720);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){
    var n = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(n) && n - 1 !== i) go(n - 1);
  });

  document.getElementById('bnext').addEventListener('click', function(){ go(i + 1); });
  document.getElementById('bprev').addEventListener('click', function(){ go(i - 1); });
  document.getElementById('btoc').addEventListener('click', function(){ toc.classList.toggle('on'); });
  document.getElementById('bnotes').addEventListener('click', function(){ notes.classList.toggle('on'); });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(i - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(total - 1); }
    else if (k === 't' || k === 'T') { toc.classList.toggle('on'); }
    else if (k === 'n' || k === 'N') { notes.classList.toggle('on'); }
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if (k === 'Escape') { toc.classList.remove('on'); notes.classList.remove('on'); }
  });

  fit();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(isNaN(start) ? 0 : start - 1);
})();
</script>
