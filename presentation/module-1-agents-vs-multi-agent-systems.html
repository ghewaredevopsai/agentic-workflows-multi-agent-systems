<div class="slide div" data-sec="Why agents exist" data-notes="Two minutes. The point of this section is that every part of an agent is a patch over a specific limitation of the model. If you know the limitation, you know which part you actually need.">
  <div class="k">Part one</div>
  <h1>Why agents exist at all</h1>
</div>

<div class="slide" data-sec="Why agents exist" data-notes="Emphasise: the weights are frozen, the call is stateless, and nothing happens in the world. Every framework we touch this week is scaffolding around this one box. Ask the room what a bank cannot do with this box alone.">
  <h2>An LLM is a function, not a system</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="An LLM as a stateless function with four things it cannot do">
      <text x="120" y="66" text-anchor="middle" class="lbl">Text in</text>
      <rect x="40" y="82" width="160" height="70" rx="5" fill="#f8f8fd" stroke="#c7d2fe" stroke-width="2"/>
      <text x="120" y="124" text-anchor="middle" class="bd">prompt</text>
      <line x1="205" y1="117" x2="425" y2="117" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>
      <rect x="430" y="62" width="320" height="110" rx="7" fill="#4338ca"/>
      <text x="590" y="106" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">LLM</text>
      <text x="590" y="136" text-anchor="middle" font-size="15" fill="#c7d2fe">frozen weights &middot; one shot</text>
      <line x1="755" y1="117" x2="975" y2="117" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>
      <text x="1060" y="66" text-anchor="middle" class="lbl">Text out</text>
      <rect x="980" y="82" width="160" height="70" rx="5" fill="#f8f8fd" stroke="#c7d2fe" stroke-width="2"/>
      <text x="1060" y="124" text-anchor="middle" class="bd">completion</text>

      <text x="590" y="228" text-anchor="middle" class="lbl">Between two calls it has</text>
      <g>
        <rect x="60" y="252" width="250" height="92" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
        <text x="185" y="288" text-anchor="middle" class="bxs no">No memory</text>
        <text x="185" y="316" text-anchor="middle" class="bds">call two knows nothing</text>
        <text x="185" y="334" text-anchor="middle" class="bds">of call one</text>
      </g>
      <g>
        <rect x="335" y="252" width="250" height="92" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
        <text x="460" y="288" text-anchor="middle" class="bxs no">No actions</text>
        <text x="460" y="316" text-anchor="middle" class="bds">it can describe a payment,</text>
        <text x="460" y="334" text-anchor="middle" class="bds">not make one</text>
      </g>
      <g>
        <rect x="610" y="252" width="250" height="92" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
        <text x="735" y="288" text-anchor="middle" class="bxs no">No fresh knowledge</text>
        <text x="735" y="316" text-anchor="middle" class="bds">the world moved on</text>
        <text x="735" y="334" text-anchor="middle" class="bds">after training</text>
      </g>
      <g>
        <rect x="885" y="252" width="250" height="92" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
        <text x="1010" y="288" text-anchor="middle" class="bxs no">No way to check</text>
        <text x="1010" y="316" text-anchor="middle" class="bds">confident and wrong</text>
        <text x="1010" y="334" text-anchor="middle" class="bds">look identical</text>
      </g>
      <text x="590" y="382" text-anchor="middle" class="bd">Everything we build this week is scaffolding around these four gaps.</text>
    </svg>
  </div>
  <div class="take"><b>The frame:</b> an agent is not a smarter model. It is a model plus the machinery that closes these four gaps.</div>
</div>

<div class="slide" data-sec="Why agents exist" data-notes="This is the slide to return to whenever someone proposes a component. Ask: which gap does it close? If the answer is none, it is decoration. Memory closes state, tools close action and freshness, planning plus the loop close verification.">
  <h2>Each gap has exactly one answer</h2>

      <text x="250" y="110" text-anchor="middle" class="bx no">Stateless between calls</text>

      <text x="930" y="190" text-anchor="middle" class="bx">Tools &mdash; the actions</text>

      <text x="930" y="350" text-anchor="middle" class="bx am">The loop &mdash; act, observe, correct</text>

<div class="slide div" data-sec="The agent loop" data-notes="The heart of Day 1. Everything in Modules 2 and 3 is a refinement of what happens inside this loop.">
  <div class="k">Part two</div>
  <h1>What turns a call into an agent</h1>
</div>

<div class="slide" data-sec="The agent loop" data-notes="Say it plainly: the difference is not the model, the prompt or the framework. It is that the output of one call chooses the next call. Control flow moves from your code into the model &mdash; that is the whole trade, and the whole risk.">
  <h2>One call, or a loop</h2>
  <div class="body">
    <svg width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-label="A single LLM call compared with an agent loop">
      <text x="290" y="40" text-anchor="middle" class="lbl">Single call &mdash; you own the control flow</text>
      <rect x="70" y="64" width="120" height="56" rx="5" fill="#f8f8fd" stroke="#c7d2fe" stroke-width="2"/><text x="130" y="98" text-anchor="middle" class="bds">input</text>
      <line x1="195" y1="92" x2="245" y2="92" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
      <rect x="250" y="64" width="120" height="56" rx="5" fill="#4338ca"/><text x="310" y="98" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">LLM</text>
      <line x1="375" y1="92" x2="425" y2="92" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
      <rect x="430" y="64" width="120" height="56" rx="5" fill="#f8f8fd" stroke="#c7d2fe" stroke-width="2"/><text x="490" y="98" text-anchor="middle" class="bds">output</text>
      <text x="310" y="152" text-anchor="middle" class="bd">Steps fixed at design time. Cost and latency known.</text>
      <text x="310" y="174" text-anchor="middle" class="bd">Fails the same way every time &mdash; which is a virtue.</text>

      <line x1="620" y1="40" x2="620" y2="400" stroke="#e2e8f0" stroke-width="2"/>

      <text x="900" y="40" text-anchor="middle" class="lbl">Agent loop &mdash; the model owns the control flow</text>
      <circle cx="900" cy="200" r="128" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="4 6"/>
      <rect x="815" y="60" width="170" height="52" rx="5" fill="#4338ca"/><text x="900" y="92" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Decide next step</text>
      <rect x="1010" y="174" width="150" height="52" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="1085" y="206" text-anchor="middle" class="bxs">Act (tool)</text>
      <rect x="815" y="288" width="170" height="52" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="900" y="320" text-anchor="middle" class="bxs">Observe result</text>
      <rect x="640" y="174" width="150" height="52" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="715" y="206" text-anchor="middle" class="bxs">Update state</text>
      <path d="M985 92 Q1085 110 1085 168" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>
      <path d="M1085 232 Q1085 320 991 316" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>
      <path d="M815 316 Q715 320 715 232" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>
      <path d="M715 168 Q715 108 809 90" fill="none" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>
      <text x="900" y="196" text-anchor="middle" class="bds">repeat until</text>
      <text x="900" y="216" text-anchor="middle" class="bxs am">goal met or budget spent</text>

  </div>
  <div class="take"><b>The one-sentence definition:</b> an agent is an LLM whose output decides what happens next. Everything else is detail.</div>
</div>

<div class="slide" data-sec="The agent loop" data-notes="Two loops, often confused. The inner one costs tokens and is invisible to your systems; the outer one costs tokens AND touches the world, so it is the one that needs approval gates. Point forward to Module 8.">
  <h2>Two loops, and only one of them touches the world</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="Reasoning loop nested inside the action loop">
      <rect x="70" y="46" width="1040" height="330" rx="10" fill="#f8f8fd" stroke="#4338ca" stroke-width="2.5"/>
      <text x="100" y="78" class="lbl">Outer: action loop</text>
      <rect x="110" y="98" width="470" height="240" rx="8" fill="#fff" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="140" y="128" class="lbl">Inner: reasoning loop</text>
      <text x="345" y="176" text-anchor="middle" class="bx">Think &#8594; critique &#8594; re-think</text>
      <text x="345" y="212" text-anchor="middle" class="bd">Chain-of-Thought, Reflection, Tree-of-Thought</text>
      <text x="345" y="252" text-anchor="middle" class="bds">Costs: tokens and latency</text>
      <text x="345" y="278" text-anchor="middle" class="bds">Visible to: nobody outside the trace</text>
      <text x="345" y="312" text-anchor="middle" class="bxs ok">Safe to let run. Cap it anyway.</text>

      <line x1="590" y1="130" x2="590" y2="330" stroke="#e2e8f0" stroke-width="2"/>

      <text x="850" y="176" text-anchor="middle" class="bx">Call a tool &#8594; read the result</text>
      <text x="850" y="212" text-anchor="middle" class="bd">Queries, writes, payments, tickets, emails</text>
      <text x="850" y="252" text-anchor="middle" class="bds">Costs: tokens, latency and consequences</text>
      <text x="850" y="278" text-anchor="middle" class="bds">Visible to: your auditors</text>
      <text x="850" y="312" text-anchor="middle" class="bxs no">This is where approval gates belong.</text>
      <text x="590" y="404" text-anchor="middle" class="bd">Module 2 tunes the inner loop. Module 8 governs the outer one.</text>
    </svg>
  </div>
  <div class="take"><b>Cheap distinction, expensive to miss:</b> thinking longer is a budget question. Acting more is a blast-radius question.</div>
</div>

<div class="slide" data-sec="The agent loop" data-notes="Autonomy is the dial people set carelessly. Most production banking systems live at levels 2 and 3, not 4. Note that you can move the dial per tool, not just per system &mdash; read tools at level 4, write tools at level 2.">

      <g>
        <circle cx="150" cy="120" r="17" fill="#0d9488"/><text x="150" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
        <text x="150" y="172" text-anchor="middle" class="bx">Suggests</text>
        <text x="150" y="200" text-anchor="middle" class="bds">Human does the work</text>
        <text x="150" y="222" text-anchor="middle" class="bds">Blast radius: none</text>
      </g>
      <g>
        <circle cx="450" cy="120" r="17" fill="#0d9488"/><text x="450" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
        <text x="450" y="172" text-anchor="middle" class="bx">Acts on approval</text>
        <text x="450" y="200" text-anchor="middle" class="bds">Human clears each write</text>
        <text x="450" y="222" text-anchor="middle" class="bds">Blast radius: bounded</text>
      </g>
      <g>
        <circle cx="750" cy="120" r="17" fill="#d97706"/><text x="750" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
        <text x="750" y="172" text-anchor="middle" class="bx">Acts, reports after</text>
        <text x="750" y="200" text-anchor="middle" class="bds">Reversible actions only</text>
        <text x="750" y="222" text-anchor="middle" class="bds">Blast radius: recoverable</text>
      </g>
      <g>
        <circle cx="1050" cy="120" r="17" fill="#b91c1c"/><text x="1050" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text>
        <text x="1050" y="172" text-anchor="middle" class="bx">Fully autonomous</text>
        <text x="1050" y="200" text-anchor="middle" class="bds">No human in the path</text>
        <text x="1050" y="222" text-anchor="middle" class="bds">Blast radius: unbounded</text>
      </g>
      <rect x="90" y="70" width="660" height="0" fill="none"/>

      <rect x="230" y="278" width="720" height="86" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
      <text x="590" y="310" text-anchor="middle" class="bx am">Set the dial per tool, not per system.</text>
      <text x="590" y="342" text-anchor="middle" class="bd">Reading a ledger can sit at 4. Writing to it should not.</text>

  <div class="take"><b>The capstone enforces this:</b> retrieval and analysis run free; every write passes a human approval gate.</div>
</div>

<div class="slide div" data-sec="Chatbot, RAG or agent" data-notes="Short section, but it is the one that stops teams building an agent where a retrieval pipeline would have done.">
  <div class="k">Part three</div>
  <h1>Chatbot, RAG, or agent</h1>
</div>

<div class="slide" data-sec="Chatbot, RAG or agent" data-notes="Give them the test in words: if you can draw the flowchart and it does not change per input, you do not need an agent. Most internal tooling requests fail this test in the agent's favour far less often than teams assume.">

      <text x="310" y="86" text-anchor="middle" class="bx ok">The steps are the same every time</text>
      <rect x="130" y="112" width="360" height="34" rx="4" fill="#fff" stroke="#99f6e4"/><text x="310" y="135" text-anchor="middle" class="bds">read the file</text>
      <line x1="310" y1="150" x2="310" y2="164" stroke="#0d9488" stroke-width="2" marker-end="url(#at)"/>
      <rect x="130" y="168" width="360" height="34" rx="4" fill="#fff" stroke="#99f6e4"/><text x="310" y="191" text-anchor="middle" class="bds">summarise it</text>

      <rect x="130" y="224" width="360" height="34" rx="4" fill="#fff" stroke="#99f6e4"/><text x="310" y="247" text-anchor="middle" class="bds">send the summary</text>
      <text x="310" y="296" text-anchor="middle" class="bx ok">Build a workflow.</text>
      <text x="310" y="324" text-anchor="middle" class="bd">Cheap, testable, fails identically every time.</text>

      <rect x="630" y="50" width="480" height="300" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="870" y="86" text-anchor="middle" class="bx">The steps depend on what you find</text>
      <rect x="690" y="112" width="360" height="34" rx="4" fill="#fff" stroke="#c7d2fe"/><text x="870" y="135" text-anchor="middle" class="bds">why did this payment fail?</text>
      <line x1="870" y1="150" x2="870" y2="164" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <rect x="690" y="168" width="360" height="34" rx="4" fill="#fff" stroke="#c7d2fe"/><text x="870" y="191" text-anchor="middle" class="bds">check ledger &#8594; unclear &#8594; check policy</text>
      <line x1="870" y1="206" x2="870" y2="220" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>

      <text x="870" y="296" text-anchor="middle" class="bx">Build an agent.</text>

<div class="slide div" data-sec="Building blocks" data-notes="Five slides. Keep each one short &mdash; they get the depth in Modules 2 and 3. The purpose here is a shared vocabulary for the rest of the three days.">
  <div class="k">Part four</div>
  <h1>What an agent is made of</h1>
</div>

<div class="slide" data-sec="Building blocks" data-notes="Four blocks, and the loop that binds them. Stress that a system missing any one of these is not an agent &mdash; it is a pipeline with an LLM in it, and that is fine, but call it what it is.">
  <h2>Four building blocks</h2>
  <div class="body">
    <svg width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-label="The four building blocks of an agent arranged around the loop">
      <circle cx="590" cy="212" r="86" fill="#1e1b4b"/>
      <text x="590" y="204" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">THE LOOP</text>
      <text x="590" y="232" text-anchor="middle" font-size="13" fill="#a5b4fc">binds all four</text>

      <rect x="150" y="52" width="290" height="104" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
      <text x="176" y="82" class="lbl">01</text>
      <text x="295" y="98" text-anchor="middle" class="big">LLM</text>
      <text x="295" y="124" text-anchor="middle" class="bd">the brain &mdash; decides</text>
      <text x="295" y="144" text-anchor="middle" class="bds">which step, which tool, when to stop</text>
      <line x1="440" y1="130" x2="510" y2="168" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>

      <rect x="740" y="52" width="290" height="104" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
      <text x="766" y="82" class="lbl">02</text>
      <text x="885" y="98" text-anchor="middle" class="big">Memory</text>
      <text x="885" y="124" text-anchor="middle" class="bd">the state &mdash; remembers</text>
      <text x="885" y="144" text-anchor="middle" class="bds">this turn, this session, past sessions</text>
      <line x1="740" y1="130" x2="670" y2="168" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>

      <rect x="150" y="268" width="290" height="104" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
      <text x="176" y="298" class="lbl">03</text>
      <text x="295" y="314" text-anchor="middle" class="big">Tools</text>
      <text x="295" y="340" text-anchor="middle" class="bd">the hands &mdash; acts</text>
      <text x="295" y="360" text-anchor="middle" class="bds">read, write, call, retrieve</text>
      <line x1="440" y1="296" x2="510" y2="258" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>

      <rect x="740" y="268" width="290" height="104" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
      <text x="766" y="298" class="lbl">04</text>
      <text x="885" y="314" text-anchor="middle" class="big">Planning</text>
      <text x="885" y="340" text-anchor="middle" class="bd">the strategy &mdash; sequences</text>
      <text x="885" y="360" text-anchor="middle" class="bds">decompose, order, re-plan, stop</text>
      <line x1="740" y1="296" x2="670" y2="258" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
    </svg>
  </div>
  <div class="take"><b>Missing one?</b> Then it is a pipeline with an LLM in it. That is often the right build &mdash; just do not call it an agent.</div>
</div>

<div class="slide" data-sec="Building blocks" data-notes="The brain slide. The key production point is the last line: the model is the worst place to put a rule you can enforce in code. Teams routinely prompt for things a schema or an if-statement should guarantee.">
  <h2>Block 1 &mdash; the LLM decides, and only decides</h2>
  <div class="body">
    <svg width="1180" height="410" viewBox="0 0 1180 410" role="img" aria-label="What the model should and should not be responsible for">
      <rect x="70" y="46" width="490" height="290" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
      <text x="315" y="82" text-anchor="middle" class="bx ok">Let the model decide</text>
      <text x="110" y="130" class="bd">&bull;&nbsp; Which tool fits this situation</text>
      <text x="110" y="168" class="bd">&bull;&nbsp; What to ask it for</text>
      <text x="110" y="206" class="bd">&bull;&nbsp; Whether the answer is good enough yet</text>
      <text x="110" y="244" class="bd">&bull;&nbsp; How to phrase the result for a human</text>
      <text x="315" y="300" text-anchor="middle" class="bds">Judgement under ambiguity &mdash; what it is for</text>

      <rect x="620" y="46" width="490" height="290" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="865" y="82" text-anchor="middle" class="bx no">Never leave to the model</text>
      <text x="660" y="130" class="bd">&bull;&nbsp; Whether this user is allowed to do that</text>
      <text x="660" y="168" class="bd">&bull;&nbsp; Whether the amount exceeds a limit</text>
      <text x="660" y="206" class="bd">&bull;&nbsp; Whether the output matches the schema</text>
      <text x="660" y="244" class="bd">&bull;&nbsp; Whether to stop after 40 steps</text>
      <text x="865" y="300" text-anchor="middle" class="bds">Rules with a right answer &mdash; enforce in code</text>
      <text x="590" y="382" text-anchor="middle" class="bx am">A prompt is a request. Code is a guarantee.</text>
    </svg>
  </div>
  <div class="take"><b>Rule of thumb:</b> if a rule has a correct answer that never varies, the model is the worst place to keep it.</div>
</div>

<div class="slide" data-sec="Building blocks" data-notes="Memory in one picture. Flag the trap explicitly: unbounded buffer memory is the single most common cause of an agent that works in the demo and degrades in week two. Module 3 does compaction.">
  <h2>Block 2 &mdash; memory, and the trap inside it</h2>
  <div class="body">
    <svg width="1180" height="410" viewBox="0 0 1180 410" role="img" aria-label="Three kinds of memory and the context window trap">
      <rect x="60" y="46" width="330" height="150" rx="7" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
      <text x="225" y="80" text-anchor="middle" class="bx">Short-term</text>
      <text x="225" y="110" text-anchor="middle" class="bd">this conversation</text>
      <text x="225" y="142" text-anchor="middle" class="bds">Lives in the context window.</text>
      <text x="225" y="166" text-anchor="middle" class="bds">Gone when the session ends.</text>

      <rect x="425" y="46" width="330" height="150" rx="7" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
      <text x="590" y="80" text-anchor="middle" class="bx">Long-term</text>
      <text x="590" y="110" text-anchor="middle" class="bd">facts worth keeping</text>
      <text x="590" y="142" text-anchor="middle" class="bds">Lives in a store you own.</text>
      <text x="590" y="166" text-anchor="middle" class="bds">Survives restarts. Must be governed.</text>

      <rect x="790" y="46" width="330" height="150" rx="7" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
      <text x="955" y="80" text-anchor="middle" class="bx">Episodic</text>
      <text x="955" y="110" text-anchor="middle" class="bd">what happened last time</text>
      <text x="955" y="142" text-anchor="middle" class="bds">Past runs and their outcomes.</text>
      <text x="955" y="166" text-anchor="middle" class="bds">How an agent stops repeating a mistake.</text>

      <rect x="150" y="232" width="880" height="146" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="590" y="268" text-anchor="middle" class="bx no">The trap: memory that only grows</text>
      <rect x="200" y="288" width="120" height="26" rx="3" fill="#fecaca"/><text x="340" y="307" class="bds">turn 5 &mdash; fits easily</text>
      <rect x="200" y="320" width="330" height="26" rx="3" fill="#fca5a5"/><text x="550" y="339" class="bds">turn 40 &mdash; early constraints pushed out, agent starts repeating itself</text>
      <text x="590" y="368" text-anchor="middle" class="bds">Fix is compaction and summary memory, not a bigger window &mdash; Module 3.</text>
    </svg>
  </div>
  <div class="take"><b>Watch for it:</b> an agent that demos well and degrades in week two is almost always an unbounded buffer.</div>
</div>

<div class="slide" data-sec="Building blocks" data-notes="The tool slide, and the single most actionable fact in Day 1: the description IS the instruction. Tell them the Day 2 lab measures accuracy against description quality alone, with the model held constant.">

      <text x="750" y="278" text-anchor="middle" class="bd">but these words</text>

<div class="slide" data-sec="Building blocks" data-notes="Planning is where cost runs away. The stop condition is not a detail &mdash; it is the difference between a bounded bill and an incident. Point at Module 2 for architectures, Module 7 for budgets as release gates.">
  <h2>Block 4 &mdash; planning is mostly knowing when to stop</h2>
  <div class="body">
    <svg width="1180" height="410" viewBox="0 0 1180 410" role="img" aria-label="Planning as decomposition plus explicit stop conditions">
      <text x="300" y="44" text-anchor="middle" class="lbl">Decompose &mdash; goal into finishable steps</text>
      <rect x="80" y="62" width="440" height="44" rx="5" fill="#4338ca"/><text x="300" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Investigate this payment exception</text>
      <line x1="200" y1="110" x2="150" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
      <line x1="300" y1="110" x2="300" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
      <line x1="400" y1="110" x2="450" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
      <rect x="80" y="146" width="140" height="40" rx="4" fill="#eef2ff" stroke="#818cf8"/><text x="150" y="171" text-anchor="middle" class="bds">pull the record</text>
      <rect x="230" y="146" width="140" height="40" rx="4" fill="#eef2ff" stroke="#818cf8"/><text x="300" y="171" text-anchor="middle" class="bds">find the rule</text>
      <rect x="380" y="146" width="140" height="40" rx="4" fill="#eef2ff" stroke="#818cf8"/><text x="450" y="171" text-anchor="middle" class="bds">compare</text>
      <text x="300" y="216" text-anchor="middle" class="bds">Each step has a definition of done. Order respects dependencies.</text>

      <line x1="570" y1="50" x2="570" y2="360" stroke="#e2e8f0" stroke-width="2"/>

      <text x="870" y="44" text-anchor="middle" class="lbl">Stop &mdash; four conditions, all mandatory</text>
      <rect x="620" y="62" width="500" height="44" rx="5" fill="#ecfdf5" stroke="#0d9488" stroke-width="2"/>
      <text x="646" y="90" class="bd">Goal met &mdash; the answer satisfies the definition of done</text>
      <rect x="620" y="114" width="500" height="44" rx="5" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
      <text x="646" y="142" class="bd">Step budget spent &mdash; a hard number, not a hope</text>
      <rect x="620" y="166" width="500" height="44" rx="5" fill="#fffbeb" stroke="#fbbf24" stroke-width="2"/>
      <text x="646" y="194" class="bd">Loop detected &mdash; same tool, same args, no new information</text>
      <rect x="620" y="218" width="500" height="44" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
      <text x="646" y="246" class="bd">No path forward &mdash; escalate to a human, do not improvise</text>
      <text x="870" y="300" text-anchor="middle" class="bx no">An agent with no stop condition is an open invoice.</text>
      <text x="870" y="332" text-anchor="middle" class="bds">The most common production failure in this whole course.</text>
    </svg>
  </div>
  <div class="take"><b>Re-planning is not retrying:</b> a transient error deserves a retry; a wrong plan deserves a new plan.</div>
</div>

<div class="slide div" data-sec="Patterns" data-notes="The section the room came for. Deliver the patterns quickly and spend the time on what they cost &mdash; that is the part nobody else teaches.">
  <div class="k">Part five</div>
  <h1>One agent, or many</h1>
</div>

<div class="slide" data-sec="Patterns" data-notes="Start here and mean it: this is the default. Say that a single agent with six good tools beats three agents with two each, more often than the literature suggests.">
  <h2>Pattern 1 &mdash; single agent</h2>
  <div class="body">
    <svg width="1180" height="410" viewBox="0 0 1180 410" role="img" aria-label="A single agent with several tools">
      <rect x="440" y="56" width="300" height="86" rx="8" fill="#4338ca"/>
      <text x="590" y="94" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">One agent</text>
      <text x="590" y="122" text-anchor="middle" font-size="14" fill="#c7d2fe">one loop &middot; one context &middot; one trace</text>
      <line x1="510" y1="146" x2="290" y2="212" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <line x1="560" y1="146" x2="470" y2="212" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <line x1="620" y1="146" x2="710" y2="212" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <line x1="670" y1="146" x2="890" y2="212" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <rect x="200" y="218" width="180" height="48" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="290" y="248" text-anchor="middle" class="bds">ledger lookup</text>
      <rect x="390" y="218" width="180" height="48" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="480" y="248" text-anchor="middle" class="bds">policy search</text>
      <rect x="620" y="218" width="180" height="48" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="710" y="248" text-anchor="middle" class="bds">counterparty API</text>
      <rect x="810" y="218" width="180" height="48" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/><text x="900" y="248" text-anchor="middle" class="bds">write case note</text>

      <text x="300" y="316" text-anchor="middle" class="bx ok">Strengths</text>
      <text x="300" y="344" text-anchor="middle" class="bd">Cheapest. One trace to debug.</text>
      <text x="300" y="368" text-anchor="middle" class="bd">Nothing to hand off, so nothing lost in a handoff.</text>
      <text x="880" y="316" text-anchor="middle" class="bx no">Limits</text>
      <text x="880" y="344" text-anchor="middle" class="bd">One context window holds everything.</text>
      <text x="880" y="368" text-anchor="middle" class="bd">Tool choice degrades past roughly a dozen tools.</text>
    </svg>
  </div>
  <div class="take"><b>Start here every time.</b> One agent with six good tools beats three agents with two each more often than you would think.</div>
</div>

<div class="slide" data-sec="Patterns" data-notes="Peer-to-peer: routing is distributed, each agent decides who to hand to next. Powerful, and the hardest to debug because there is no single place where the decision was made.">
  <h2>Pattern 2 &mdash; multi-agent, peer to peer</h2>
  <div class="body">
    <svg width="1180" height="410" viewBox="0 0 1180 410" role="img" aria-label="Peer to peer agents handing off to each other">
      <rect x="120" y="90" width="220" height="76" rx="7" fill="#4338ca"/><text x="230" y="124" text-anchor="middle" font-size="17" font-weight="600" fill="#fff">Triage</text><text x="230" y="148" text-anchor="middle" font-size="13" fill="#c7d2fe">classifies the exception</text>
      <rect x="480" y="90" width="220" height="76" rx="7" fill="#4338ca"/><text x="590" y="124" text-anchor="middle" font-size="17" font-weight="600" fill="#fff">Investigator</text><text x="590" y="148" text-anchor="middle" font-size="13" fill="#c7d2fe">gathers evidence</text>
      <rect x="840" y="90" width="220" height="76" rx="7" fill="#4338ca"/><text x="950" y="124" text-anchor="middle" font-size="17" font-weight="600" fill="#fff">Drafter</text><text x="950" y="148" text-anchor="middle" font-size="13" fill="#c7d2fe">writes the case note</text>
      <line x1="345" y1="128" x2="470" y2="128" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>
      <line x1="705" y1="128" x2="830" y2="128" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>
      <path d="M560 172 Q400 240 265 172" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ag)"/>
      <text x="410" y="228" text-anchor="middle" class="bds">hands back when the class was wrong</text>
      <path d="M920 172 Q760 258 620 172" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ag)"/>
      <text x="770" y="246" text-anchor="middle" class="bds">hands back when evidence is thin</text>
      <text x="590" y="316" text-anchor="middle" class="bx">Each agent decides who goes next. No central router.</text>
      <text x="300" y="360" text-anchor="middle" class="bd ok">Flexible &mdash; paths nobody designed in advance</text>
      <text x="880" y="360" text-anchor="middle" class="bd no">Hard to debug &mdash; no single place the decision was made</text>
    </svg>
  </div>
  <div class="take"><b>Best fit:</b> work whose route genuinely varies and where any agent may legitimately need to send it back.</div>
</div>

<div class="slide" data-sec="Patterns" data-notes="Supervisor/worker: the routing decision is centralised. This is the pattern the capstone uses, because in a bank you want one auditable place where delegation happened.">

      <text x="590" y="104" text-anchor="middle" font-size="13" fill="#a5b4fc">decomposes &middot; routes &middot; aggregates</text>
      <line x1="500" y1="130" x2="255" y2="196" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <line x1="590" y1="130" x2="590" y2="196" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <line x1="680" y1="130" x2="925" y2="196" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <rect x="130" y="202" width="250" height="80" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
      <text x="255" y="234" text-anchor="middle" class="bx">Ledger worker</text><text x="255" y="260" text-anchor="middle" class="bds">2 tools &middot; read only</text>
      <rect x="465" y="202" width="250" height="80" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
      <text x="590" y="234" text-anchor="middle" class="bx">Policy worker</text><text x="590" y="260" text-anchor="middle" class="bds">retrieval &middot; cites sources</text>

      <text x="925" y="234" text-anchor="middle" class="bx">Critic worker</text><text x="925" y="260" text-anchor="middle" class="bds">challenges the finding</text>
      <path d="M255 288 Q255 330 570 330" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
      <path d="M590 288 L590 322" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
      <path d="M925 288 Q925 330 610 330" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
      <text x="590" y="360" text-anchor="middle" class="bx">results return to one place, and one place decides what they mean</text>
      <text x="590" y="392" text-anchor="middle" class="bds">Routing can be a rule you wrote, or a decision the supervisor's model makes. Both are in the Day 2 labs.</text>

  </div>

<div class="slide" data-sec="Patterns" data-notes="The comparison slide. Do not let anyone leave thinking more agents means better. The right-hand column is the honest one.">

<div class="slide" data-sec="The coordination tax" data-notes="The most important slide in the module. Every extra agent is a bill: tokens, latency, and a new class of failure. Say the numbers out loud &mdash; they will be measured in the Day 2 scorecard lab.">
  <h2>The coordination tax</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="What each additional agent costs in tokens latency and failure surface">
      <text x="590" y="40" text-anchor="middle" class="lbl">What you pay for each agent you add</text>
      <g>
        <rect x="70" y="66" width="330" height="150" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
        <text x="235" y="106" text-anchor="middle" class="num" fill="#b91c1c">3&ndash;10&times;</text>
        <text x="235" y="140" text-anchor="middle" class="bx">the tokens</text>
        <text x="235" y="170" text-anchor="middle" class="bds">Each agent re-reads the context</text>
        <text x="235" y="192" text-anchor="middle" class="bds">it was handed. Nothing is free.</text>
      </g>
      <g>
        <rect x="425" y="66" width="330" height="150" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
        <text x="590" y="106" text-anchor="middle" class="num" fill="#b91c1c">+ latency</text>
        <text x="590" y="140" text-anchor="middle" class="bx">serial by default</text>
        <text x="590" y="170" text-anchor="middle" class="bds">Handoffs are sequential unless</text>
        <text x="590" y="192" text-anchor="middle" class="bds">you deliberately branch.</text>
      </g>
      <g>
        <rect x="780" y="66" width="330" height="150" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
        <text x="945" y="106" text-anchor="middle" class="num" fill="#b91c1c">new failures</text>
        <text x="945" y="140" text-anchor="middle" class="bx">a whole new class</text>
        <text x="945" y="170" text-anchor="middle" class="bds">Lost context, contradictory</text>
        <text x="945" y="192" text-anchor="middle" class="bds">findings, work done twice.</text>
      </g>
      <rect x="70" y="248" width="1040" height="140" rx="8" fill="#f8f8fd" stroke="#4338ca" stroke-width="2"/>
      <text x="590" y="284" text-anchor="middle" class="bx">The tax is worth paying for exactly two things</text>
      <text x="300" y="326" text-anchor="middle" class="bx ok">Specialisation</text>
      <text x="300" y="354" text-anchor="middle" class="bd">Sub-tasks need different tools,</text>
      <text x="300" y="376" text-anchor="middle" class="bd">permissions, or models.</text>
      <text x="880" y="326" text-anchor="middle" class="bx ok">Parallelism</text>
      <text x="880" y="354" text-anchor="middle" class="bd">Independent sub-tasks that can</text>
      <text x="880" y="376" text-anchor="middle" class="bd">genuinely run at the same time.</text>
      <line x1="590" y1="306" x2="590" y2="382" stroke="#e2e8f0" stroke-width="2"/>
    </svg>
  </div>
  <div class="take"><b>If neither applies,</b> you are paying the tax and receiving nothing. That is the most common multi-agent mistake in production.</div>
</div>

<div class="slide" data-sec="The coordination tax" data-notes="Cost and latency grow roughly linearly. The failure surface does not. This is why the fifth agent hurts so much more than the second &mdash; and why 'just add another agent' is not a small change.">
  <h2>Cost grows in a line. Failure grows in a mesh.</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="Handoff paths growing combinatorially as agents are added">
      <g>
        <text x="180" y="52" text-anchor="middle" class="lbl">2 agents</text>
        <circle cx="130" cy="140" r="26" fill="#4338ca"/><circle cx="230" cy="140" r="26" fill="#4338ca"/>
        <line x1="156" y1="140" x2="204" y2="140" stroke="#94a3b8" stroke-width="2"/>
        <text x="180" y="228" text-anchor="middle" class="big">2</text>
        <text x="180" y="254" text-anchor="middle" class="bds">handoff paths</text>
      </g>
      <g>
        <text x="470" y="52" text-anchor="middle" class="lbl">3 agents</text>

<div class="slide" data-sec="On-ramp" data-notes="Be honest about the boundary. create_agent is perfect until you need to see or steer the state, branch, or resume. That is LangGraph, and it is this afternoon. Do not oversell either.">
  <h2>Where this stops being enough</h2>
  <div class="body">
    <svg width="1180" height="410" viewBox="0 0 1180 410" role="img" aria-label="When to move from create_agent to an explicit LangGraph state graph">
      <rect x="70" y="52" width="480" height="290" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
      <text x="310" y="90" text-anchor="middle" class="bx ok">create_agent is enough when</text>
      <text x="110" y="140" class="bd">&bull;&nbsp; One loop, one set of tools</text>
      <text x="110" y="180" class="bd">&bull;&nbsp; You do not need to inspect the state</text>
      <text x="110" y="220" class="bd">&bull;&nbsp; No branching, no parallel work</text>
      <text x="110" y="260" class="bd">&bull;&nbsp; A crash mid-run is acceptable</text>
      <text x="310" y="310" text-anchor="middle" class="bds">Most of this morning&rsquo;s labs.</text>

      <line x1="565" y1="90" x2="615" y2="90" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>

      <rect x="630" y="52" width="480" height="290" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="870" y="90" text-anchor="middle" class="bx">You need LangGraph when</text>
      <text x="670" y="140" class="bd">&bull;&nbsp; State must be explicit and inspectable</text>
      <text x="670" y="180" class="bd">&bull;&nbsp; The run must resume after a restart</text>
      <text x="670" y="220" class="bd">&bull;&nbsp; Branches, cycles or parallel paths</text>
      <text x="670" y="260" class="bd">&bull;&nbsp; A human must approve a step mid-run</text>
      <text x="870" y="310" text-anchor="middle" class="bds am">Module 3, this afternoon &mdash; and everything after it.</text>
    </svg>
  </div>
  <div class="take"><b>Honest boundary:</b> reach for the graph when you need to see, steer or resume the state &mdash; not before.</div>
</div>

<div class="slide" data-sec="Recap" data-notes="Close in ninety seconds. The rubric is the artefact; the baseline eval set is the homework for the last lab of today. Then go straight into the knowledge check.">

        <text x="232" y="236" text-anchor="middle" class="bx">Every agent is a tax</text>

        <text x="589" y="236" text-anchor="middle" class="bx am">The rubric</text>

      <g>

<script>
(function(){
  var stage = document.getElementById('stage');
  stage.appendChild(document.getElementById('deck').content.cloneNode(true));
  var slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));
  var i = 0, total = slides.length;

  var num = document.getElementById('num'),
      progf = document.getElementById('progf'),
      secname = document.getElementById('secname'),
      toc = document.getElementById('toc'),
      toclist = document.getElementById('toclist'),
      notes = document.getElementById('notes'),
      notesbody = document.getElementById('notesbody');

  /* ---- build the index, grouped by section ---- */
  var groups = [], last = null;
  slides.forEach(function(s, n){
    var sec = s.getAttribute('data-sec') || '';
    if (sec !== last) { groups.push({sec: sec, items: []}); last = sec; }
    var h = s.querySelector('h2, h1'), q = s.querySelector('.qtag');
    var t = h ? h.textContent.trim() : sec;
    if (q) t = q.textContent.trim() + ' \u2014 ' + t;
    groups[groups.length-1].items.push({n: n, t: t});
  });
  groups.forEach(function(g){
    var d = document.createElement('div'); d.className = 'grp';
    var hd = document.createElement('div'); hd.className = 'grph'; hd.textContent = g.sec; d.appendChild(hd);
    g.items.forEach(function(it){
      var a = document.createElement('a');
      a.href = '#'; a.dataset.n = it.n;
      a.innerHTML = '<span class="n">' + (it.n + 1) + '</span>';
      a.appendChild(document.createTextNode(it.t));
      a.addEventListener('click', function(e){ e.preventDefault(); go(it.n); toc.classList.remove('on'); });
      d.appendChild(a);
    });
    toclist.appendChild(d);
  });
  var tocLinks = Array.prototype.slice.call(toclist.querySelectorAll('a'));

  function go(n){
    if (n < 0) n = 0;
    if (n > total - 1) n = total - 1;
    slides[i].classList.remove('active');
    i = n;
    slides[i].classList.add('active');
    num.textContent = (i + 1) + ' / ' + total;
    progf.style.width = ((i + 1) / total * 100) + '%';
    secname.textContent = slides[i].getAttribute('data-sec') || '';
    notesbody.textContent = slides[i].getAttribute('data-notes') || 'No notes for this slide.';
    tocLinks.forEach(function(a){ a.classList.toggle('cur', +a.dataset.n === i); });
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  /* ---- scale the 1280x720 stage to the available space ---- */
  function fit(){
    var w = document.getElementById('wrap');
    var s = Math.min(w.clientWidth / 1280, w.clientHeight / 720);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){
    var n = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(n) && n - 1 !== i) go(n - 1);
  });

  document.getElementById('bnext').addEventListener('click', function(){ go(i + 1); });
  document.getElementById('bprev').addEventListener('click', function(){ go(i - 1); });
  document.getElementById('btoc').addEventListener('click', function(){ toc.classList.toggle('on'); });
  document.getElementById('bnotes').addEventListener('click', function(){ notes.classList.toggle('on'); });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(i - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(total - 1); }
    else if (k === 't' || k === 'T') { toc.classList.toggle('on'); }
    else if (k === 'n' || k === 'N') { notes.classList.toggle('on'); }
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if (k === 'Escape') { toc.classList.remove('on'); notes.classList.remove('on'); }
  });

  fit();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(isNaN(start) ? 0 : start - 1);
})();
</script>
