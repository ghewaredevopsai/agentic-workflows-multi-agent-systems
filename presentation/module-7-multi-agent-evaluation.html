<div class="slide title" data-sec="Title" data-notes="Five slides, five things to measure, and every number on them was measured on FrontDesk AI running in a participant namespace -- so name the metric and the agent every time. Say up front that today is not about opinions: they have built agents for two days and today they find out whether they work. Module 7 is one lab now, and it is slide 3 and slide 4 made practical: six real runs captured off this app, four of them wrong at four different steps, diagnosed from the audit trail.">
  <h1>Multi-Agent System Evaluation</h1>
  <div class="sub">Module 7 &middot; Day 3 &mdash; Evaluation, Safety &amp; AgentOps</div>
  <div class="rule"></div>
  <div class="meta">
    Measuring a real agentic app, with its own numbers<br>
    Agentic Workflows &amp; Multi-Agent Systems &middot; Trainer: Rajesh Gheware
  </div>
</div>

<div class="slide" data-sec="Same input, twice" data-notes="Slide one, and it is the reason the module exists. Land the arithmetic: one employee question is not one model call, it is about four -- supervisor, RAG, the worker's loop, QA -- and every one of them can come out differently. Temperature 0 is not determinism; it narrows the choice at each step and does not remove it. The 21-to-57-second spread is measured on this app, same kind of request. So the demo that worked in the room proved that it can work, not that it does. The right-hand column is the whole method of Lab 7.1: repeat, count, report a range.">
  <h2>The same question, asked twice, gives two different answers</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="Why one run of FrontDesk AI tells you almost nothing, and what to do instead">
      <rect x="22" y="8" width="560" height="384" rx="8" fill="#fef4f4" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="302" y="40" text-anchor="middle" class="lbl no">What that looks like in FrontDesk AI</text>
      <text x="42" y="82" class="bd">&bull; One employee question runs about <tspan class="mn">4.25</tspan> model calls on</text>
      <text x="56" y="106" class="bd">average. Any one of them can come out differently</text>
      <text x="42" y="146" class="bd">&bull; Temperature is 0 and the runs still differ. The same</text>
      <text x="56" y="170" class="bd">ticket can even be filed under a different category</text>
      <text x="42" y="210" class="bd">&bull; Measured here: the same kind of request took</text>
      <text x="56" y="234" class="bd">anywhere from <tspan class="mn">21</tspan> to <tspan class="mn">57</tspan> seconds</text>
      <text x="42" y="274" class="bd">&bull; So a demo that worked once tells you it <tspan font-style="italic">can</tspan> work,</text>
      <text x="56" y="298" class="bd">not that it does</text>
      <text x="42" y="338" class="bd">&bull; The audit trail under each reply is your record of</text>
      <text x="56" y="362" class="bd">what actually happened on that run</text>
      <rect x="598" y="8" width="560" height="384" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="878" y="40" text-anchor="middle" class="lbl ok">What to do about it</text>
      <text x="618" y="82" class="bd">&bull; Run every case several times. Write down how often</text>
      <text x="632" y="106" class="bd">it passed, not whether it passed</text>
      <text x="618" y="146" class="bd">&bull; Report a range, not one number. &ldquo;8 of 10&rdquo; is a</text>
      <text x="632" y="170" class="bd">measurement; &ldquo;it works&rdquo; is not</text>
      <text x="618" y="210" class="bd">&bull; Keep the runs. A number you cannot produce again</text>
      <text x="632" y="234" class="bd">is not evidence</text>
      <text x="618" y="274" class="bd">&bull; Change one thing at a time, or you cannot say</text>
      <text x="632" y="298" class="bd">which change moved the number</text>
      <text x="618" y="338" class="bd">&bull; Read the audit trail on a failure before you</text>
      <text x="632" y="362" class="bd">change any code</text>
    </svg>
  </div>
  <div class="take"><b>Try it:</b> ask FrontDesk AI the same question five times, and count how many of the five answers you would have accepted.</div>
</div>

<div class="slide" data-sec="What to check" data-notes="Slide two. The point is that an outcome-only test passes a system that guessed. Walk the first row slowly: FrontDesk AI has a real tool for the leave balance, and a model that answers from memory can be right by luck -- the audit trail is what tells you which happened, because it lists the tools that ran. Second row is the opposite failure and it is the one RAG causes. Then the eval-set point from Lab 5.1: a model supervisor scored 100% on 24 labelled tickets over two runs, so that set became a regression test rather than an eval set. If theirs passes everything, it is too easy.">
  <h2>Check the answer, and check the path it took</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="Two ways a reply can be wrong, and what an eval set should assert">
      <rect x="22" y="8" width="560" height="384" rx="8" fill="#fef4f4" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="302" y="40" text-anchor="middle" class="lbl no">Two ways a reply can be wrong</text>
      <text x="42" y="82" class="bd">&bull; <tspan font-weight="700">Right answer, wrong path.</tspan> It answered from</text>
      <text x="56" y="106" class="bd">memory instead of calling <tspan class="mn">get_leave_balance</tspan></text>
      <text x="42" y="146" class="bd">&bull; <tspan font-weight="700">Wrong answer, right path.</tspan> The correct tools ran and</text>
      <text x="56" y="170" class="bd">the handbook chunk it retrieved was the wrong one</text>
      <text x="42" y="210" class="bd">&bull; A reply the employee marked with a thumbs-up can</text>
      <text x="56" y="234" class="bd">still be wrong. That is an opinion, not a check</text>
      <text x="42" y="274" class="bd">&bull; The audit trail says which: the category, the</text>
      <text x="56" y="298" class="bd">confidence, the tools that ran, what QA changed</text>
      <text x="42" y="338" class="bd">&bull; Confidence under 5 sends it to clarify instead of</text>
      <text x="56" y="362" class="bd">answering &mdash; that path needs testing too</text>
      <rect x="598" y="8" width="560" height="384" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="878" y="40" text-anchor="middle" class="lbl ok">What to do about it</text>
      <text x="618" y="82" class="bd">&bull; Assert on the final answer <tspan font-weight="700">and</tspan> on the list of</text>
      <text x="632" y="106" class="bd">tools that actually ran</text>
      <text x="618" y="146" class="bd">&bull; Put three kinds of case in the set: ordinary, edge,</text>
      <text x="632" y="170" class="bd">and ones with no good answer at all</text>
      <text x="618" y="210" class="bd">&bull; Include cases it should refuse or escalate, not</text>
      <text x="632" y="234" class="bd">only ones it should answer</text>
      <text x="618" y="274" class="bd">&bull; If your set passes 100% it is a regression test, not</text>
      <text x="632" y="298" class="bd">an eval set. Go and find harder cases</text>
      <text x="618" y="338" class="bd">&bull; Treat a thumbs-up as a reason to review, not as a</text>
      <text x="632" y="362" class="bd">score. Module 8 shows what else it can do</text>
    </svg>
  </div>
  <div class="take"><b>Try it:</b> pick one question and write down the tool calls you expect <i>before</i> you run it, then compare.</div>
</div>

<div class="slide" data-sec="Per step" data-notes="Slide three, and the numbers are all from our own Grafana. The headline: the slowest step and the dearest step are different steps, so a single total hides both problems. The supervisor is one call and 22% of the wall clock; the HR worker's ReAct loop is three calls and 54% of the tokens. Then the finding worth acting on: seven calls tagged react_iter_2 means HR routinely uses the last of MAX_TOOL_ITERATIONS = 3, and that is a tool-description and prompt problem long before it is a model problem -- which is exactly the +60% tool-description result from Module 1. Metrics tell you WHICH agent; the trace tells you WHY.">
  <h2>Which step was slow, and which step was expensive</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="Measured per-agent latency and token share for one FrontDesk AI request">
      <rect x="22" y="8" width="560" height="384" rx="8" fill="#fef4f4" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="302" y="40" text-anchor="middle" class="lbl no">Measured here, for one employee question</text>
      <text x="42" y="82" class="bd">&bull; The <tspan class="mn">supervisor</tspan> is the slowest single step &mdash; about</text>
      <text x="56" y="106" class="bd"><tspan class="mn">22%</tspan> of the total time</text>
      <text x="42" y="146" class="bd">&bull; The HR worker's think-act-observe loop is the</text>
      <text x="56" y="170" class="bd">dearest &mdash; about <tspan class="mn">54%</tspan> of all the tokens</text>
      <text x="42" y="210" class="bd">&bull; So the slowest step and the dearest step are not</text>
      <text x="56" y="234" class="bd">the same step, on this app</text>
      <text x="42" y="274" class="bd">&bull; One question costs about <tspan class="mn">4.25</tspan> model calls and</text>
      <text x="56" y="298" class="bd">about <tspan class="mn">4,400</tspan> tokens</text>
      <text x="42" y="338" class="bd">&bull; The HR worker often uses its last allowed loop,</text>
      <text x="56" y="362" class="bd">3 of 3 &mdash; it is running out of turns, not of model</text>
      <rect x="598" y="8" width="560" height="384" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="878" y="40" text-anchor="middle" class="lbl ok">What to do about it</text>
      <text x="618" y="82" class="bd">&bull; Label every model call with the agent that made it.</text>
      <text x="632" y="106" class="bd">This app does: <tspan class="mn">llm.supervisor</tspan>, <tspan class="mn">llm.hr_react_iter_0</tspan></text>
      <text x="618" y="146" class="bd">&bull; Measure time and tokens separately. One combined</text>
      <text x="632" y="170" class="bd">total hides both problems at once</text>
      <text x="618" y="210" class="bd">&bull; Use the dashboard to find <tspan font-weight="700">which</tspan> step, then the</text>
      <text x="632" y="234" class="bd">trace to find out <tspan font-weight="700">why</tspan> that step</text>
      <text x="618" y="274" class="bd">&bull; Fix the step that dominates, not the one that</text>
      <text x="632" y="298" class="bd">feels slow when you use it</text>
      <text x="618" y="338" class="bd">&bull; A worker that keeps hitting its loop limit needs</text>
      <text x="632" y="362" class="bd">better tool descriptions before a bigger model</text>
    </svg>
  </div>
  <div class="take"><b>Try it:</b> open the per-agent panel for your own namespace and name your slowest step and your dearest step.</div>
</div>

<div class="slide" data-sec="Trust the number" data-notes="Slide four is the uncomfortable one, because the broken metric was ours. Two separate lessons. First: an average is not a promise -- the lifetime mean said 17.2s while a five-minute window said 31.2s, and p95 was 26.2s against a 12.8s mean. Second, and worse: the app created its latency histograms with unit seconds and no explicit bucket boundaries, so OpenTelemetry applied its default MILLISECOND boundaries. All twelve supervisor calls landed in le=5.0, and p50, p95 and p99 all returned the same interpolated fiction. Nothing looked broken. The tell is in the right-hand column: identical percentiles are not consistency.">
  <h2>An average hides the problem, and the measurement can be wrong</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="How an average and a mis-bucketed histogram both hid the real latency">
      <rect x="22" y="8" width="560" height="384" rx="8" fill="#fef4f4" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="302" y="40" text-anchor="middle" class="lbl no">What went wrong here</text>
      <text x="42" y="82" class="bd">&bull; The lifetime average said <tspan class="mn">17.2s</tspan>. A five-minute</text>
      <text x="56" y="106" class="bd">window over the same app said <tspan class="mn">31.2s</tspan></text>
      <text x="42" y="146" class="bd">&bull; p95 was <tspan class="mn">26.2s</tspan> against a <tspan class="mn">12.8s</tspan> average. That gap</text>
      <text x="56" y="170" class="bd">is exactly what the average was hiding</text>
      <text x="42" y="210" class="bd">&bull; Worse: this app recorded <tspan font-weight="700">seconds</tspan> into buckets</text>
      <text x="56" y="234" class="bd">meant for <tspan font-weight="700">milliseconds</tspan></text>
      <text x="42" y="274" class="bd">&bull; So all 12 supervisor calls fell in one bucket, and</text>
      <text x="56" y="298" class="bd">p50, p95 and p99 returned the same invented number</text>
      <text x="42" y="338" class="bd">&bull; A time range spanning the fix mixes both bucket</text>
      <text x="56" y="362" class="bd">sets and returns 10000 &mdash; an edge, not a time</text>
      <rect x="598" y="8" width="560" height="384" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="878" y="40" text-anchor="middle" class="lbl ok">What to do about it</text>
      <text x="618" y="82" class="bd">&bull; Always show p95 beside the average. One of the two</text>
      <text x="632" y="106" class="bd">is the promise you are making to users</text>
      <text x="618" y="146" class="bd">&bull; If p50, p95 and p99 are identical, suspect your</text>
      <text x="632" y="170" class="bd">buckets before you celebrate consistency</text>
      <text x="618" y="210" class="bd">&bull; Say what unit you record, and set the bucket edges</text>
      <text x="632" y="234" class="bd">yourself rather than taking a default</text>
      <text x="618" y="274" class="bd">&bull; After changing how you measure, read a short</text>

<div class="slide" data-sec="Release gate" data-notes="Slide five closes the module. A dashboard is a report and a gate is a decision, and the difference is that a gate has a threshold and an owner written down in advance. FrontDesk AI already emits everything a gate needs, so this is not aspirational -- and the 20-second placeholder gate would already have fired on our own numbers, which is the honest place to start the conversation. The fourth row on the left is the one people miss: the model, its fallback and the SMTP settings are all changeable from admin chat and persist in system_config, so the thing you measured can change with no deploy and no commit. That is why a number is only meaningful next to the model and prompt that produced it.">
  <h2>Turning the numbers into a rule that can stop a release</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="The metrics FrontDesk AI already emits, and how to turn them into release gates">

      <text x="42" y="82" class="bd">&bull; <tspan class="mn">frontdeskai_escalations_total</tspan> and</text>
      <text x="56" y="106" class="bd"><tspan class="mn">_fallbacks_total</tspan> &mdash; work it could not finish</text>
      <text x="42" y="146" class="bd">&bull; <tspan class="mn">frontdeskai_agent_errors_total</tspan>, p95 request time,</text>
      <text x="56" y="170" class="bd">and tokens per request, from the same endpoint</text>
      <text x="42" y="210" class="bd">&bull; A 20-second latency gate would already have fired:</text>
      <text x="56" y="234" class="bd">the average was <tspan class="mn">17.2s</tspan>, a five-minute window <tspan class="mn">31.2s</tspan></text>
      <text x="42" y="274" class="bd">&bull; Anyone with admin chat can change the model at</text>
      <text x="56" y="298" class="bd">runtime. It is stored and survives a restart</text>

      <text x="56" y="362" class="bd">deploy and no commit to point at</text>

<script>
(function(){
  var stage = document.getElementById('stage');
  stage.appendChild(document.getElementById('deck').content.cloneNode(true));
  var slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));
  var i = 0, total = slides.length;

  var num = document.getElementById('num'),
      progf = document.getElementById('progf'),
      secname = document.getElementById('secname'),
      toc = document.getElementById('toc'),
      toclist = document.getElementById('toclist'),
      notes = document.getElementById('notes'),
      notesbody = document.getElementById('notesbody');

  /* ---- build the index, grouped by section ---- */
  var groups = [], last = null;
  slides.forEach(function(s, n){
    var sec = s.getAttribute('data-sec') || '';
    if (sec !== last) { groups.push({sec: sec, items: []}); last = sec; }
    var h = s.querySelector('h2, h1'), q = s.querySelector('.qtag');
    var t = h ? h.textContent.trim() : sec;
    if (q) t = q.textContent.trim() + ' \u2014 ' + t;
    groups[groups.length-1].items.push({n: n, t: t});
  });
  groups.forEach(function(g){
    var d = document.createElement('div'); d.className = 'grp';
    var hd = document.createElement('div'); hd.className = 'grph'; hd.textContent = g.sec; d.appendChild(hd);
    g.items.forEach(function(it){
      var a = document.createElement('a');
      a.href = '#'; a.dataset.n = it.n;
      a.innerHTML = '<span class="n">' + (it.n + 1) + '</span>';
      a.appendChild(document.createTextNode(it.t));
      a.addEventListener('click', function(e){ e.preventDefault(); go(it.n); toc.classList.remove('on'); });
      d.appendChild(a);
    });
    toclist.appendChild(d);
  });
  var tocLinks = Array.prototype.slice.call(toclist.querySelectorAll('a'));

  function go(n){
    if (n < 0) n = 0;
    if (n > total - 1) n = total - 1;
    slides[i].classList.remove('active');
    i = n;
    slides[i].classList.add('active');
    num.textContent = (i + 1) + ' / ' + total;
    progf.style.width = ((i + 1) / total * 100) + '%';
    secname.textContent = slides[i].getAttribute('data-sec') || '';
    notesbody.textContent = slides[i].getAttribute('data-notes') || 'No notes for this slide.';
    tocLinks.forEach(function(a){ a.classList.toggle('cur', +a.dataset.n === i); });
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  /* ---- scale the 1280x720 stage to the available space ---- */
  function fit(){
    var w = document.getElementById('wrap');
    var s = Math.min(w.clientWidth / 1280, w.clientHeight / 720);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){
    var n = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(n) && n - 1 !== i) go(n - 1);
  });

  document.getElementById('bnext').addEventListener('click', function(){ go(i + 1); });
  document.getElementById('bprev').addEventListener('click', function(){ go(i - 1); });
  document.getElementById('btoc').addEventListener('click', function(){ toc.classList.toggle('on'); });
  document.getElementById('bnotes').addEventListener('click', function(){ notes.classList.toggle('on'); });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(i - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(total - 1); }
    else if (k === 't' || k === 'T') { toc.classList.toggle('on'); }
    else if (k === 'n' || k === 'N') { notes.classList.toggle('on'); }
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if (k === 'Escape') { toc.classList.remove('on'); notes.classList.remove('on'); }
  });

  fit();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(isNaN(start) ? 0 : start - 1);
})();
</script>
