<div class="slide" data-sec="Orientation" data-notes="Set the shift explicitly. Two days of building, one day of finding out. Point out that they have already met this module twice -- the harness in Lab 4.2 and the scorecard in Lab 5.5 were both this module arriving early, because you cannot make a design decision without it.">

      <text x="186" y="366" class="bd">&bull;&nbsp; <tspan font-weight="600">Lab 5.5</tspan> priced a graph against a single agent and let &ldquo;don't&rdquo; be an answer</text>

<div class="slide div" data-sec="Non-determinism" data-notes="Part one. The claim that makes everything else necessary, and the one people nod at without changing any of their practices.">
  <div class="k">Part one</div>
  <h1>Why the demo proved nothing</h1>
</div>

<div class="slide" data-sec="Non-determinism" data-notes="The opening claim, and worth being concrete. Temperature zero does not make an agent deterministic: tool ordering, retrieval ties, timeouts, and the model's own non-determinism at scale all move. Ask who has shipped on the strength of a good demo. Everyone has.">
  <h2>Same input, twice, two different runs</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="The same input producing different agent runs">
      <text x="590" y="46" text-anchor="middle" class="lbl">one case, submitted three times</text>

      <rect x="70" y="66" width="330" height="120" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="235" y="96" text-anchor="middle" class="bxs ok">run 1</text>
      <text x="235" y="126" text-anchor="middle" class="bds">read &rarr; policy &rarr; recommend</text>
      <text x="235" y="152" text-anchor="middle" class="bds">3 steps &middot; 1,420 tokens</text>
      <text x="235" y="176" text-anchor="middle" class="bds ok">correct</text>

      <rect x="425" y="66" width="330" height="120" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="590" y="96" text-anchor="middle" class="bxs ok">run 2</text>
      <text x="590" y="126" text-anchor="middle" class="bds">read &rarr; policy &rarr; policy &rarr; recommend</text>
      <text x="590" y="152" text-anchor="middle" class="bds">4 steps &middot; 1,980 tokens</text>
      <text x="590" y="176" text-anchor="middle" class="bds ok">correct</text>

      <rect x="780" y="66" width="330" height="120" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="945" y="96" text-anchor="middle" class="bxs no">run 3</text>
      <text x="945" y="126" text-anchor="middle" class="bds">read &rarr; recommend</text>
      <text x="945" y="152" text-anchor="middle" class="bds">2 steps &middot; 890 tokens</text>
      <text x="945" y="176" text-anchor="middle" class="bds no">wrong &mdash; never read the policy</text>

      <text x="590" y="222" text-anchor="middle" class="bd">Same case file. Same prompts. Same model. Temperature zero.</text>

      <rect x="120" y="246" width="940" height="162" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="278" text-anchor="middle" class="bxs am">Temperature zero is not determinism, and never was</text>
      <text x="156" y="312" class="bd">&bull;&nbsp; floating-point non-associativity: batching and hardware change the arithmetic</text>
      <text x="156" y="342" class="bd">&bull;&nbsp; ties in retrieval and tool ranking break arbitrarily</text>
      <text x="156" y="372" class="bd">&bull;&nbsp; timeouts, retries and rate limits change the path, not just the timing</text>
      <text x="590" y="400" text-anchor="middle" class="bds">A demo is one sample. You watched run 1 and shipped. Run 3 was always in there.</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Non-determinism" data-notes="The practical consequence, and the arithmetic that stops a pointless argument. If one case is worth ten points, a ten-point difference is one coin flip -- exactly what Lab 4.2 found. Give them the rule of thumb and the honest caveat that it is a rule of thumb.">
  <h2>So a number without an interval is an anecdote</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Pass rates with and without repeats and intervals">
      <rect x="50" y="56" width="500" height="188" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="300" y="88" text-anchor="middle" class="lbl no">What gets reported</text>
      <text x="300" y="132" text-anchor="middle" class="big no">&ldquo;v2 scores 80%&rdquo;</text>
      <text x="300" y="170" text-anchor="middle" class="bd">ten cases, one run each</text>
      <text x="300" y="202" text-anchor="middle" class="bds">v1 scored 70%, so v2 is better</text>
      <text x="300" y="228" text-anchor="middle" class="bds no">and the meeting moves on</text>

      <rect x="630" y="56" width="500" height="188" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="880" y="88" text-anchor="middle" class="lbl ok">What was measured</text>
      <text x="880" y="132" text-anchor="middle" class="big ok">8/10, once</text>
      <text x="880" y="170" text-anchor="middle" class="bd">one case is worth ten points</text>
      <text x="880" y="202" text-anchor="middle" class="bds">so 70% and 80% are one flip apart</text>
      <text x="880" y="228" text-anchor="middle" class="bds ok">nothing has been shown</text>

      <rect x="120" y="272" width="940" height="136" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="304" text-anchor="middle" class="bxs am">The rule: if one case is worth more than the difference you are claiming, you have not measured anything</text>
      <text x="156" y="340" class="bd">&bull;&nbsp; <tspan font-weight="600">Repeat</tspan> &mdash; the same case several times, because the variance is inside the run, not the case</text>
      <text x="156" y="370" class="bd">&bull;&nbsp; <tspan font-weight="600">Widen</tspan> &mdash; more cases lower the value of each one, which is what buys resolution</text>
      <text x="156" y="398" class="bd">&bull;&nbsp; <tspan font-weight="600">Report a range</tspan> &mdash; &ldquo;78&ndash;86%&rdquo; ends arguments that &ldquo;80%&rdquo; starts</text>
    </svg>
  </div>
</div>

<div class="slide div" data-sec="Assertions" data-notes="Part two. What you actually write down, and the distinction that catches the bugs an output check cannot see.">
  <div class="k">Part two</div>
  <h1>What to assert</h1>
</div>

<div class="slide" data-sec="Assertions" data-notes="The most useful distinction in the module. An outcome assertion is what everyone writes; a trajectory assertion is what catches the agent that got there by luck, by brute force, or by doing something it should never have done and then undoing it. The bottom row is the one to dwell on -- it passed.">
  <h2>Outcome, and how it got there</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Outcome assertions compared with trajectory assertions">
      <rect x="50" y="52" width="500" height="212" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="300" y="84" text-anchor="middle" class="lbl">Outcome assertions</text>
      <text x="300" y="120" text-anchor="middle" class="bxs">did it end in the right place?</text>
      <text x="76" y="158" class="bds">&bull; the recommendation is &ldquo;hold for a human&rdquo;</text>
      <text x="76" y="188" class="bds">&bull; the answer cites section 3.2</text>
      <text x="76" y="218" class="bds">&bull; no payment was released</text>
      <text x="300" y="250" text-anchor="middle" class="bds">easy to write, and everybody writes them</text>

      <rect x="630" y="52" width="500" height="212" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="880" y="84" text-anchor="middle" class="lbl">Trajectory assertions</text>
      <text x="880" y="120" text-anchor="middle" class="bxs">did it get there properly?</text>
      <text x="656" y="158" class="bds">&bull; it read the policy before recommending</text>
      <text x="656" y="188" class="bds">&bull; it took 3 steps, not 9</text>
      <text x="656" y="218" class="bds">&bull; it never called release_payment at all</text>
      <text x="880" y="250" text-anchor="middle" class="bds ok">only possible if you kept the trace</text>

      <rect x="120" y="292" width="940" height="116" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="590" y="324" text-anchor="middle" class="bx no">The run that passes every outcome assertion</text>
      <text x="590" y="356" text-anchor="middle" class="bd">It called <tspan font-weight="600">release_payment</tspan>, the gate refused it, it apologised, and it recommended a hold.</text>
      <text x="590" y="384" text-anchor="middle" class="bd">Right answer. Nothing released. Every outcome assertion green &mdash; and it tried.</text>
      <text x="590" y="402" text-anchor="middle" class="bds no">You will never see it without a trajectory assertion, and it is the one you needed to see.</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Assertions" data-notes="The composition of the eval set. Most teams have only the first column, which is why their pass rate is high and their incidents are surprising. The third column is the one that grows after every incident -- that is the healthy pattern, and it is how the set earns its keep over years.">
  <h2>Three kinds of case, and only one of them is comfortable</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Representative, edge and adversarial cases in an eval set">
      <rect x="50" y="56" width="345" height="216" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="222" y="88" text-anchor="middle" class="lbl ok">Representative</text>
      <text x="222" y="124" text-anchor="middle" class="bxs">the traffic you expect</text>
      <text x="222" y="162" text-anchor="middle" class="bds">a failed payment, a known</text>
      <text x="222" y="184" text-anchor="middle" class="bds">reason code, a clear policy</text>
      <text x="222" y="222" text-anchor="middle" class="bd">tells you it works</text>
      <text x="222" y="252" text-anchor="middle" class="bds no">and almost nothing else</text>

      <rect x="418" y="56" width="345" height="216" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="88" text-anchor="middle" class="lbl am">Edge</text>
      <text x="590" y="124" text-anchor="middle" class="bxs">real, rare, and awkward</text>
      <text x="590" y="162" text-anchor="middle" class="bds">a reason code with no policy,</text>
      <text x="590" y="184" text-anchor="middle" class="bds">a payment that settled while</text>
      <text x="590" y="206" text-anchor="middle" class="bds">the agent was thinking</text>
      <text x="590" y="240" text-anchor="middle" class="bd am">tells you what it does</text>
      <text x="590" y="262" text-anchor="middle" class="bds am">when it does not know</text>

      <rect x="786" y="56" width="345" height="216" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="958" y="88" text-anchor="middle" class="lbl no">Adversarial</text>
      <text x="958" y="124" text-anchor="middle" class="bxs">someone is trying</text>
      <text x="958" y="162" text-anchor="middle" class="bds">an instruction in a narrative</text>
      <text x="958" y="184" text-anchor="middle" class="bds">field, a poisoned chunk,</text>
      <text x="958" y="206" text-anchor="middle" class="bds">a tool result that lies</text>
      <text x="958" y="240" text-anchor="middle" class="bd no">tells you what it does</text>
      <text x="958" y="262" text-anchor="middle" class="bds no">when it is attacked</text>

      <rect x="150" y="300" width="880" height="108" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="332" text-anchor="middle" class="bxs am">Every incident becomes a case, permanently</text>
      <text x="590" y="364" text-anchor="middle" class="bd">That is the mechanism by which the same failure cannot happen twice &mdash; and it is</text>
      <text x="590" y="390" text-anchor="middle" class="bd">the only part of this that gets more valuable the longer the system runs.</text>
    </svg>
  </div>
</div>

<div class="slide div" data-sec="Traces" data-notes="Part three. You cannot assert on a trajectory you did not record, so this is the enabling machinery for everything in part two.">

</div>

<div class="slide" data-sec="Traces" data-notes="The slide that redirects optimisation effort. Time and money are almost never in the same span: retrieval is slow and nearly free, generation is fast and expensive. A team that optimises the biggest number on the wrong axis works hard and saves nothing. Read the two arrows off the previous slide's numbers.">

<div class="slide" data-sec="Traces" data-notes="Attribution. Without a trace the only available diagnosis is 'the agent was wrong', which is not actionable and lands on whoever owns the agent. With one, you can name the step. Walk the ladder: it is a decision procedure they can apply to a failing case on Monday.">
  <h2>Which step actually caused it?</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="A decision ladder for attributing a failure to a step">
      <rect x="60" y="56" width="1060" height="52" rx="6" fill="#f8f8fd" stroke="#4338ca" stroke-width="2"/>
      <text x="86" y="88" class="bds"><tspan font-weight="700">1</tspan>&nbsp;&nbsp; Did the right evidence reach the agent? &nbsp;&mdash;&nbsp; if not, it is <tspan font-weight="600">retrieval</tspan>, and Module 6 is where you go</text>
      <rect x="60" y="120" width="1060" height="52" rx="6" fill="#f8f8fd" stroke="#4338ca" stroke-width="2"/>
      <text x="86" y="152" class="bds"><tspan font-weight="700">2</tspan>&nbsp;&nbsp; Did a tool return an error the agent ignored? &nbsp;&mdash;&nbsp; if so, it is the <tspan font-weight="600">tool contract</tspan> or the loop</text>
      <rect x="60" y="184" width="1060" height="52" rx="6" fill="#f8f8fd" stroke="#4338ca" stroke-width="2"/>
      <text x="86" y="216" class="bds"><tspan font-weight="700">3</tspan>&nbsp;&nbsp; Did the supervisor send it to the wrong specialist? &nbsp;&mdash;&nbsp; <tspan font-weight="600">routing</tspan>, and Lab 5.1 measures it</text>
      <rect x="60" y="248" width="1060" height="52" rx="6" fill="#f8f8fd" stroke="#4338ca" stroke-width="2"/>
      <text x="86" y="280" class="bds"><tspan font-weight="700">4</tspan>&nbsp;&nbsp; Did a handoff drop a constraint? &nbsp;&mdash;&nbsp; <tspan font-weight="600">the message</tspan>, and both agents were behaving correctly</text>
      <rect x="60" y="312" width="1060" height="52" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="86" y="344" class="bds am"><tspan font-weight="700">5</tspan>&nbsp;&nbsp; Only now: the evidence was there, complete, and the model still got it wrong &nbsp;&mdash;&nbsp; <tspan font-weight="600">generation</tspan></text>

      <text x="590" y="398" text-anchor="middle" class="bd no">Without a trace, every one of these is reported as &ldquo;the agent hallucinated&rdquo; &mdash; and four of the five are not.</text>
    </svg>
  </div>
</div>

<div class="slide div" data-sec="Scoring" data-notes="Part four. How a run becomes a number, and what it costs to get each kind.">
  <div class="k">Part four</div>
  <h1>Turning a run into a number</h1>
</div>

<div class="slide" data-sec="Scoring" data-notes="Three kinds of score with three different economics. The middle column is the one to be careful about: an LLM judge is broad and cheap and you now have two systems whose agreement with a human is unknown. Say plainly that a judge needs its own eval set, which is the recursion everyone discovers late.">
  <h2>Three ways to score, and what each one costs you</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Programmatic, model-judged and human scoring compared">
      <rect x="50" y="56" width="345" height="240" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="222" y="88" text-anchor="middle" class="lbl ok">Programmatic</text>
      <text x="222" y="124" text-anchor="middle" class="bxs">an assertion in code</text>
      <text x="222" y="162" text-anchor="middle" class="bds">free, instant, identical</text>
      <text x="222" y="184" text-anchor="middle" class="bds">every time, and auditable</text>
      <text x="222" y="222" text-anchor="middle" class="bd am">only fits narrow questions</text>
      <text x="222" y="252" text-anchor="middle" class="bds">&ldquo;did it release anything?&rdquo;</text>
      <text x="222" y="278" text-anchor="middle" class="bds ok">use wherever it fits at all</text>

      <rect x="418" y="56" width="345" height="240" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="88" text-anchor="middle" class="lbl am">Model-judged</text>
      <text x="590" y="124" text-anchor="middle" class="bxs">ask a model to grade it</text>
      <text x="590" y="162" text-anchor="middle" class="bds">handles judgement calls</text>
      <text x="590" y="184" text-anchor="middle" class="bds">a rule cannot express</text>
      <text x="590" y="222" text-anchor="middle" class="bd no">now you have two systems</text>
      <text x="590" y="252" text-anchor="middle" class="bds no">and the judge needs its own</text>
      <text x="590" y="274" text-anchor="middle" class="bds no">eval set, against humans</text>

      <rect x="786" y="56" width="345" height="240" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="958" y="88" text-anchor="middle" class="lbl">Human</text>
      <text x="958" y="124" text-anchor="middle" class="bxs">the ground truth</text>
      <text x="958" y="162" text-anchor="middle" class="bds">expensive, slow, and the</text>
      <text x="958" y="184" text-anchor="middle" class="bds">only thing the other two</text>
      <text x="958" y="206" text-anchor="middle" class="bds">are approximating</text>
      <text x="958" y="244" text-anchor="middle" class="bd">spend it on the cases that</text>
      <text x="958" y="266" text-anchor="middle" class="bd">calibrate the judge</text>

      <rect x="150" y="324" width="880" height="84" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="354" text-anchor="middle" class="bxs am">Reach for the left column first, every time</text>
      <text x="590" y="386" text-anchor="middle" class="bds">&ldquo;Did it call release_payment?&rdquo; is a line of code. &ldquo;Was the tone appropriate?&rdquo; is not.</text>
      <text x="590" y="404" text-anchor="middle" class="bds">Most teams reach for the judge first, and then cannot say how good the judge is.</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Scoring" data-notes="The operational discipline. An edit in place is an unmeasured deploy -- and the reason nobody can answer 'what changed?' after a regression. Note the last box: this is exactly how you already treat code, and nobody finds it controversial there.">
  <h2>A prompt is a deployed artifact, not a text box</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Editing a prompt in place versus versioning and rolling it out">
      <rect x="50" y="56" width="500" height="230" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="300" y="88" text-anchor="middle" class="lbl no">Edited in place</text>
      <text x="300" y="126" text-anchor="middle" class="bxs no">someone improved the wording</text>
      <text x="76" y="166" class="bd">&bull; no version, so no rollback</text>
      <text x="76" y="200" class="bd">&bull; no eval run, so no idea what it did</text>
      <text x="76" y="234" class="bd">&bull; no record of who, or when, or why</text>
      <text x="300" y="268" text-anchor="middle" class="bds no">&ldquo;it got worse last Tuesday&rdquo; is now unanswerable</text>

      <rect x="630" y="56" width="500" height="230" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="880" y="88" text-anchor="middle" class="lbl ok">Versioned and rolled out</text>
      <text x="880" y="126" text-anchor="middle" class="bxs ok">prompt v7 &rarr; eval &rarr; 10% &rarr; 100%</text>
      <text x="656" y="166" class="bd">&bull; every version has a score on the same set</text>
      <text x="656" y="200" class="bd">&bull; rollback is selecting the previous one</text>
      <text x="656" y="234" class="bd">&bull; the diff and the delta sit side by side</text>
      <text x="880" y="268" text-anchor="middle" class="bds ok">and a regression names its own cause</text>

      <rect x="150" y="312" width="880" height="96" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="590" y="344" text-anchor="middle" class="bxs am">This is how you already treat code, and nobody argues about it there</text>
      <text x="590" y="376" text-anchor="middle" class="bd">The prompt is the highest-leverage, least-governed file in the system: it changes behaviour</text>
      <text x="590" y="400" text-anchor="middle" class="bd">more than a model swap does, and in most teams it is edited by whoever noticed something.</text>
    </svg>
  </div>
</div>

<div class="slide" data-sec="Scoring" data-notes="Offline and online answer different questions and neither replaces the other. The offline set is a regression gate you own; traffic is the only thing that contains the cases you failed to imagine. The bottom line matters for a bank: A/B on real payments has a blast radius, so the gate comes first.">
  <h2>Your eval set and real traffic answer different questions</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Offline eval set compared with online A/B on real traffic">
      <rect x="50" y="56" width="500" height="240" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="300" y="88" text-anchor="middle" class="lbl">Offline, on your eval set</text>
      <text x="300" y="126" text-anchor="middle" class="bxs">&ldquo;did I break anything I knew about?&rdquo;</text>
      <text x="76" y="166" class="bd">&bull; runs before deploy, costs nothing but tokens</text>
      <text x="76" y="200" class="bd">&bull; deterministic set, comparable across versions</text>
      <text x="76" y="234" class="bd">&bull; catches regressions, which is most of the value</text>
      <text x="300" y="272" text-anchor="middle" class="bds no">blind to every case you did not think of</text>

      <rect x="630" y="56" width="500" height="240" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="880" y="88" text-anchor="middle" class="lbl am">Online, on real traffic</text>
      <text x="880" y="126" text-anchor="middle" class="bxs am">&ldquo;what happens on cases I never imagined?&rdquo;</text>
      <text x="656" y="166" class="bd">&bull; the only source of genuinely new cases</text>
      <text x="656" y="200" class="bd">&bull; needs volume before a difference is real</text>
      <text x="656" y="234" class="bd am">&bull; and the losing arm happens to actual customers</text>
      <text x="880" y="272" text-anchor="middle" class="bds am">so it goes behind the gate, never instead of it</text>

      <rect x="150" y="322" width="880" height="86" rx="6" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="590" y="354" text-anchor="middle" class="bxs ok">The loop that makes both worth having</text>
      <text x="590" y="386" text-anchor="middle" class="bd">traffic surfaces a failure &rarr; the failure becomes a case &rarr; the case joins the offline set forever</text>
      <text x="590" y="404" text-anchor="middle" class="bds">After a year the offline set is a record of everything that has ever gone wrong. That is the asset.</text>
    </svg>
  </div>
</div>

<div class="slide div" data-sec="Gates" data-notes="Part five, and the shortest. One idea, and it is the difference between a team that measures and a team that is governed by what it measures.">
  <div class="k">Part five</div>
  <h1>A number nobody blocks on</h1>
</div>

<div class="slide" data-sec="Gates" data-notes="Close the module here. A dashboard is a report; a gate is a decision that has already been made. The three thresholds on the right are the deliverable of Lab 7.5 -- and note the last line: a gate you routinely override is a report with extra steps, so agree the override path in advance.">
  <h2>A dashboard is a report. A gate is a decision.</h2>
  <div class="body">
    <svg width="1180" height="424" viewBox="0 0 1180 424" role="img" aria-label="Metrics as a dashboard compared with metrics as release gates">
      <rect x="50" y="56" width="500" height="228" rx="8" fill="#f8f8fd" stroke="#94a3b8" stroke-width="2"/>
      <text x="300" y="88" text-anchor="middle" class="lbl">As a report</text>
      <text x="300" y="126" text-anchor="middle" class="bxs">&ldquo;cost per case is up 40%&rdquo;</text>
      <text x="76" y="166" class="bd">&bull; someone sees it, eventually</text>
      <text x="76" y="200" class="bd">&bull; it competes with the roadmap</text>
      <text x="76" y="234" class="bd">&bull; it is a topic, not an outcome</text>
      <text x="300" y="266" text-anchor="middle" class="bds no">the deploy already happened</text>

      <rect x="630" y="56" width="500" height="228" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="880" y="88" text-anchor="middle" class="lbl ok">As a gate</text>
      <text x="880" y="126" text-anchor="middle" class="bxs ok">the build fails</text>
      <text x="656" y="166" class="bd">&bull; quality &ge; the current version, on the same set</text>
      <text x="656" y="200" class="bd">&bull; cost per case &le; an agreed ceiling</text>
      <text x="656" y="234" class="bd">&bull; p95 latency &le; an agreed ceiling</text>
      <text x="880" y="266" text-anchor="middle" class="bds ok">the deploy does not happen</text>

<div class="slide div" data-sec="Knowledge check" data-notes="Eight questions. Question 3 is the one that changes what they write on Monday; question 6 is the one senior people argue about, and the argument is worth having.">
  <div class="k">Knowledge check</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  stage.appendChild(document.getElementById('deck').content.cloneNode(true));
  var slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));
  var i = 0, total = slides.length;

  var num = document.getElementById('num'),
      progf = document.getElementById('progf'),
      secname = document.getElementById('secname'),
      toc = document.getElementById('toc'),
      toclist = document.getElementById('toclist'),
      notes = document.getElementById('notes'),
      notesbody = document.getElementById('notesbody');

  /* ---- build the index, grouped by section ---- */
  var groups = [], last = null;
  slides.forEach(function(s, n){
    var sec = s.getAttribute('data-sec') || '';
    if (sec !== last) { groups.push({sec: sec, items: []}); last = sec; }
    var h = s.querySelector('h2, h1'), q = s.querySelector('.qtag');
    var t = h ? h.textContent.trim() : sec;
    if (q) t = q.textContent.trim() + ' \u2014 ' + t;
    groups[groups.length-1].items.push({n: n, t: t});
  });
  groups.forEach(function(g){
    var d = document.createElement('div'); d.className = 'grp';
    var hd = document.createElement('div'); hd.className = 'grph'; hd.textContent = g.sec; d.appendChild(hd);
    g.items.forEach(function(it){
      var a = document.createElement('a');
      a.href = '#'; a.dataset.n = it.n;
      a.innerHTML = '<span class="n">' + (it.n + 1) + '</span>';
      a.appendChild(document.createTextNode(it.t));
      a.addEventListener('click', function(e){ e.preventDefault(); go(it.n); toc.classList.remove('on'); });
      d.appendChild(a);
    });
    toclist.appendChild(d);
  });
  var tocLinks = Array.prototype.slice.call(toclist.querySelectorAll('a'));

  function go(n){
    if (n < 0) n = 0;
    if (n > total - 1) n = total - 1;
    slides[i].classList.remove('active');
    i = n;
    slides[i].classList.add('active');
    num.textContent = (i + 1) + ' / ' + total;
    progf.style.width = ((i + 1) / total * 100) + '%';
    secname.textContent = slides[i].getAttribute('data-sec') || '';
    notesbody.textContent = slides[i].getAttribute('data-notes') || 'No notes for this slide.';
    tocLinks.forEach(function(a){ a.classList.toggle('cur', +a.dataset.n === i); });
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  /* ---- scale the 1280x720 stage to the available space ---- */
  function fit(){
    var w = document.getElementById('wrap');
    var s = Math.min(w.clientWidth / 1280, w.clientHeight / 720);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){
    var n = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(n) && n - 1 !== i) go(n - 1);
  });

  document.getElementById('bnext').addEventListener('click', function(){ go(i + 1); });
  document.getElementById('bprev').addEventListener('click', function(){ go(i - 1); });
  document.getElementById('btoc').addEventListener('click', function(){ toc.classList.toggle('on'); });
  document.getElementById('bnotes').addEventListener('click', function(){ notes.classList.toggle('on'); });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(i - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(total - 1); }
    else if (k === 't' || k === 'T') { toc.classList.toggle('on'); }
    else if (k === 'n' || k === 'N') { notes.classList.toggle('on'); }
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if (k === 'Escape') { toc.classList.remove('on'); notes.classList.remove('on'); }
  });

  fit();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(isNaN(start) ? 0 : start - 1);
})();
</script>
