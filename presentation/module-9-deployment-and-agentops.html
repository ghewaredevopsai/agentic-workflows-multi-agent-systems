<div class="slide title" data-sec="Title" data-notes="Ten slides, and every one of them is about the app they have in front of them -- FrontDesk AI -- not about Kubernetes in general. Say that up front: they have spent two days reading this codebase, and today it becomes a running service in their own namespace. The through-line is that this pod has state and no internet, and those two facts decide almost every manifest choice they are about to make. One lab at the end, and it deploys the real thing.">
  <h1>Deployment &amp; AgentOps</h1>
  <div class="sub">Module 9 &middot; Day 3 &mdash; Evaluation, Safety &amp; AgentOps</div>
  <div class="rule"></div>
  <div class="meta">
    Putting FrontDesk AI on Kubernetes &mdash; the app you have been reading all week<br>
    Agentic Workflows &amp; Multi-Agent Systems &middot; Trainer: Rajesh Gheware
  </div>
</div>

<div class="slide" data-sec="The app" data-notes="Slide one: orient them in the codebase before a single manifest. Walk the left column as a tour of files they have already opened. The right column is the part that matters for deployment, and the last line is the whole module: this pod has state. Land the two-models point clearly -- the CHAT model is a URL and a key, and lives outside the pod, while the EMBEDDING model is baked into the image at /opt/appcache. That distinction comes back as the trap on slide seven, so plant it here.">
  <h2>What you are deploying: one image, several parts</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="The components inside the FrontDesk AI container, and what each one means for the deployment">
      <rect x="22" y="8" width="560" height="384" rx="8" fill="#f5f3ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="302" y="40" text-anchor="middle" class="lbl">Inside the container</text>
      <text x="42" y="82" class="bd">&bull; <tspan class="mn">app.py</tspan> &mdash; FastAPI. Login, <tspan class="mn">/chat</tspan>, <tspan class="mn">/health</tspan>,</text>
      <text x="56" y="106" class="bd"><tspan class="mn">/metrics</tspan>, and the admin pages</text>
      <text x="42" y="146" class="bd">&bull; <tspan class="mn">agents.py</tspan> &mdash; the LangGraph graph: a supervisor,</text>
      <text x="56" y="170" class="bd">eight workers, QA, a manager, a fallback</text>
      <text x="42" y="210" class="bd">&bull; <tspan class="mn">tools.py</tspan> and <tspan class="mn">skills.py</tspan> &mdash; what a worker can</text>
      <text x="56" y="234" class="bd">actually do: leave, tickets, expenses, rooms</text>
      <text x="42" y="274" class="bd">&bull; <tspan class="mn">rag.py</tspan> and <tspan class="mn">fewshot.py</tspan> &mdash; two Chroma</text>
      <text x="56" y="298" class="bd">collections: the policies, and answers people liked</text>
      <text x="42" y="338" class="bd">&bull; <tspan class="mn">observability.py</tspan> &mdash; metrics, JSON logs,</text>
      <text x="56" y="362" class="bd">spans and Langfuse, all from one place</text>
      <rect x="598" y="8" width="560" height="384" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="878" y="40" text-anchor="middle" class="lbl ok">What that means for the deployment</text>
      <text x="618" y="82" class="bd">&bull; One process, one port &mdash; <tspan class="mn">8000</tspan>. Nothing else in</text>
      <text x="632" y="106" class="bd">the pod listens for anything</text>
      <text x="618" y="146" class="bd">&bull; The <tspan font-weight="700">chat</tspan> model is not in the image. It is a URL</text>
      <text x="632" y="170" class="bd">and a key the pod reads from a Secret</text>
      <text x="618" y="210" class="bd">&bull; The <tspan font-weight="700">embedding</tspan> model <tspan font-style="italic">is</tspan> in the image, baked</text>
      <text x="632" y="234" class="bd">into <tspan class="mn">/opt/appcache</tspan>. Retrieval needs no download</text>
      <text x="618" y="274" class="bd">&bull; Chroma and three SQLite files are files on a</text>
      <text x="632" y="298" class="bd">disk. There is no database server anywhere</text>
      <text x="618" y="338" class="bd">&bull; So this pod has <tspan font-weight="700">state</tspan> &mdash; and that one fact</text>
      <text x="632" y="362" class="bd">decides most of the Kubernetes on the next slides</text>
    </svg>
  </div>
  <div class="take"><b>Look:</b> <code>app/agents.py</code> has eighteen <code>add_node</code> calls. That list is the service you are about to deploy.</div>
</div>

<div class="slide" data-sec="One request" data-notes="Slide two: one employee question, all the way through. Use the real node names -- these are the strings in agents.py and the same strings that appear in the audit trail and in the span names, so they will see them again in Tempo. The confidence gate is worth a pause: below 5 it goes to clarify and no worker runs at all, which is a path people forget to test. The right column turns the graph into operator facts: four model calls and up to a minute of wall clock means one HTTP request holds a graph open for a long time, and that is why the Ingress carries a 300-second proxy timeout.">
  <h2>What one employee question actually runs</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="The path a chat request takes through the FrontDesk AI graph, and what it costs">
      <rect x="22" y="8" width="560" height="384" rx="8" fill="#f5f3ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="302" y="40" text-anchor="middle" class="lbl">The path through the graph</text>
      <text x="42" y="82" class="bd">&bull; <tspan class="mn">supervisor</tspan> picks a category and scores its</text>
      <text x="56" y="106" class="bd">own confidence in that choice</text>
      <text x="42" y="146" class="bd">&bull; Under 5, it goes to <tspan class="mn">clarify</tspan> and stops there.</text>
      <text x="56" y="170" class="bd">No worker runs, no tool is called</text>
      <text x="42" y="210" class="bd">&bull; HR, tech, finance and facilities go through</text>
      <text x="56" y="234" class="bd"><tspan class="mn">rag_retrieval</tspan>, then <tspan class="mn">fewshot_retrieval</tspan></text>
      <text x="42" y="274" class="bd">&bull; The worker then loops: think, call a tool, look</text>
      <text x="56" y="298" class="bd">at what came back &mdash; up to three times</text>
      <text x="42" y="338" class="bd">&bull; <tspan class="mn">escalation_check</tspan>, <tspan class="mn">manager</tspan>, <tspan class="mn">qa_check</tspan> (which</text>
      <text x="56" y="362" class="bd">can retry once), and finally <tspan class="mn">finalize</tspan></text>
      <rect x="598" y="8" width="560" height="384" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="878" y="40" text-anchor="middle" class="lbl ok">What that costs you as an operator</text>
      <text x="618" y="82" class="bd">&bull; About <tspan class="mn">4.25</tspan> model calls and <tspan class="mn">4,400</tspan> tokens for</text>
      <text x="632" y="106" class="bd">one employee question. Measured on this app</text>
      <text x="618" y="146" class="bd">&bull; End to end it took <tspan class="mn">21</tspan> to <tspan class="mn">57</tspan> seconds &mdash; so one</text>
      <text x="632" y="170" class="bd">HTTP request holds the graph open that long</text>
      <text x="618" y="210" class="bd">&bull; Which is why the Ingress carries a <tspan class="mn">300</tspan>-second</text>
      <text x="632" y="234" class="bd">read timeout instead of the default</text>
      <text x="618" y="274" class="bd">&bull; <tspan class="mn">analytics</tspan>, <tspan class="mn">account</tspan> and <tspan class="mn">skill_admin</tspan> skip</text>
      <text x="632" y="298" class="bd">retrieval entirely and go straight to a worker</text>
      <text x="618" y="338" class="bd">&bull; Every reply carries its audit trail: category,</text>
      <text x="632" y="362" class="bd">confidence, the tools that ran, what QA changed</text>
    </svg>
  </div>
  <div class="take"><b>Ask it:</b> &ldquo;how much leave do I have left&rdquo; &mdash; then read the audit trail under the answer. That is the left-hand column, printed.</div>
</div>

<div class="slide" data-sec="Dependencies" data-notes="Slide three draws the boundary of the pod. The left column is everything it calls out to, and every one of them is a Service inside this cluster -- not a vendor on the internet. The right column is the deliberate absences, and they are what make the app deployable into a locked-down namespace at all. Two lines to land hard: SQLite on the volume IS the database, so there is no second workload to run; and an unreachable Tempo costs you the spans and nothing else, which sounds reassuring and is actually the failure mode on slide nine.">
  <h2>What the pod needs from outside itself</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="The four dependencies FrontDesk AI reaches for, and the four it deliberately does not have">
      <rect x="22" y="8" width="560" height="384" rx="8" fill="#f5f3ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="302" y="40" text-anchor="middle" class="lbl">Four things it reaches for</text>
      <text x="42" y="82" class="bd">&bull; The <tspan font-weight="700">model</tspan> &mdash; an OpenAI-compatible LiteLLM</text>
      <text x="56" y="106" class="bd">gateway, in namespace <tspan class="mn">llm-serving</tspan></text>
      <text x="42" y="146" class="bd">&bull; <tspan font-weight="700">Tempo</tspan>, in <tspan class="mn">monitoring</tspan> on <tspan class="mn">4317</tspan> &mdash; one span</text>
      <text x="56" y="170" class="bd">tree per request, with a child per agent</text>
      <text x="42" y="210" class="bd">&bull; <tspan font-weight="700">Langfuse</tspan> &mdash; your own project, holding the</text>
      <text x="56" y="234" class="bd">prompts and the replies themselves</text>
      <text x="42" y="274" class="bd">&bull; <tspan font-weight="700">A volume at</tspan> <tspan class="mn">/shared</tspan> &mdash; three SQLite files,</text>
      <text x="56" y="298" class="bd">two Chroma collections, and installed skills</text>
      <text x="42" y="338" class="bd">&bull; And an MCP server for leave balances, wherever</text>
      <text x="56" y="362" class="bd">one has been deployed for it</text>
      <rect x="598" y="8" width="560" height="384" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="878" y="40" text-anchor="middle" class="lbl ok">And four it deliberately does without</text>
      <text x="618" y="82" class="bd">&bull; No PyPI, no Hugging Face, no model vendor.</text>
      <text x="632" y="106" class="bd">Nothing is downloaded at startup</text>
      <text x="618" y="146" class="bd">&bull; No database server. SQLite on that volume</text>
      <text x="632" y="170" class="bd"><tspan font-style="italic">is</tspan> the database</text>
      <text x="618" y="210" class="bd">&bull; No second vendor to fail over to &mdash; the fallback</text>
      <text x="632" y="234" class="bd">model is left empty here, on purpose</text>
      <text x="618" y="274" class="bd">&bull; No sidecar, no queue, no cache. One container</text>
      <text x="632" y="298" class="bd">is the entire runtime</text>
      <text x="618" y="338" class="bd">&bull; An unreachable Tempo does not stop the app.</text>
      <text x="632" y="362" class="bd">The spans simply vanish &mdash; hold that thought</text>
    </svg>
  </div>
  <div class="take"><b>Rule of thumb:</b> everything it needs by name is a Service in this cluster. Everything else was baked into the image.</div>
</div>

<div class="slide" data-sec="Five objects" data-notes="Slide four is the manifest inventory, and it is deliberately short: five objects, and they are written for them in the lab. Spend the time on the right column instead. The point to make is that a credential is never typed into a manifest and never copied out of a Secret -- all four sources arrive by envFrom, by reference, and the pod resolves them at start. Note that the Langfuse Secret is optional, so skipping it gives a working app with no tracing rather than a pod that will not start. And the last line is the one people get caught by: a running pod does not notice a changed ConfigMap.">
  <h2>Five Kubernetes objects, and where the credentials go</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="The five objects that deploy FrontDesk AI and the three Secrets it reads">
      <rect x="22" y="8" width="560" height="384" rx="8" fill="#f5f3ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="302" y="40" text-anchor="middle" class="lbl">The five objects</text>
      <text x="42" y="82" class="bd">&bull; <tspan font-weight="700">ConfigMap</tspan> &mdash; which provider, which model, where</text>
      <text x="56" y="106" class="bd">the spans go. Never a credential</text>
      <text x="42" y="146" class="bd">&bull; <tspan font-weight="700">PersistentVolumeClaim</tspan> &mdash; <tspan class="mn">1Gi</tspan>, mounted at</text>
      <text x="56" y="170" class="bd"><tspan class="mn">/shared</tspan>, where all the state lives</text>
      <text x="42" y="210" class="bd">&bull; <tspan font-weight="700">Deployment</tspan> &mdash; one replica, the image, both</text>
      <text x="56" y="234" class="bd">probes, requests and limits, and <tspan class="mn">envFrom</tspan></text>
      <text x="42" y="274" class="bd">&bull; <tspan font-weight="700">Service</tspan> &mdash; a stable name inside the cluster,</text>
      <text x="56" y="298" class="bd">port <tspan class="mn">80</tspan> to the container's <tspan class="mn">8000</tspan></text>
      <text x="42" y="338" class="bd">&bull; <tspan font-weight="700">Ingress</tspan> &mdash; claims your public hostname and</text>
      <text x="56" y="362" class="bd">sends it to that Service</text>
      <rect x="598" y="8" width="560" height="384" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="878" y="40" text-anchor="middle" class="lbl ok">Three Secrets, none of them typed twice</text>
      <text x="618" y="82" class="bd">&bull; <tspan class="mn">&lt;your-ns&gt;-llm</tspan> &mdash; the gateway URL, the model and</text>
      <text x="632" y="106" class="bd">your own daily-capped key. Published for you</text>
      <text x="618" y="146" class="bd">&bull; <tspan class="mn">frontdeskai-secret</tspan> &mdash; the signing key and the</text>
      <text x="632" y="170" class="bd">first-login password. Created by the script</text>
      <text x="618" y="210" class="bd">&bull; <tspan class="mn">frontdeskai-langfuse</tspan> &mdash; built from your own</text>
      <text x="632" y="234" class="bd"><tspan class="mn">.env</tspan>, and marked <tspan class="mn">optional</tspan>: skip it and it still runs</text>
      <text x="618" y="274" class="bd">&bull; All four sources arrive by <tspan class="mn">envFrom</tspan>. You never</text>
      <text x="632" y="298" class="bd">copy a value out of one into a manifest</text>
      <text x="618" y="338" class="bd">&bull; A running pod does <tspan font-style="italic">not</tspan> notice a changed</text>
      <text x="632" y="362" class="bd">ConfigMap. That is why the script restarts it</text>
    </svg>
  </div>
  <div class="take"><b>The split:</b> if it would be embarrassing in a screenshot, it belongs in a Secret. Everything else is the ConfigMap.</div>
</div>

<div class="slide" data-sec="The namespace" data-notes="Slide five is the one that surprises people, so give it time. The namespace they deploy into is NOT the sandbox their notebook runs in -- that one has general internet access and this one has almost none. Read the quota numbers out loud: zero NodePorts is not 'a few', it is zero, and that single number removes a choice on the next slide. The arm64 line matters because an amd64-only image does not fail at runtime, it fails to pull. And the last two lines are the ones that will waste their afternoon if they do not hear them now: Cloudflare answers a plain script with 1010, and a slow request comes back as a 524 that looks exactly like a crashed app.">
  <h2>The namespace you deploy into is not the one you code in</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="What a participant namespace grants and what it blocks">
      <rect x="22" y="8" width="560" height="384" rx="8" fill="#f5f3ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="302" y="40" text-anchor="middle" class="lbl">What it grants you</text>
      <text x="42" y="82" class="bd">&bull; <tspan class="mn">2Gi</tspan> of memory limits for the <tspan font-style="italic">whole</tspan> namespace.</text>
      <text x="56" y="106" class="bd">This app alone asks for <tspan class="mn">1Gi</tspan> of it</text>
      <text x="42" y="146" class="bd">&bull; <tspan class="mn">services.nodeports: 0</tspan> and</text>
      <text x="56" y="170" class="bd"><tspan class="mn">services.loadbalancers: 0</tspan>. Not a few &mdash; zero</text>
      <text x="42" y="210" class="bd">&bull; Eight pods, four services, four volume claims,</text>
      <text x="56" y="234" class="bd">and <tspan class="mn">10Gi</tspan> of storage in total</text>
      <text x="42" y="274" class="bd">&bull; The nodes are <tspan font-weight="700">arm64</tspan>. An amd64-only image does</text>
      <text x="56" y="298" class="bd">not fail at runtime &mdash; it fails to pull</text>
      <text x="42" y="338" class="bd">&bull; One public hostname, already pointed at you and</text>
      <text x="56" y="362" class="bd">waiting for something to claim it</text>
      <rect x="598" y="8" width="560" height="384" rx="8" fill="#fef4f4" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="878" y="40" text-anchor="middle" class="lbl no">What it blocks</text>
      <text x="618" y="82" class="bd">&bull; Egress reaches four things: DNS, the LLM gateway,</text>
      <text x="632" y="106" class="bd">ingress-nginx, and telemetry</text>
      <text x="618" y="146" class="bd">&bull; Nothing else on the internet. No <tspan class="mn">pip install</tspan>,</text>
      <text x="632" y="170" class="bd">no model download, no vendor API</text>
      <text x="618" y="210" class="bd">&bull; Your notebook sandbox <tspan font-style="italic">does</tspan> have internet. This</text>
      <text x="632" y="234" class="bd">namespace does not. They are different places</text>
      <text x="618" y="274" class="bd">&bull; Cloudflare sits in front of the hostname: a plain</text>
      <text x="632" y="298" class="bd">script gets <tspan class="mn">403</tspan> and <tspan class="mn">error code: 1010</tspan></text>
      <text x="618" y="338" class="bd">&bull; And a request over about <tspan class="mn">100s</tspan> comes back as a</text>
      <text x="632" y="362" class="bd"><tspan class="mn">524</tspan>, which reads exactly like a crashed app</text>
    </svg>
  </div>
  <div class="take"><b>Read them as answers:</b> every limit on this slide removes a decision you would otherwise have to make on the next one.</div>
</div>

<div class="slide" data-sec="Four decisions" data-notes="Slide six is the payoff of slide five: four manifest decisions, each forced by a number they have just seen. Do not let Recreate be remembered as a quota workaround -- the real reason is the ReadWriteOnce volume: a RollingUpdate starts the new pod before stopping the old one, both mount the same volume, and two processes writing one SQLite file is how a database gets corrupted. Then spend the rest of the slide on the trap, because it is the one that costs an hour. Setting HOME to /shared looks tidy and sends chromadb looking for a model it must download. Say the history out loud: until 2026-09-11 this namespace had no internet egress and this mistake crash-looped the pod, which is loud and easy. Egress was opened on 11 Sep so the app could reach Langfuse Cloud and the skill installer could research -- and the same mistake now succeeds, measured at 79 MB and 18.2 s on every pod start plus 167 MB on a 1 Gi volume, with every manifest valid and both probes green. That is the better lesson: the bug did not change, only how long it takes you to notice it.">
  <h2>Four decisions those limits make for you</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="Four manifest decisions forced by the namespace, and the HOME trap">
      <rect x="22" y="8" width="560" height="384" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="302" y="40" text-anchor="middle" class="lbl ok">The decision, and the fact that forces it</text>
      <text x="42" y="82" class="bd">&bull; Strategy &rarr; <tspan font-weight="700">Recreate</tspan>. One ReadWriteOnce volume,</text>
      <text x="56" y="106" class="bd">and two processes must not write one SQLite file</text>
      <text x="42" y="146" class="bd">&bull; Service &rarr; <tspan font-weight="700">ClusterIP</tspan>. Zero NodePorts and zero</text>
      <text x="56" y="170" class="bd">LoadBalancers leave exactly one way in</text>
      <text x="42" y="210" class="bd">&bull; Provider &rarr; <tspan font-weight="700">litellm</tspan>. Groq, Ollama and OpenRouter</text>
      <text x="56" y="234" class="bd">all call a vendor over the internet</text>
      <text x="42" y="274" class="bd">&bull; Credential &rarr; the <tspan font-weight="700">gateway Secret</tspan>, by reference.</text>
      <text x="56" y="298" class="bd">Nothing is pasted into a manifest</text>
      <text x="42" y="338" class="bd">&bull; In the lab you answer all four <tspan font-style="italic">before</tspan> a single</text>
      <text x="56" y="362" class="bd">object is applied to anything</text>
      <rect x="598" y="8" width="560" height="384" rx="8" fill="#fef4f4" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="878" y="40" text-anchor="middle" class="lbl no">And one trap that looks like housekeeping</text>
      <text x="618" y="82" class="bd">&bull; <tspan class="mn">HOME</tspan> is deliberately not set anywhere in the</text>
      <text x="632" y="106" class="bd">ConfigMap, and that is not an oversight</text>
      <text x="618" y="146" class="bd">&bull; The image points it at <tspan class="mn">/opt/appcache</tspan>, which is</text>
      <text x="632" y="170" class="bd">where the embedding model was baked in</text>
      <text x="618" y="210" class="bd">&bull; <tspan class="mn">/shared</tspan> is a very tempting <tspan class="mn">HOME</tspan> &mdash; it is the</text>
      <text x="632" y="234" class="bd">volume you already mount, and it persists</text>
      <text x="618" y="274" class="bd">&bull; Set it, and Chroma goes looking for a model it</text>
      <text x="632" y="298" class="bd">now has to download &mdash; 79 MB, every pod</text>
      <text x="618" y="338" class="bd">&bull; Nothing fails. 18 s added to each start and</text>
      <text x="632" y="362" class="bd">167 MB on a 1 Gi volume &mdash; every manifest valid</text>
    </svg>
  </div>
  <div class="take"><b>Opening egress did not fix this mistake &mdash; it hid it.</b> It used to crash-loop. Now it just quietly costs you 18 s and 167 MB, with every probe green.</div>
</div>

<div class="slide" data-sec="Staying up" data-notes="Slide seven: what keeps it running, and what survives when it does not. The two probes hit the same endpoint here, and that is worth naming as a choice rather than a rule -- readiness asks should I send traffic, liveness asks should I restart you, and pointing both at /health means a slow dependency can get you restarted rather than just drained. The initial delay has to cover startup indexing or the pod restarts forever while being perfectly healthy. On the right, the important line is the first: everything that matters is under /shared, so a restart loses nothing, and that is exactly what makes one replica acceptable.">
  <h2>Probes, restarts, and the state on the volume</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="The probes Kubernetes runs against FrontDesk AI and what survives a restart">
      <rect x="22" y="8" width="560" height="384" rx="8" fill="#f5f3ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="302" y="40" text-anchor="middle" class="lbl">What Kubernetes keeps asking</text>
      <text x="42" y="82" class="bd">&bull; Readiness hits <tspan class="mn">/health</tspan> after 15s, every 10s &mdash;</text>
      <text x="56" y="106" class="bd"><tspan font-style="italic">should I send this pod traffic?</tspan></text>
      <text x="42" y="146" class="bd">&bull; Liveness hits <tspan class="mn">/health</tspan> after 30s, every 30s &mdash;</text>
      <text x="56" y="170" class="bd"><tspan font-style="italic">should I kill and restart it?</tspan></text>
      <text x="42" y="210" class="bd">&bull; Both use the same endpoint here. That is a</text>
      <text x="56" y="234" class="bd">choice, not a rule &mdash; and it has a cost</text>
      <text x="42" y="274" class="bd">&bull; The initial delay must cover startup indexing,</text>
      <text x="56" y="298" class="bd">or a healthy pod restarts forever</text>
      <text x="42" y="338" class="bd">&bull; Requests <tspan class="mn">256Mi</tspan> / <tspan class="mn">200m</tspan>, limits <tspan class="mn">1Gi</tspan> / <tspan class="mn">500m</tspan>.</text>
      <text x="56" y="362" class="bd">Chroma and the embedding model are the bulk</text>
      <rect x="598" y="8" width="560" height="384" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="878" y="40" text-anchor="middle" class="lbl ok">What survives, and what does not</text>
      <text x="618" y="82" class="bd">&bull; Everything under <tspan class="mn">/shared</tspan>: users, tickets,</text>
      <text x="632" y="106" class="bd">installed skills, and both Chroma collections</text>
      <text x="618" y="146" class="bd">&bull; Nothing in the container filesystem. A restart</text>
      <text x="632" y="170" class="bd">is a clean image again, every time</text>
      <text x="618" y="210" class="bd">&bull; Which is what makes one replica acceptable here,</text>
      <text x="632" y="234" class="bd">and a short outage on each deploy tolerable</text>
      <text x="618" y="274" class="bd">&bull; <tspan class="mn">imagePullPolicy: Always</tspan> on a <tspan class="mn">latest</tspan> tag: a</text>
      <text x="632" y="298" class="bd">restart can quietly change the version you run</text>
      <text x="618" y="338" class="bd">&bull; A rollout that hangs with no useful message is</text>
      <text x="632" y="362" class="bd">usually the quota, not the app</text>
    </svg>
  </div>
  <div class="take"><b>Try it:</b> delete the pod, wait for the new one, and ask it about the conversation you had before it died.</div>
</div>

<div class="slide" data-sec="Telemetry" data-notes="Slide eight: the app already instruments itself, so the job is knowing where to look and how it goes quiet. Left column, the three streams -- Prometheus scrapes because the POD carries the label app=frontdeskai, which is one fewer thing a participant has to get right; the spans are a tree, one chat.send per request with a child per agent; and OTEL_SERVICE_NAME carries their namespace so thirty-one people share one Tempo and still find their own traces. Right column is the real content: every one of these fails silently. An empty OTLP endpoint disables the exporter cleanly, a wrong one drops every span because the batch exporter swallows export errors, and a misspelled Langfuse host turns tracing off with no message anywhere.">
  <h2>Once it is up, it is already telling you things</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="The telemetry FrontDesk AI emits, and the ways each stream goes silent">
      <rect x="22" y="8" width="560" height="384" rx="8" fill="#f5f3ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="302" y="40" text-anchor="middle" class="lbl">Three streams, wired before you arrive</text>
      <text x="42" y="82" class="bd">&bull; <tspan class="mn">/metrics</tspan> on port 8000, scraped because the pod</text>
      <text x="56" y="106" class="bd">carries the label <tspan class="mn">app=frontdeskai</tspan></text>
      <text x="42" y="146" class="bd">&bull; <tspan class="mn">frontdeskai_request_duration_seconds</tspan>, plus</text>
      <text x="56" y="170" class="bd">tokens, escalations, fallbacks and agent errors</text>
      <text x="42" y="210" class="bd">&bull; Spans: one <tspan class="mn">chat.send</tspan> per request, with an</text>
      <text x="56" y="234" class="bd"><tspan class="mn">llm.&lt;agent&gt;</tspan> child for every step it took</text>
      <text x="42" y="274" class="bd">&bull; The service name carries your namespace, so you</text>
      <text x="56" y="298" class="bd">find your own traces in a shared Tempo</text>
      <text x="42" y="338" class="bd">&bull; JSON logs on stdout, collected into Loki and</text>
      <text x="56" y="362" class="bd">labelled with the agent that wrote each line</text>
      <rect x="598" y="8" width="560" height="384" rx="8" fill="#fef4f4" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="878" y="40" text-anchor="middle" class="lbl no">And every one can go quiet without saying so</text>
      <text x="618" y="82" class="bd">&bull; An <tspan font-weight="700">empty</tspan> OTLP endpoint disables the exporter</text>
      <text x="632" y="106" class="bd">cleanly. Set it empty rather than wrong</text>
      <text x="618" y="146" class="bd">&bull; A <tspan font-weight="700">wrong</tspan> one drops every span &mdash; the batch</text>
      <text x="632" y="170" class="bd">exporter swallows the export failure</text>
      <text x="618" y="210" class="bd">&bull; Langfuse reads <tspan class="mn">LANGFUSE_HOST</tspan>; the SDK docs say</text>
      <text x="632" y="234" class="bd"><tspan class="mn">BASE_URL</tspan>. A third spelling and tracing is simply off</text>
      <text x="618" y="274" class="bd">&bull; Langfuse keys are region-bound. The wrong region</text>
      <text x="632" y="298" class="bd">is a <tspan class="mn">401</tspan> you will never see in the pod</text>
      <text x="618" y="338" class="bd">&bull; A perfectly healthy app that emits nothing is</text>
      <text x="632" y="362" class="bd">this module's normal failure. Check, do not assume</text>
    </svg>
  </div>
  <div class="take"><b>Look:</b> Grafana &rarr; Explore &rarr; Tempo, and search for the service named after your own namespace.</div>
</div>

<div class="slide" data-sec="To the lab" data-notes="Last slide: send them to the bench. Three commands, and the deploy script takes no arguments because APP_NAMESPACE and APP_HOST are already exported in their sandbox shell. Say clearly that skipping the .env is fine -- they get a working app with no LLM tracing, and the script prints exactly what to add. The lab grades the design offline before anything is applied, which is the module's own rule: a graded cell never needs a cluster. Then it applies, waits for the rollout, asks /health, and asks the service a real question -- supervisor, RAG, a tool-calling worker and QA, all behind one HTTP request. Encourage the deliberate break at the end; finding the crash-loop from the logs is the part they will remember.">
  <h2>One lab, and it ends with a real deployment</h2>
  <div class="body">
    <svg width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="The three commands that deploy the app and what the lab asks of you">
      <rect x="22" y="8" width="560" height="384" rx="8" fill="#f5f3ff" stroke="#4338ca" stroke-width="2.5"/>
      <text x="302" y="40" text-anchor="middle" class="lbl">Three commands, in a terminal</text>
      <text x="42" y="82" class="bd">&bull; Clone the app you have been reading:</text>
      <text x="56" y="106" class="bd"><tspan class="mn">git clone &hellip;/aiagentic-comp-frontdeskai.git</tspan></text>
      <text x="42" y="146" class="bd">&bull; <tspan class="mn">cp .env.example .env</tspan>, then fill in your own</text>
      <text x="56" y="170" class="bd">three Langfuse values</text>
      <text x="42" y="210" class="bd">&bull; <tspan class="mn">bash scripts/deploy-spark.sh</tspan> &mdash; and it takes</text>
      <text x="56" y="234" class="bd">no arguments at all</text>
      <text x="42" y="274" class="bd">&bull; Your namespace and your hostname are already</text>
      <text x="56" y="298" class="bd">exported in that shell. It reads them</text>
      <text x="42" y="338" class="bd">&bull; Skip the <tspan class="mn">.env</tspan> and it still deploys. You get no</text>
      <text x="56" y="362" class="bd">tracing, and it prints exactly what to add</text>
      <rect x="598" y="8" width="560" height="384" rx="8" fill="#f0fdf9" stroke="#0d9488" stroke-width="2.5"/>
      <text x="878" y="40" text-anchor="middle" class="lbl ok">What the lab asks of you</text>
      <text x="618" y="82" class="bd">&bull; Build the five objects and answer the four</text>
      <text x="632" y="106" class="bd">decisions &mdash; all graded before anything is applied</text>
      <text x="618" y="146" class="bd">&bull; Then compare your answers against the manifests</text>
      <text x="632" y="170" class="bd">the script really applies, and see where they differ</text>
      <text x="618" y="210" class="bd">&bull; Apply, wait out the rollout, and ask <tspan class="mn">/health</tspan></text>
      <text x="632" y="234" class="bd">from inside the cluster</text>
      <text x="618" y="274" class="bd">&bull; Ask the service a real question and watch one</text>
      <text x="632" y="298" class="bd">request drive supervisor, RAG, a tool and QA</text>
      <text x="618" y="338" class="bd">&bull; Then read your own trace back out of Tempo and</text>
      <text x="632" y="362" class="bd">name the step that took the longest</text>
    </svg>
  </div>
  <div class="take"><b>Your turn:</b> break it deliberately &mdash; point <code>HOME</code> at <code>/shared</code>, watch the crash-loop, and find the cause from the logs alone.</div>
</div>
</template>

<script>
(function(){
  var stage = document.getElementById('stage');
  stage.appendChild(document.getElementById('deck').content.cloneNode(true));
  var slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));
  var i = 0, total = slides.length;

  var num = document.getElementById('num'),
      progf = document.getElementById('progf'),
      secname = document.getElementById('secname'),
      toc = document.getElementById('toc'),
      toclist = document.getElementById('toclist'),
      notes = document.getElementById('notes'),
      notesbody = document.getElementById('notesbody');

  /* ---- build the index, grouped by section ---- */
  var groups = [], last = null;
  slides.forEach(function(s, n){
    var sec = s.getAttribute('data-sec') || '';
    if (sec !== last) { groups.push({sec: sec, items: []}); last = sec; }
    var h = s.querySelector('h2, h1'), q = s.querySelector('.qtag');
    var t = h ? h.textContent.trim() : sec;
    if (q) t = q.textContent.trim() + ' \u2014 ' + t;
    groups[groups.length-1].items.push({n: n, t: t});
  });
  groups.forEach(function(g){
    var d = document.createElement('div'); d.className = 'grp';
    var hd = document.createElement('div'); hd.className = 'grph'; hd.textContent = g.sec; d.appendChild(hd);
    g.items.forEach(function(it){
      var a = document.createElement('a');
      a.href = '#'; a.dataset.n = it.n;
      a.innerHTML = '<span class="n">' + (it.n + 1) + '</span>';
      a.appendChild(document.createTextNode(it.t));
      a.addEventListener('click', function(e){ e.preventDefault(); go(it.n); toc.classList.remove('on'); });
      d.appendChild(a);
    });
    toclist.appendChild(d);
  });
  var tocLinks = Array.prototype.slice.call(toclist.querySelectorAll('a'));

  function go(n){
    if (n < 0) n = 0;
    if (n > total - 1) n = total - 1;
    slides[i].classList.remove('active');
    i = n;
    slides[i].classList.add('active');
    num.textContent = (i + 1) + ' / ' + total;
    progf.style.width = ((i + 1) / total * 100) + '%';
    secname.textContent = slides[i].getAttribute('data-sec') || '';
    notesbody.textContent = slides[i].getAttribute('data-notes') || 'No notes for this slide.';
    tocLinks.forEach(function(a){ a.classList.toggle('cur', +a.dataset.n === i); });
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  /* ---- scale the 1280x720 stage to the available space ---- */
  function fit(){
    var w = document.getElementById('wrap');
    var s = Math.min(w.clientWidth / 1280, w.clientHeight / 720);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){
    var n = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(n) && n - 1 !== i) go(n - 1);
  });

  document.getElementById('bnext').addEventListener('click', function(){ go(i + 1); });
  document.getElementById('bprev').addEventListener('click', function(){ go(i - 1); });
  document.getElementById('btoc').addEventListener('click', function(){ toc.classList.toggle('on'); });
  document.getElementById('bnotes').addEventListener('click', function(){ notes.classList.toggle('on'); });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(i - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(total - 1); }
    else if (k === 't' || k === 'T') { toc.classList.toggle('on'); }
    else if (k === 'n' || k === 'N') { notes.classList.toggle('on'); }
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if (k === 'Escape') { toc.classList.remove('on'); notes.classList.remove('on'); }
  });

  fit();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(isNaN(start) ? 0 : start - 1);
})();
</script>
</body>
</html>
