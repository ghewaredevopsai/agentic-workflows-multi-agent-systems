<div class="slide div" data-sec="Memory" data-notes="Module 1 named the three memory types in one slide. This section is about what each actually costs you and where each one breaks.">
  <div class="k">Part one</div>
  <h1>Memory that survives</h1>
</div>

<div class="slide" data-sec="Memory" data-notes="Three kinds, three different lifetimes and three different governance problems. The right-hand column is the one a bank asks about first -- long-term memory is a data store, with everything that implies.">
  <h2>Three memories, three lifetimes, three governance problems</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="Short-term, long-term and episodic memory compared">
      <line x1="60" y1="92" x2="1120" y2="92" stroke="#4338ca" stroke-width="2"/>
      <text x="70" y="74" class="lbl">&nbsp;</text>
      <text x="330" y="74" text-anchor="middle" class="lbl">Short-term</text>
      <text x="640" y="74" text-anchor="middle" class="lbl">Long-term</text>
      <text x="950" y="74" text-anchor="middle" class="lbl">Episodic</text>

      <text x="70" y="132" class="bxs">Holds</text>
      <text x="330" y="132" text-anchor="middle" class="bd">this conversation</text>
      <text x="640" y="132" text-anchor="middle" class="bd">facts worth keeping</text>
      <text x="950" y="132" text-anchor="middle" class="bd">what happened last time</text>
      <line x1="60" y1="150" x2="1120" y2="150" stroke="#eef2ff" stroke-width="1.5"/>

      <text x="70" y="186" class="bxs">Lives in</text>
      <text x="330" y="186" text-anchor="middle" class="bd">the context window</text>
      <text x="640" y="186" text-anchor="middle" class="bd">a store you own</text>
      <text x="950" y="186" text-anchor="middle" class="bd">a run log</text>
      <line x1="60" y1="204" x2="1120" y2="204" stroke="#eef2ff" stroke-width="1.5"/>

      <text x="70" y="240" class="bxs">Dies when</text>
      <text x="330" y="240" text-anchor="middle" class="bd">the session ends</text>
      <text x="640" y="240" text-anchor="middle" class="bd">you delete it</text>
      <text x="950" y="240" text-anchor="middle" class="bd">you prune it</text>
      <line x1="60" y1="258" x2="1120" y2="258" stroke="#eef2ff" stroke-width="1.5"/>

      <text x="70" y="294" class="bxs">Fails by</text>
      <text x="330" y="294" text-anchor="middle" class="bd no">crowding the window</text>
      <text x="640" y="294" text-anchor="middle" class="bd no">going stale, or leaking</text>
      <text x="950" y="294" text-anchor="middle" class="bd no">teaching a past mistake</text>
      <line x1="60" y1="312" x2="1120" y2="312" stroke="#4338ca" stroke-width="2"/>

      <text x="70" y="352" class="bxs am">Governance</text>
      <text x="330" y="352" text-anchor="middle" class="bds am">none &mdash; it is transient</text>
      <text x="640" y="352" text-anchor="middle" class="bds am">retention, PII, right to erase</text>
      <text x="950" y="352" text-anchor="middle" class="bds am">who may read past cases?</text>
      <text x="590" y="396" text-anchor="middle" class="bd">The moment memory persists, it stops being an implementation detail.</text>
    </svg>
  </div>
  <div class="take"><b>The line to remember:</b> long-term memory is a database with a friendly name. Module 8 asks what may enter it; here we make it work.</div>
</div>

<div class="slide" data-sec="Memory" data-notes="The arithmetic that decides everything. Buffer memory is linear in turns and the window is fixed, so there is always a turn N at which the earliest instruction falls out. Ask the room to guess N for their own assistant.">
  <h2>Why buffer memory always fails, eventually</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="Buffer memory growth against a fixed context window">
      <text x="300" y="44" text-anchor="middle" class="lbl">Buffer &mdash; keep everything</text>
      <rect x="70" y="62" width="460" height="40" rx="4" fill="#eef2ff" stroke="#818cf8"/>
      <rect x="70" y="62" width="90" height="40" rx="4" fill="#4338ca"/>
      <text x="115" y="88" text-anchor="middle" font-size="12" fill="#fff">turn 5</text>
      <text x="560" y="88" class="bds ok">fits</text>

      <rect x="70" y="116" width="460" height="40" rx="4" fill="#eef2ff" stroke="#818cf8"/>
      <rect x="70" y="116" width="270" height="40" rx="4" fill="#4338ca"/>
      <text x="205" y="142" text-anchor="middle" font-size="12" fill="#fff">turn 20</text>
      <text x="560" y="142" class="bds">fits</text>

      <rect x="70" y="170" width="460" height="40" rx="4" fill="#eef2ff" stroke="#818cf8"/>
      <rect x="70" y="170" width="460" height="40" rx="4" fill="#b91c1c"/>
      <text x="300" y="196" text-anchor="middle" font-size="12" fill="#fff">turn 40 &mdash; window full</text>
      <text x="560" y="196" class="bds no">the system prompt is now</text>
      <text x="560" y="216" class="bds no">the oldest thing in it</text>

      <rect x="70" y="240" width="460" height="40" rx="4" fill="#eef2ff" stroke="#818cf8"/>
      <rect x="70" y="240" width="460" height="40" rx="4" fill="#b91c1c"/>
      <path d="M70 260 L40 260" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#ar)"/>
      <text x="300" y="266" text-anchor="middle" font-size="12" fill="#fff">turn 60 &mdash; the earliest turns fall out</text>
      <text x="300" y="316" text-anchor="middle" class="bx no">The agent stops obeying constraints</text>
      <text x="300" y="342" text-anchor="middle" class="bx no">it was given at the start.</text>
      <text x="300" y="376" text-anchor="middle" class="bds">And nothing errors. It just gets worse.</text>

      <line x1="620" y1="50" x2="620" y2="390" stroke="#e2e8f0" stroke-width="2"/>

      <text x="880" y="44" text-anchor="middle" class="lbl">Summary &mdash; keep the recent, fold the rest</text>
      <rect x="680" y="62" width="400" height="40" rx="4" fill="#eef2ff" stroke="#818cf8"/>
      <rect x="680" y="62" width="70" height="40" rx="4" fill="#fbbf24"/>
      <text x="715" y="88" text-anchor="middle" font-size="11" fill="#3b2708">summary</text>
      <rect x="756" y="62" width="120" height="40" rx="4" fill="#4338ca"/>
      <text x="816" y="88" text-anchor="middle" font-size="12" fill="#fff">recent turns</text>
      <text x="880" y="130" text-anchor="middle" class="bd">turn 20</text>

      <rect x="680" y="152" width="400" height="40" rx="4" fill="#eef2ff" stroke="#818cf8"/>
      <rect x="680" y="152" width="110" height="40" rx="4" fill="#fbbf24"/>
      <text x="735" y="178" text-anchor="middle" font-size="11" fill="#3b2708">summary</text>
      <rect x="796" y="152" width="120" height="40" rx="4" fill="#4338ca"/>
      <text x="856" y="178" text-anchor="middle" font-size="12" fill="#fff">recent turns</text>
      <text x="880" y="220" text-anchor="middle" class="bd">turn 60 &mdash; still bounded</text>

      <rect x="700" y="252" width="360" height="106" rx="7" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
      <text x="880" y="284" text-anchor="middle" class="bx ok">Bounded, but lossy</text>
      <text x="880" y="314" text-anchor="middle" class="bd">You chose what to forget. The question</text>
      <text x="880" y="338" text-anchor="middle" class="bd">is whether you chose deliberately.</text>
    </svg>
  </div>
  <div class="take"><b>Compaction is a product decision, not a technical one:</b> something is being thrown away, and you are picking what.</div>
</div>

<div class="slide div" data-sec="Perception" data-notes="The most under-taught topic in this course. Agents fail on perception far more often than on reasoning, and it looks like a reasoning failure every time.">

  <h1>Perception</h1>
</div>

<div class="slide" data-sec="Perception" data-notes="Same fact, three renderings. The middle one is what most tools return. The right one is what the model can actually act on. Emphasise: this is free accuracy -- no model change, no extra call.">
  <h2>Raw output is not an observation</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="The same tool result rendered three ways">
      <rect x="50" y="56" width="340" height="300" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="220" y="90" text-anchor="middle" class="bx no">Raw dump</text>
      <rect x="75" y="110" width="290" height="120" rx="4" fill="#fff" stroke="#fecaca"/>
      <text x="90" y="134" font-size="11.5" font-family="Consolas,monospace" fill="#475569">{"i":1003,"a":990000.0,</text>
      <text x="90" y="156" font-size="11.5" font-family="Consolas,monospace" fill="#475569">"c":"USD","s":2,"rc":7,</text>
      <text x="90" y="178" font-size="11.5" font-family="Consolas,monospace" fill="#475569">"vd":"2026-09-02","cp":19,</text>
      <text x="90" y="200" font-size="11.5" font-family="Consolas,monospace" fill="#475569">"f":null,"x":[],"ts":17...}</text>
      <text x="220" y="262" text-anchor="middle" class="bd">Everything the system knows.</text>
      <text x="220" y="290" text-anchor="middle" class="bds">The model must guess that s=2</text>
      <text x="220" y="312" text-anchor="middle" class="bds">means held and rc=7 is a limit breach.</text>
      <text x="220" y="340" text-anchor="middle" class="bxs no">It will guess wrong.</text>

      <rect x="410" y="56" width="340" height="300" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="2.5"/>
      <text x="580" y="90" text-anchor="middle" class="bx am">Verbose but decoded</text>
      <rect x="435" y="110" width="290" height="120" rx="4" fill="#fff" stroke="#fde68a"/>
      <text x="450" y="134" font-size="11.5" font-family="Consolas,monospace" fill="#475569">{"ref":"PMT-1003",</text>
      <text x="450" y="156" font-size="11.5" font-family="Consolas,monospace" fill="#475569"> "amount":990000.0,</text>
      <text x="450" y="178" font-size="11.5" font-family="Consolas,monospace" fill="#475569"> "status":"held",</text>
      <text x="450" y="200" font-size="11.5" font-family="Consolas,monospace" fill="#475569"> "reason":"LIMIT_BREACH"...}</text>
      <text x="580" y="262" text-anchor="middle" class="bd">Readable, and complete.</text>
      <text x="580" y="290" text-anchor="middle" class="bds">Costs tokens on every step, and</text>
      <text x="580" y="312" text-anchor="middle" class="bds">buries the one field that matters.</text>
      <text x="580" y="340" text-anchor="middle" class="bxs am">Workable. Not free.</text>

      <rect x="770" y="56" width="360" height="300" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
      <text x="950" y="90" text-anchor="middle" class="bx ok">An observation</text>
      <rect x="795" y="110" width="310" height="120" rx="4" fill="#fff" stroke="#99f6e4"/>
      <text x="810" y="138" font-size="12" font-family="Consolas,monospace" fill="#0d9488">PMT-1003 is HELD.</text>
      <text x="810" y="162" font-size="12" font-family="Consolas,monospace" fill="#475569">Reason: LIMIT_BREACH</text>
      <text x="810" y="186" font-size="12" font-family="Consolas,monospace" fill="#475569">USD 990,000 &gt; 500,000 limit.</text>
      <text x="810" y="210" font-size="12" font-family="Consolas,monospace" fill="#b91c1c">Human decision required.</text>
      <text x="950" y="262" text-anchor="middle" class="bd">The fact, its meaning, and</text>
      <text x="950" y="286" text-anchor="middle" class="bd">the constraint it implies.</text>
      <text x="950" y="322" text-anchor="middle" class="bxs ok">Fewer tokens than the middle box,</text>
      <text x="950" y="344" text-anchor="middle" class="bxs ok">and far harder to misread.</text>
    </svg>
  </div>
  <div class="take"><b>Perception is where the cheapest accuracy lives.</b> No model change, no extra call &mdash; just deciding what the agent gets to see.</div>
</div>

<div class="slide" data-sec="Perception" data-notes="The blind spots. Every one of these has caused a production incident somewhere. The last is the nastiest: an empty result and a failed query look identical unless the tool says which.">
  <h2>What the agent cannot see</h2>
  <div class="body">
    <svg width="1180" height="410" viewBox="0 0 1180 410" role="img" aria-label="Four things absent from a tool result that the agent will assume">
      <g>
        <rect x="60" y="56" width="510" height="130" rx="7" fill="#f8f8fd" stroke="#cbd5e1" stroke-width="2"/>
        <text x="90" y="88" class="lbl">01</text>
        <text x="315" y="112" text-anchor="middle" class="bx">Freshness</text>
        <text x="315" y="142" text-anchor="middle" class="bd">A record from a cache two hours stale looks</text>
        <text x="315" y="164" text-anchor="middle" class="bd">exactly like a live one. Stamp it, or it lies.</text>
      </g>
      <g>
        <rect x="610" y="56" width="510" height="130" rx="7" fill="#f8f8fd" stroke="#cbd5e1" stroke-width="2"/>
        <text x="640" y="88" class="lbl">02</text>
        <text x="865" y="112" text-anchor="middle" class="bx">Completeness</text>
        <text x="865" y="142" text-anchor="middle" class="bd">A page-one result reads as the whole answer.</text>
        <text x="865" y="164" text-anchor="middle" class="bd">Say &ldquo;3 of 47 shown&rdquo; or it will conclude on 3.</text>
      </g>
      <g>
        <rect x="60" y="206" width="510" height="130" rx="7" fill="#f8f8fd" stroke="#cbd5e1" stroke-width="2"/>
        <text x="90" y="238" class="lbl">03</text>
        <text x="315" y="262" text-anchor="middle" class="bx">Authority</text>
        <text x="315" y="292" text-anchor="middle" class="bd">A draft policy and a ratified one are both text.</text>
        <text x="315" y="314" text-anchor="middle" class="bd">Mark which is binding.</text>
      </g>
      <g>
        <rect x="610" y="206" width="510" height="130" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
        <text x="640" y="238" class="lbl">04</text>
        <text x="865" y="262" text-anchor="middle" class="bx no">Absence vs. failure</text>
        <text x="865" y="292" text-anchor="middle" class="bd">&ldquo;No sanctions hits&rdquo; and &ldquo;the sanctions check</text>
        <text x="865" y="314" text-anchor="middle" class="bd">did not run&rdquo; are the same empty list.</text>
      </g>
      <text x="590" y="384" text-anchor="middle" class="bx am">The agent will assume the reassuring reading of every one of these.</text>
    </svg>
  </div>
  <div class="take"><b>Design rule:</b> a tool that returns nothing must say <em>which kind of nothing</em>. Lab 3.2 builds exactly that.</div>
</div>

<div class="slide div" data-sec="The graph" data-notes="Now the substrate. The single idea: state stops being something hidden in a conversation and becomes an object you can print, assert on, and store.">
  <div class="k">Part three</div>
  <h1>State, made explicit</h1>
</div>

<div class="slide" data-sec="The graph" data-notes="The core contrast of the module. On the left, state is implicit in a growing message list -- you cannot inspect it, test it or resume it. On the right it is a dict with a schema. Everything else in LangGraph follows from that one move.">
  <h2>From a message list to an object you can inspect</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="Implicit conversational state compared with an explicit state object">
      <rect x="50" y="52" width="500" height="310" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="300" y="86" text-anchor="middle" class="bx no">State hidden in a conversation</text>
      <rect x="80" y="108" width="440" height="28" rx="3" fill="#fff" stroke="#fecaca"/>
      <text x="95" y="127" font-size="12" fill="#64748b">human: investigate PMT-1003</text>
      <rect x="80" y="142" width="440" height="28" rx="3" fill="#fff" stroke="#fecaca"/>
      <text x="95" y="161" font-size="12" fill="#64748b">ai: Action: lookup_payment("PMT-1003")</text>
      <rect x="80" y="176" width="440" height="28" rx="3" fill="#fff" stroke="#fecaca"/>
      <text x="95" y="195" font-size="12" fill="#64748b">tool: {"status":"held", ...}</text>
      <rect x="80" y="210" width="440" height="28" rx="3" fill="#fff" stroke="#fecaca"/>
      <text x="95" y="229" font-size="12" fill="#64748b">ai: Action: policy_for("LIMIT_BREACH")</text>
      <text x="300" y="272" text-anchor="middle" class="bd">Where is &ldquo;needs a human&rdquo; stored?</text>
      <text x="300" y="300" text-anchor="middle" class="bxs no">Nowhere. It is implied by text.</text>
      <text x="300" y="330" text-anchor="middle" class="bds">You cannot assert on it, resume it,</text>
      <text x="300" y="350" text-anchor="middle" class="bds">or show an auditor what was known when.</text>

      <line x1="565" y1="200" x2="605" y2="200" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>

      <rect x="630" y="52" width="500" height="310" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
      <text x="880" y="86" text-anchor="middle" class="bx ok">State as an explicit object</text>
      <rect x="660" y="108" width="440" height="150" rx="4" fill="#fff" stroke="#99f6e4"/>
      <text x="678" y="132" font-size="12.5" font-family="Consolas,monospace" fill="#0d9488">class CaseState(TypedDict):</text>
      <text x="678" y="156" font-size="12.5" font-family="Consolas,monospace" fill="#475569">    ref: str</text>
      <text x="678" y="180" font-size="12.5" font-family="Consolas,monospace" fill="#475569">    findings: Annotated[list, add]</text>
      <text x="678" y="204" font-size="12.5" font-family="Consolas,monospace" fill="#475569">    needs_human: bool</text>
      <text x="678" y="228" font-size="12.5" font-family="Consolas,monospace" fill="#475569">    steps: int</text>
      <text x="678" y="250" font-size="12.5" font-family="Consolas,monospace" fill="#b91c1c">    # every node reads and writes THIS</text>
      <text x="880" y="292" text-anchor="middle" class="bd">Printable. Assertable. Storable.</text>
      <text x="880" y="322" text-anchor="middle" class="bxs ok">Everything else in this module</text>
      <text x="880" y="344" text-anchor="middle" class="bxs ok">follows from that one move.</text>
    </svg>
  </div>
  <div class="take"><b>This is why we drop to LangGraph.</b> Not for the graph &mdash; for the state the graph forces you to declare.</div>
</div>

<div class="slide" data-sec="The graph" data-notes="Four parts, and only four. Walk the payment-exception graph left to right, then point at the cycle: that is the loop from Module 1, now drawn rather than implied.">

      <line x1="345" y1="150" x2="400" y2="150" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>

      <rect x="407" y="120" width="170" height="60" rx="6" fill="#4338ca"/>
      <text x="492" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">read_policy</text>
      <text x="492" y="166" text-anchor="middle" font-size="11" fill="#c7d2fe">writes: findings</text>
      <line x1="577" y1="150" x2="632" y2="150" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>

      <text x="948" y="146" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">write_note</text>

      <line x1="1033" y1="150" x2="1078" y2="150" stroke="#4338ca" stroke-width="2.5" marker-end="url(#ai)"/>

<div class="slide" data-sec="The graph" data-notes="Reducers are the piece people skip and then debug for a day. Default is replace; for anything accumulating you must say so. The parallel case on the right is where it becomes non-negotiable.">
  <h2>Reducers &mdash; what happens when two nodes write the same key</h2>
  <div class="body">
    <svg width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="Replace versus append reducers, and why parallel branches need them">
      <rect x="50" y="52" width="510" height="150" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="305" y="84" text-anchor="middle" class="bx no">Default: replace</text>
      <text x="80" y="118" font-size="12.5" font-family="Consolas,monospace" fill="#475569">findings: list</text>
      <text x="305" y="150" text-anchor="middle" class="bd">node A writes ["held"], then node B</text>
      <text x="305" y="172" text-anchor="middle" class="bd">writes ["needs treasury"] &mdash; and A is gone.</text>
      <text x="305" y="194" text-anchor="middle" class="bds no">Silently. No error, no warning.</text>

      <rect x="50" y="222" width="510" height="150" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="2.5"/>
      <text x="305" y="254" text-anchor="middle" class="bx ok">Declared: append</text>
      <text x="80" y="288" font-size="12.5" font-family="Consolas,monospace" fill="#0d9488">findings: Annotated[list, add]</text>
      <text x="305" y="320" text-anchor="middle" class="bd">Both writes survive, in order.</text>
      <text x="305" y="342" text-anchor="middle" class="bd">The reducer says how to merge, once,</text>
      <text x="305" y="364" text-anchor="middle" class="bds ok">instead of every node remembering to.</text>

      <line x1="600" y1="60" x2="600" y2="380" stroke="#e2e8f0" stroke-width="2"/>

      <text x="880" y="80" text-anchor="middle" class="lbl">Where it stops being optional</text>
      <rect x="800" y="98" width="160" height="46" rx="5" fill="#4338ca"/>
      <text x="880" y="126" text-anchor="middle" font-size="13" fill="#fff">fan out</text>
      <line x1="840" y1="144" x2="740" y2="186" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <line x1="880" y1="144" x2="880" y2="186" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <line x1="920" y1="144" x2="1020" y2="186" stroke="#4338ca" stroke-width="2" marker-end="url(#ai)"/>
      <rect x="660" y="192" width="160" height="46" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
      <text x="740" y="220" text-anchor="middle" class="bds">ledger</text>
      <rect x="800" y="192" width="160" height="46" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
      <text x="880" y="220" text-anchor="middle" class="bds">policy</text>
      <rect x="940" y="192" width="160" height="46" rx="5" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
      <text x="1020" y="220" text-anchor="middle" class="bds">counterparty</text>
      <line x1="740" y1="238" x2="840" y2="278" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
      <line x1="880" y1="238" x2="880" y2="278" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
      <line x1="1020" y1="238" x2="920" y2="278" stroke="#94a3b8" stroke-width="2" marker-end="url(#ag)"/>
      <rect x="800" y="284" width="160" height="46" rx="5" fill="#0d9488"/>
      <text x="880" y="312" text-anchor="middle" font-size="13" fill="#fff">join</text>
      <text x="880" y="356" text-anchor="middle" class="bx no">Three writes, one key.</text>
      <text x="880" y="380" text-anchor="middle" class="bds">Without a reducer, two findings vanish.</text>
    </svg>

  <div class="take"><b>The rule:</b> any key more than one node writes needs a declared reducer. Default-replace plus parallelism is silent data loss.</div>
</div>

<div class="slide div" data-sec="Checkpoints" data-notes="The part that turns a demo into something operable -- and the part a bank cares about most, because it is also the audit trail.">
  <div class="k">Part four</div>
  <h1>Checkpoints</h1>
</div>

      <g stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3">

      <text x="447" y="164" text-anchor="middle" class="bxs am">checkpoint 1 &middot; 2 &middot; 3 &middot; 4 &mdash; each a complete, replayable state</text>

<div class="slide div" data-sec="Shared memory" data-notes="The bridge into Day 2. Everything so far has been one agent. The moment there are several, memory becomes a design decision with a failure mode nobody expects.">
  <div class="k">Part five</div>
  <h1>When several agents share a memory</h1>
</div>

<div class="slide" data-sec="Shared memory" data-notes="Two designs, and the trade is real. Shared state is efficient and propagates errors; private state isolates and duplicates work. Most production systems end up mixed -- shared facts, private drafts.">
  <h2>Shared or private &mdash; and what each one breaks</h2>

    <div class="why"><b>Why:</b> B describes private state, which contains an error but re-sends context and duplicates work. D is backwards: sharing is precisely when reducers become mandatory. Most production systems end up mixed -- shared facts, private drafts.</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  stage.appendChild(document.getElementById('deck').content.cloneNode(true));
  var slides = Array.prototype.slice.call(stage.querySelectorAll('.slide'));
  var i = 0, total = slides.length;

  var num = document.getElementById('num'),
      progf = document.getElementById('progf'),
      secname = document.getElementById('secname'),
      toc = document.getElementById('toc'),
      toclist = document.getElementById('toclist'),
      notes = document.getElementById('notes'),
      notesbody = document.getElementById('notesbody');

  /* ---- build the index, grouped by section ---- */
  var groups = [], last = null;
  slides.forEach(function(s, n){
    var sec = s.getAttribute('data-sec') || '';
    if (sec !== last) { groups.push({sec: sec, items: []}); last = sec; }
    var h = s.querySelector('h2, h1'), q = s.querySelector('.qtag');
    var t = h ? h.textContent.trim() : sec;
    if (q) t = q.textContent.trim() + ' \u2014 ' + t;
    groups[groups.length-1].items.push({n: n, t: t});
  });
  groups.forEach(function(g){
    var d = document.createElement('div'); d.className = 'grp';
    var hd = document.createElement('div'); hd.className = 'grph'; hd.textContent = g.sec; d.appendChild(hd);
    g.items.forEach(function(it){
      var a = document.createElement('a');
      a.href = '#'; a.dataset.n = it.n;
      a.innerHTML = '<span class="n">' + (it.n + 1) + '</span>';
      a.appendChild(document.createTextNode(it.t));
      a.addEventListener('click', function(e){ e.preventDefault(); go(it.n); toc.classList.remove('on'); });
      d.appendChild(a);
    });
    toclist.appendChild(d);
  });
  var tocLinks = Array.prototype.slice.call(toclist.querySelectorAll('a'));

  function go(n){
    if (n < 0) n = 0;
    if (n > total - 1) n = total - 1;
    slides[i].classList.remove('active');
    i = n;
    slides[i].classList.add('active');
    num.textContent = (i + 1) + ' / ' + total;
    progf.style.width = ((i + 1) / total * 100) + '%';
    secname.textContent = slides[i].getAttribute('data-sec') || '';
    notesbody.textContent = slides[i].getAttribute('data-notes') || 'No notes for this slide.';
    tocLinks.forEach(function(a){ a.classList.toggle('cur', +a.dataset.n === i); });
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  /* ---- scale the 1280x720 stage to the available space ---- */
  function fit(){
    var w = document.getElementById('wrap');
    var s = Math.min(w.clientWidth / 1280, w.clientHeight / 720);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){
    var n = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(n) && n - 1 !== i) go(n - 1);
  });

  document.getElementById('bnext').addEventListener('click', function(){ go(i + 1); });
  document.getElementById('bprev').addEventListener('click', function(){ go(i - 1); });
  document.getElementById('btoc').addEventListener('click', function(){ toc.classList.toggle('on'); });
  document.getElementById('bnotes').addEventListener('click', function(){ notes.classList.toggle('on'); });

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); go(i + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(i - 1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(total - 1); }
    else if (k === 't' || k === 'T') { toc.classList.toggle('on'); }
    else if (k === 'n' || k === 'N') { notes.classList.toggle('on'); }
    else if (k === 'f' || k === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    }
    else if (k === 'Escape') { toc.classList.remove('on'); notes.classList.remove('on'); }
  });

  fit();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(isNaN(start) ? 0 : start - 1);
})();
</script>
</body>
</html>
